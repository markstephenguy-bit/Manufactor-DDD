policies:
  - id: policy.corrective-action.determine-nonconformity-admission
    name: Determine Nonconformity Admission
    bounded_context: bc.corrective-action
    purpose: Determine whether retained quality evidence is sufficient to admit a finding into the Corrective Action lifecycle as a Nonconformity without treating every concern or failed check as a Nonconformity automatically.
    inputs:
      - source Quality Concern or Quality Check evidence/reference
      - applicable requirement
      - retained evidence showing whether the requirement was fulfilled
      - authorized quality-review determination and rationale
    conditions:
      - The reviewer is management or a designated quality technician with formal quality-triage/promotion authority.
      - A specific applicable requirement can be identified.
      - The retained evidence is sufficient for the authorized reviewer to determine that the applicable requirement was not fulfilled.
    decision: Admit the finding as a Nonconformity only when the authorized reviewer explicitly determines from retained evidence that an identified applicable requirement was not fulfilled.
    resulting_commands:
      - AcceptNonconformity
    related_events:
      - QualityConcernDispositioned
      - QualityCheckEvaluated
      - NonconformityAccepted
    exceptions:
      - A Quality Concern by itself does not establish a Nonconformity.
      - A failed Quality Check by itself does not automatically establish a Nonconformity.
      - If the applicable requirement cannot be identified or the evidence is insufficient, retain the source quality record without admitting a Nonconformity.
      - A Quality Check is not a mandatory gate; sufficient retained concern evidence may support direct admission when the authorized reviewer can establish nonfulfillment of an applicable requirement.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Phase 14 Quality reconciliation, 2026-08-22
          description: Management and designated quality technicians control formal quality triage/promotion; a Quality Check is optional; sufficient evidence may allow direct promotion; failed checks do not automatically create Nonconformities.
        - type: decision
          reference: ISO 9000 / ISO 9001 conceptual vocabulary baseline adopted by ManuFactor DDD
          description: Nonconformity is modeled using the established quality-management meaning that an applicable requirement was not fulfilled, without creating a monolithic QMS context.
        - type: invariant-model
          reference: invariant.nonconformity.explicit-acceptance
          description: Entry into the Nonconformity lifecycle requires explicit supported acceptance rather than inference from a source finding.
      confidence: high
      status: candidate

  - id: policy.corrective-action.route-to-work-owner
    name: Route Corrective Work to Its Owning Context
    bounded_context: bc.corrective-action
    purpose: Determine where execution of a corrective task belongs without making CAPA a second owner of the routed work lifecycle.
    inputs:
      - Nonconformity identity
      - corrective task/work requirement
      - work class or responsibility being requested
      - known destination context/system ownership
    conditions:
      - The corrective task requires execution outside Corrective Action.
      - A context or existing system is authoritative for that class of execution work.
    decision: Route the corrective task to the context/system that owns execution of that work class while Corrective Action retains CAPA coordination, task/reference history, effectiveness-verification evidence, and closure semantics.
    resulting_commands:
      - RouteCorrectiveWork
    related_events:
      - NonconformityAccepted
      - CorrectiveWorkRouted
    exceptions:
      - If execution ownership cannot be established, do not guess a destination; leave routing unresolved for domain decision.
      - Routing must not create a duplicate local execution lifecycle inside Corrective Action.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, ISSUE-0002
          description: CAPA routes resulting work to the system/context that owns the actual work and must not become a second owner.
        - type: invariant-model
          reference: invariant.nonconformity.do-not-own-routed-work
          description: CAPA may coordinate routed work but cannot independently own destination execution state.
        - type: domain-expert
          reference: Mark direct, 2026-08-23 ISSUE-0010 clarification
          description: Corrective work is represented as tasks under the parent Nonconformity/CAPA.
      confidence: high
      status: candidate

  - id: policy.workforce-availability.replacement-eligibility
    name: Determine Operational Replacement Eligibility
    bounded_context: bc.workforce-availability
    purpose: Determine whether a person can validly cover a specific operational staffing need using authoritative qualification and availability facts without redefining either source model.
    inputs:
      - Staffing Gap
      - person reference
      - Operational Qualification reference/evidence for the required job
      - Operational Availability or authoritative absence/time facts for the required period
    conditions:
      - The staffing need identifies the required job/position and time/shift context.
      - The person is sufficiently Operationally Qualified for the required job under the current qualification record.
      - The person is operationally available for the required time.
    decision: A person is an eligible replacement option only when both qualification and availability are satisfied for the same staffing need; eligibility does not transfer ownership of qualification or HR/timekeeping facts into Workforce Availability.
    resulting_commands:
      - SelectReplacement
    related_events:
      - OperationalQualificationEstablished
      - OperationalQualificationWithdrawn
      - ReplacementSelected
    exceptions:
      - Availability alone is insufficient.
      - Qualification alone is insufficient.
      - A withdrawn or superseded qualification does not satisfy current qualification eligibility.
      - If qualification status or availability cannot be established, the person must not be treated as an eligible replacement under current evidence.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10 workforce clarification
          description: When someone calls in sick, Operations needs to know who can step into the job; coverage requires someone both available and qualified.
        - type: invariant-model
          reference: invariant.coverage.requires-qualified-and-available
          description: Selected operational coverage must satisfy both qualification and availability.
        - type: domain-expert
          reference: Mark direct, 2026-08-23 qualification lifecycle clarification
          description: Operational Qualification remains valid until explicitly withdrawn or superseded.
      confidence: high
      status: candidate

policy_modeling_notes:
  current_state:
    - Reliability Verification does not deterministically map a verification result to Asset state; Asset Lifecycle owns explicit state transitions after the maintenance-supervisor promotion decision.
    - Operational Qualification is established from job shadowing and observed practical capability and persists until explicit withdrawal or supersession.
    - LTV recording is governed by Safety Office receipt, scanning, matching to the originating electronic record, and transition to Recorded while retaining history.
    - Kiln/ProTrack moisture correlation is statistical by lumber dimension only; no run-level identity policy exists because the source data does not contain run identity.
    - CAPA corrective work is task-based and closure requires retained post-correction effectiveness verification.
  rule: Policies are created only for supported business decisions; they are not glue inserted merely to connect existing Events and Commands.
