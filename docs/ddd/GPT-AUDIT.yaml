    severity: consistency
    subject: Product Quality Verification placement
    finding: Mark's evidence establishes Product Quality Verification as Quality work, and the capability is already recorded as cap.product-quality-verification. The candidate Quality domain area currently lists only CAPA, leaving the active strategic model internally incomplete.
