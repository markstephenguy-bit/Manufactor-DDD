  subject: quality-responsibility-discovery
  instruction: Claude Code must not ask a strategic domain question. After these corrections are processed, ChatGPT will inspect targeted evidence in ManuFactor-arch and Manufactor for the next QMS-shaped responsibility, then ask Mark only for business knowledge or ownership decisions not established by that evidence.

