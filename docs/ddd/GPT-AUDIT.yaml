purpose: Temporary audit/control queue for Claude Code. Not domain evidence.

findings:
  - id: AUDIT-0003
    severity: correction
    subject: ISSUE-0002 interpretation
    finding: Mark confirmed Safety Sign-Off, CAPA, and Environmental are separate business responsibilities. He did not confirm that each responsibility is a separate Subdomain. The current confirmed Subdomain records overstate the domain-expert answer.
  - id: AUDIT-0004
    severity: correction
    subject: CAPA domain placement
    finding: Mark explicitly said CAPA is a quality aspect. Preserve that as domain truth. Do not equate CAPA itself with the full Quality Subdomain unless Mark establishes that boundary.
  - id: AUDIT-0005
    severity: correction
    subject: ISO 9001 semantics
    finding: Treat ISO 9001 as supporting Quality vocabulary/rules, not as a DDD boundary definition and not as evidence for the Project Tracking boundary.
  - id: AUDIT-0006
    severity: process
    subject: Domain-question ownership
    finding: ChatGPT now owns strategic domain discovery with Mark. Claude Code executes repository changes and must not independently ask Mark strategic questions unless explicitly delegated here.
  - id: AUDIT-0007
    severity: domain-correction
    subject: QMS ownership model
    finding: Mark states there is no QMS system that ManuFactor owns or replaces. QMS-shaped responsibilities must be evaluated individually because existing GP technology may already own some of them, including CMMS, SAP ERP, and other systems.
  - id: AUDIT-0008
    severity: domain-correction
    subject: ManuFactor system role
    finding: ManuFactor is a gap filler, current-system reader, and data aggregator. A responsibility appearing in ISO/QMS vocabulary does not imply ManuFactor owns that responsibility or that the responsibilities form one ManuFactor Subdomain or Bounded Context.
  - id: AUDIT-0009
    severity: process
    subject: Evidence-before-question discipline
    finding: Before ChatGPT asks Mark about a QMS-shaped responsibility, targeted evidence may be gathered from markstephenguy-bit/ManuFactor-arch and markstephenguy-bit/Manufactor to determine whether an existing GP system or previously designed integration already owns, supplies, or constrains that responsibility. Manufactor-DDD remains the canonical DDD source of truth.

required_actions:
  - id: ACTION-0004
    action: Change Safety Compliance & Procedure Sign-Off, Quality-CAPA, and Environmental Compliance from confirmed Subdomains back to candidate or unresolved strategic placement unless separate domain-expert evidence establishes each Subdomain boundary. Preserve Mark's confirmation that these are separate business responsibilities.
  - id: ACTION-0005
    action: Record CAPA as belonging to the Quality domain area/aspect. Do not name a Subdomain "Quality — Corrective & Preventive Action" as though CAPA exhausts Quality. Represent CAPA as a capability/process within a candidate Quality domain area until ChatGPT elicits the broader Quality boundary from Mark.
  - id: ACTION-0007
    action: Keep Project Tracking distinct as a capability candidate, but do not claim ISO 9001 establishes its boundary.
  - id: ACTION-0008
    action: Update SESSION-HANDOFF.yaml after corrections. Phase 5 remains blocked by unresolved strategic Subdomain boundaries that materially affect Bounded Context discovery.
  - id: ACTION-0009
    action: Update SESSION-HANDOFF.yaml to state that ChatGPT asks Mark strategic domain questions and Claude Code waits for GPT-AUDIT instructions rather than asking Mark directly.
  - id: ACTION-0010
    action: Record the domain principle that ManuFactor does not own or replace a monolithic QMS. QMS-shaped responsibilities are discovered individually and may be owned by existing GP systems, filled by ManuFactor where a gap exists, read from authoritative systems, aggregated across systems, or remain outside ManuFactor.
  - id: ACTION-0011
    action: Review any canonical or decision records that currently imply a single Quality/QMS ownership boundary and weaken or correct them so ISO/QMS grouping is not treated as a ManuFactor Subdomain boundary.
  - id: ACTION-0012
    action: Update SESSION-HANDOFF.yaml to authorize targeted evidence lookup in markstephenguy-bit/ManuFactor-arch and markstephenguy-bit/Manufactor before asking Mark a QMS-responsibility question. Do not authorize broad archaeology; lookup must be tied to the specific responsibility under discovery.

next_domain_question:
