findings:
  - id: AUDIT-0003
    severity: correction
    subject: ISSUE-0002 interpretation
    finding: Mark confirmed Safety Sign-Off, CAPA, and Environmental are separate business responsibilities. He did not confirm that each responsibility is a separate Subdomain. The current three confirmed Subdomain records overstate the domain-expert answer.
  - id: AUDIT-0004
    severity: correction
    subject: CAPA domain placement
    finding: Mark explicitly said CAPA is a quality aspect. Preserve that as domain truth. Do not equate CAPA itself with the full Quality Subdomain unless Mark establishes that boundary.
  - id: AUDIT-0005
    severity: correction
    subject: ISO 9001 semantics
    finding: ISO 9001:2015 places corrective action within the Quality Management System and uses risk-based thinking for prevention. Treat ISO as supporting vocabulary/rules for Quality, not as evidence that CAPA and Project Tracking define separate Subdomains.
  - id: AUDIT-0006
    severity: process
    subject: Phase 5 readiness
    finding: Do not start Bounded Context discovery from falsely confirmed Subdomain boundaries. First restore uncertainty at the Subdomain level while retaining Mark's confirmed capability/business-responsibility facts.

