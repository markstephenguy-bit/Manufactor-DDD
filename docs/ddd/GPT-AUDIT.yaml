status: pending
updated_by: chatgpt
purpose: Temporary audit/control queue for Claude Code. Not domain evidence.

findings:
  - id: AUDIT-0003
    severity: correction
    subject: ISSUE-0002 interpretation
    finding: Mark confirmed Safety Sign-Off, CAPA, and Environmental are separate business responsibilities. He did not confirm that each responsibility is a separate Subdomain.
  - id: AUDIT-0004
    severity: correction
    subject: CAPA domain placement
    finding: Mark explicitly said CAPA is a quality aspect. CAPA does not define the full Quality Subdomain.
  - id: AUDIT-0005
    severity: correction
    subject: ISO 9001 semantics
    finding: ISO 9001 supplies supporting Quality vocabulary/rules only. It does not establish ManuFactor DDD boundaries.
  - id: AUDIT-0007
    severity: domain-correction
    subject: QMS ownership model
    finding: There is no monolithic QMS that ManuFactor owns or replaces. QMS-shaped responsibilities must be evaluated individually because GP systems such as CMMS, SAP ERP, and others may already own them.
  - id: AUDIT-0008
    severity: domain-correction
    subject: ManuFactor system role
    finding: ManuFactor is a gap filler, current-system reader, and data aggregator. Displaying, reading, correlating, or aggregating responsibility data does not establish ownership of that responsibility.
  - id: AUDIT-0010
    severity: verified-correction
    subject: strategic subdomain rollback
    finding: Current docs/ddd/subdomains/index.yaml has already rolled Safety Compliance & Procedure Sign-Off, Quality, and Environmental Compliance Reporting back to candidate status and explicitly avoids treating separate responsibilities as confirmed Subdomains.
  - id: AUDIT-0011
    severity: consistency
    subject: missing blocking issue
    finding: SESSION-HANDOFF.yaml lists quality-responsibility-discovery as a blocking issue, but docs/ddd/issues/unresolved.yaml does not contain that issue.
  - id: AUDIT-0012
    severity: consistency
    subject: Product Quality Verification placement
    finding: Mark's evidence establishes Product Quality Verification as Quality work, and the capability is already recorded as cap.product-quality-verification. The candidate Quality domain area currently lists only CAPA, leaving the active strategic model internally incomplete.
  - id: AUDIT-0013
    severity: notation
    subject: capability confirmation semantics
    finding: cap.safety-compliance-signoff, cap.corrective-preventive-action, and cap.environmental-compliance may remain confirmed capabilities because Mark confirmed the responsibilities themselves. Their confirmed capability status must not be interpreted as confirmed Subdomain status.
  - id: AUDIT-0014
    severity: domain-evidence
    subject: product quality target classes
    finding: Mark states that target sizes are mill- and machine-specific, while planed finished-lumber target sizes are standard market sizes. GP employs SPIB to monitor finished sizes. This establishes distinct target contexts within Product Quality Verification but does not establish a separate Subdomain boundary or ManuFactor ownership.
  - id: AUDIT-0015
    severity: domain-evidence
    subject: process target governance
    finding: Machine setups dictate process target sizes. These are maintained at mill level with Lumber Division monitoring. Different machine/process paths can have different target and acceptance logic, including canter vs edger targets and trimmer board-inside-a-board acceptance.
  - id: AUDIT-0016
    severity: process-correction
    subject: strategic discovery depth
    finding: Product Quality Verification has enough evidence for strategic DDD. Do not continue asking Mark about storage mechanisms, recipes, spreadsheets, machine configuration details, or other implementation-level target-source questions unless a later strategic boundary question materially requires them.
  - id: AUDIT-0017
    severity: domain-confirmation
    subject: Quality candidate strategic placement
    finding: Mark confirmed that Quality should proceed as the broader candidate Subdomain containing CAPA and Product Quality Verification, while additional Quality responsibilities remain open for later discovery and do not need exhaustive enumeration before strategic discovery progresses.
  - id: AUDIT-0018
    severity: domain-evidence
    subject: Safety strategic breadth
    finding: Mark states that Safety is a department at every mill. This is evidence that Safety Sign-Off is not the whole Safety business area. Organizational structure supports a broader Safety domain-area candidate, but department structure alone must not be treated as proof of a DDD Subdomain boundary.
  - id: AUDIT-0019
    severity: domain-confirmation
    subject: Safety Environmental and HR candidate placement
    finding: Mark confirmed that Safety, Environmental, and HR should each proceed as broader candidate strategic domain areas, with currently known responsibilities placed inside them and additional responsibilities left open for later discovery. This confirms candidate strategic placement, not Bounded Contexts and not exhaustive capability scope.
  - id: AUDIT-0020
    severity: process-correction
    subject: governing modeling specification
    finding: ManuFactor_DDD_Modeling_Specification.docx is the normative DDD modeling and notation specification for this project and must guide strategic discovery together with the canonical repository state. It must not be omitted from future session startup guidance.
  - id: AUDIT-0021
    severity: domain-confirmation
    subject: Maintenance Reliability candidate placement
    finding: Mark confirmed Maintenance/Reliability as the broader candidate strategic domain area. The existing CMMS may own much of the operational maintenance work while ManuFactor fills gaps and reads or aggregates selected asset/reliability information. Existing-system ownership does not eliminate the business domain area and does not imply ManuFactor owns all of it.

