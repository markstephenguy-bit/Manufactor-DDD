  - id: ACTION-0023
    action: Replace the overly narrow strategic candidate name Safety Compliance & Procedure Sign-Off with broader candidate Safety containing cap.safety-compliance-signoff. Keep status candidate and do not infer organizational and DDD boundaries are identical.
  - id: ACTION-0024
    action: Replace the overly narrow strategic candidate Environmental Compliance Reporting with broader candidate Environmental containing cap.environmental-compliance. Keep status candidate; additional Environmental responsibilities remain open.
  - id: ACTION-0025
    action: Rename/reframe the current People & Workforce strategic candidate as HR or Human Resources if consistent with the repository metamodel/naming discipline, preserving currently known workforce/training capabilities inside it. Keep status candidate and leave additional HR responsibilities open. Do not infer that existing HR systems imply ManuFactor ownership.
  - id: ACTION-0026
    action: Update CLAUDE.md and SESSION-HANDOFF.yaml so ManuFactor_DDD_Modeling_Specification.docx is explicitly required as the normative modeling/notation authority for every strategic DDD session before active canonical model files are interpreted. Do not duplicate its detailed rules into canonical YAML.
  - id: ACTION-0027
    action: Reframe subdomain.asset-reliability as broader candidate Maintenance/Reliability, preserving the currently relevant physical-asset and equipment-reliability capabilities as known responsibilities. Keep status candidate. Explicitly preserve that CMMS ownership of operational maintenance work and ManuFactor's reader/aggregator/gap-filler role are system-responsibility facts, not reasons to remove the strategic domain area.

