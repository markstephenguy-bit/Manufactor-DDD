  - id: ACTION-0005
    action: Record CAPA as belonging to the Quality domain area/aspect. Do not name the Subdomain "Quality — Corrective & Preventive Action" as though CAPA exhausts Quality. Represent CAPA as a capability/process within a candidate Quality domain area until the broader Quality boundary is elicited.
  - id: ACTION-0006
    action: Re-open the strategic question at the correct abstraction level: what other responsibilities belong to Quality besides CAPA, and what defines the Quality boundary? Do not ask whether CAPA is distinct from Project Tracking again.
