    severity: verified-correction
    subject: strategic subdomain rollback
    finding: Current docs/ddd/subdomains/index.yaml has already rolled Safety Compliance & Procedure Sign-Off, Quality, and Environmental Compliance Reporting back to candidate status and explicitly avoids treating separate responsibilities as confirmed Subdomains.
