findings:
  - id: AUDIT-0026
    severity: strategic-consolidation
    subject: Phase 4 whole-domain map
    finding: ChatGPT completed a whole-domain Phase 4 consolidation under ManuFactor_DDD_Modeling_Specification.docx rather than continuing capability-by-capability interrogation. The active candidate business Subdomains are Operations, Quality, Maintenance / Reliability, Safety, Environmental, and Human Resources.
  - id: AUDIT-0027
    severity: strategic-correction
    subject: Operations scope
    finding: Operations represents ManuFactor gaps under mill operations, not ERP/MES/production-execution ownership. cap.project-tracking belongs directly under Operations; Projects / Continuous Improvement is not a required intermediate or peer Subdomain.
  - id: AUDIT-0028
    severity: strategic-correction
    subject: non-domain infrastructure and tooling
    finding: Identity & Access is shared platform infrastructure and subdomain.identity-access is rejected as a business Subdomain. Superset/analytics and reusable platform mechanisms must not become peer business Subdomains merely because ManuFactor uses them.
  - id: AUDIT-0029
    severity: strategic-classification
    subject: candidate classifications
    finding: The consolidated map currently classifies Operations and Quality as core candidates; Safety, Environmental, and Maintenance / Reliability as supporting candidates; Human Resources as generic candidate. These classifications are Phase 4 recommendations based on differentiation/proprietary-domain-knowledge criteria from the specification and remain challengeable until later evidence warrants confirmation.
  - id: AUDIT-0030
    severity: structural-correction
    subject: top-level Domain record
    finding: The repository lacked the specification-required single top-level Domain record. ChatGPT created docs/ddd/domain/domain.yaml from Mark's established domain evidence: ManuFactor is a gap filler, existing-system reader, data aggregator, and analytical enabler that must not duplicate established system ownership unnecessarily.
  - id: AUDIT-0031
    severity: phase-readiness
    subject: Phase 4 blockers
    finding: No known domain-expert question currently blocks completion of the Phase 4 strategic map. ISSUE-0003 about Vehicle Management versus Physical Asset Management remains nonblocking and does not change the current Maintenance / Reliability Subdomain placement.

