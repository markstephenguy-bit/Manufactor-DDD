id: bc.operations-record
name: Operations Record
purpose: Capture and preserve ManuFactor-owned operational records where an existing mill workflow lacks an appropriate structured system of record.
subdomain: subdomain.production-operations
model_statement: >
  Operations Record owns structured transactional capture for operational information that would
  otherwise be handled through informal mechanisms such as email. The resulting record is authoritative
  for what was submitted and its retained history, but not automatically for the lifecycle of equipment,
  people, Quality, Safety, or other referenced concepts. Operations Record is not the Superset/grain
  analytics layer; captured records may subsequently be made available to analytical grains alongside
  data sourced from other company systems.
responsibilities:
  - Replace appropriate informal operational reporting workflows, such as email-based reporting, with structured retained records.
  - Preserve correction and history semantics for ManuFactor-owned operational records.
  - Capture the business fields needed by the specific operational reporting workflow.
  - Make captured operational facts available for downstream analytical composition without becoming the analytics/grain model itself.
  - Reference external domain concepts without absorbing their lifecycle ownership.
scope:
  - Structured operational reporting/capture where a real system gap exists
  - Form-based capture of operational information currently transmitted through informal channels such as email
  - Retained operational record history and corrections
  - Publication/exposure of captured facts for downstream analytical use
out_of_scope:
  - Superset semantic models, analytical grains, dashboards, or enterprise analytical composition
  - Wholesale ingestion of company data merely because it is available for analytics
  - Kiln scheduling and drying-process ownership
  - Project lifecycle management
  - Asset lifecycle ownership
  - Safety, Quality, or personnel lifecycle ownership
owned_concepts:
  - Operational Record
external_concepts:
  - Asset
  - Person
  - Nonconformity
  - Safety finding
  - Analytical grain
ubiquitous_language:
  - Operational Record
  - operational reporting
  - operational form
  - operational occurrence
business_rules:
  - A retained operational record must preserve what was reported and its correction/history semantics.
  - An Operations Record exists because ManuFactor is filling a structured operational-recording gap, not merely because the same data is useful analytically.
  - Referencing an external concept does not make Operations Record authoritative for that concept's lifecycle.
  - Making an Operations Record available to Superset or another analytical grain does not transfer record ownership to the analytics layer.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - References assets, personnel, Quality, Safety, and other operational subjects by identity or translated facts as needed.
  - Exposes captured operational facts for downstream analytical composition, including Superset grains, while retaining source authority for ManuFactor-owned records.
upstream_dependencies: []
downstream_consumers:
  - analytical composition / Superset grains where applicable
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, 2026-08-10
      description: Operations is the broader area for operational gaps; record/reporting concerns remain distinct from kiln, projects, and workforce readiness.
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Operational reporting can replace information currently sent by email with a structured form/record, after which the captured data may join Superset grains; Operations Record must not be confused with enterprise data pulling or analytical grain construction.
    - type: existing-model
      reference: ManuFactor-arch Build Order Phase_B/B1
      description: Existing evidence supports operational reporting/capture candidates, but specific record types require business validation before being treated as canonical examples.
  confidence: high
  status: candidate
