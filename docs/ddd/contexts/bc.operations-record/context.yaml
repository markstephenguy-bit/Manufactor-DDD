id: bc.operations-record
name: Operations Record
purpose: Capture and preserve ManuFactor-owned operational records where an existing mill workflow lacks an appropriate structured system of record.
subdomain: subdomain.production-operations
model_statement: >
  Operations Record owns structured transactional capture for operational information that would
  otherwise be handled through informal mechanisms such as email. Operations forms provide concrete
  capture surfaces within this context and may share substantial structure and mechanics. Confirmed
  Diboll dry-end examples include the First Hour Production Summary and End of Shift Report; these are
  operations forms, not separate Operations Record domain types. For these forms, the design intent is
  pull-first, manual-by-exception: fields should be populated from reliable authoritative source data or
  deterministic calculations wherever practical, with manual entry reserved for facts that are not
  reliably available elsewhere. The resulting record is authoritative for what was submitted and its
  retained history, but not automatically for the lifecycle of equipment, people, Quality, Safety, or
  other referenced concepts. Operations Record is not the Superset/grain analytics layer; captured
  records may subsequently be made available to analytical grains and data-lake destinations alongside
  data sourced from other company systems.
responsibilities:
  - Replace appropriate informal operational reporting workflows, such as email-based reporting, with structured retained records.
  - Support operations forms as concrete capture surfaces within Operations Record without forcing each form into a separate domain type.
  - Preserve correction and history semantics for ManuFactor-owned operational records.
  - Capture the business fields and rules needed by each operations form/workflow.
  - Prefer reliable source-system or deterministic calculated values over duplicate manual entry where those values are available.
  - Preserve field-level source/provenance where material so pulled, calculated, and manually entered values remain distinguishable.
  - Make captured operational facts available for downstream analytical composition and data-lake publication without becoming the analytics/grain model itself.
  - Reference external domain concepts without absorbing their lifecycle ownership.
scope:
  - Structured operational reporting/capture where a real system gap exists
  - Operations forms supporting concrete operational workflows
  - Confirmed Diboll dry-end operations form: First Hour Production Summary
  - Confirmed Diboll dry-end operations form: End of Shift Report
  - Pull-first population of form fields from reliable external/native data where available
  - Deterministic calculation of derived fields where the calculation basis is established
  - Manual entry for facts that are not reliably available from an authoritative source
  - Form-based capture of operational information currently transmitted through informal channels such as email
  - Retained operational record history and corrections
  - Publication/exposure of captured facts for downstream analytical use, including End-of-Shift publication to the MES data lake
out_of_scope:
  - Treating every operations form as a distinct domain record type merely because it has a different layout or timing
  - A generic catch-all domain object that erases the concrete operational meaning of the captured information
  - Inventing field values or source-system lineage when reliable source data is unavailable
  - Treating convenient cached or analytical values as authoritative without preserving their actual source
  - Superset semantic models, analytical grains, dashboards, data-lake storage mechanics, or enterprise analytical composition
  - Wholesale ingestion of company data merely because it is available for analytics
  - Kiln scheduling and drying-process ownership
  - Project lifecycle management
  - Asset lifecycle ownership
  - Safety, Quality, or personnel lifecycle ownership
owned_concepts:
  - Operational Record
external_concepts:
  - Asset
  - Person
  - Nonconformity
  - Safety finding
  - Analytical grain
  - MES data lake
ubiquitous_language:
  - Operational Record
  - operations form
  - operational reporting
  - operational occurrence
  - First Hour Production Summary
  - End of Shift Report
  - pulled value
  - calculated value
  - manual value
business_rules:
  - A retained operational record must preserve what was reported and its correction/history semantics.
  - An Operations Record exists because ManuFactor is filling a structured operational-recording gap, not merely because the same data is useful analytically.
  - First Hour Production Summary and End of Shift Report are operations forms within Operations Record, not separate domain record types.
  - Operations forms may share common form mechanics and field structure without collapsing the underlying operational meaning into an unbounded generic record model.
  - For First Hour Production Summary and End of Shift Report, use a reliable authoritative source or deterministic calculation instead of manual re-entry wherever practical.
  - A pulled or calculated value must retain enough provenance to distinguish it from a manually entered value when that distinction matters for correction, audit, or troubleshooting.
  - Source-system values must not be silently altered merely to make the report fit expected values; any user correction or override must remain distinguishable from the source value.
  - Referencing an external concept does not make Operations Record authoritative for that concept's lifecycle.
  - Making an Operations Record available to Superset, the MES data lake, or another analytical grain does not transfer record ownership to the analytics layer or destination.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - References assets, personnel, Quality, Safety, and other operational subjects by identity or translated facts as needed.
  - Consumes source-system facts needed to populate operations forms while preserving source authority and provenance.
  - Exposes captured operational facts for downstream analytical composition, including Superset grains and MES data-lake publication, while retaining source authority for ManuFactor-owned records.
upstream_dependencies: []
downstream_consumers:
  - analytical composition / Superset grains where applicable
  - MES data lake for End-of-Shift Reporting
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, 2026-08-10
      description: Operations is the broader area for operational gaps; record/reporting concerns remain distinct from kiln, projects, and workforce readiness.
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Operational reporting can replace information currently sent by email with a structured form/record, after which the captured data may join Superset grains; Operations Record must not be confused with enterprise data pulling or analytical grain construction.
    - type: domain-expert
      reference: Mark direct, 2026-08-24 End-of-Shift downstream clarification
      description: End-of-Shift Reporting needs to get into the MES data lake; this is a downstream publication requirement and does not transfer ownership of the source record.
    - type: domain-expert
      reference: Mark-provided current Diboll dry-end report screenshots, 2026-08-24
      description: Confirms First Hour Production Summary and End of Shift Report as current operations forms and provides their visible field sets.
    - type: domain-expert
      reference: Mark direct, 2026-08-24 pull-first clarification
      description: Wants as many End-of-Shift and related form fields pulled automatically as possible; manual entry should be minimized where reliable source data or deterministic calculations can supply the value.
    - type: domain-expert
      reference: Mark direct, 2026-08-24 operations-form classification correction
      description: First Hour and End of Shift are not distinct types; they are operations forms.
    - type: existing-model
      reference: ManuFactor-arch Build Order Phase_B/B1
      description: Existing evidence supports operational reporting/capture candidates.
  confidence: high
  status: candidate
