id: bc.asset-lifecycle
name: Asset Lifecycle
purpose: Provide the meaningful physical-asset identity, condition, lifecycle, and retained history that MP2 does not provide while correlating MP2 maintenance work to those assets.
subdomain: subdomain.asset-reliability
model_statement: >
  Within Asset Lifecycle, an Asset includes mill equipment and vehicles under one physical-asset model with ManuFactor-owned identity, condition, lifecycle state, and history semantics. MP2 is treated primarily as the maintenance transaction mechanism for work requests and work orders; its asset references support maintenance execution but do not provide the richer asset model needed by ManuFactor.
responsibilities:
  - Represent physical asset identity across mill equipment and vehicles.
  - Represent meaningful lifecycle and condition state for physical assets.
  - Retain asset history and operational-setting history where needed.
  - Correlate MP2 work requests/work orders to assets without treating those transactions as the asset lifecycle itself.
  - Expose asset identity/state to Operations, Quality, and Reliability Verification without transferring lifecycle ownership.
scope:
  - Physical asset identity for equipment and vehicles
  - Asset condition and lifecycle state
  - Retained asset history
  - Correlation to MP2 WR/WO activity
out_of_scope:
  - A separate Vehicle Management model or Bounded Context
  - Ownership of MP2 work-request/work-order lifecycle
  - Reliability verification/checkpoint lifecycle
  - Treating MP2 as the authoritative rich asset-management model merely because WR/WO records reference machines
owned_concepts:
  - Asset
  - Asset Condition
  - Asset Lifecycle State
  - Asset History
  - Operational Setting History
external_concepts:
  - MP2 Work Request
  - MP2 Work Order
ubiquitous_language:
  - asset
  - equipment
  - vehicle
  - condition
  - lifecycle state
  - asset history
  - operational setting
business_rules:
  - Equipment and vehicles use the same Asset Lifecycle model unless later domain evidence establishes a real semantic boundary.
  - MP2 WR/WO records remain authoritative for their own maintenance-transaction lifecycle.
  - ManuFactor owns the richer physical-asset model because MP2 is primarily effective as a WR/WO mechanism rather than as a complete asset-management model.
  - ManuFactor asset state/history must not be silently derived from MP2 transaction status unless an explicit domain rule establishes that effect.
  - Reliability Verification may influence asset state only through explicit cross-context rules.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - Correlates MP2 WR/WO records to ManuFactor-owned assets.
  - Supplies asset identity/state references to Operations, Quality, Kiln Operations, and Reliability Verification.
upstream_dependencies:
  - MP2 maintenance system for WR/WO transaction facts

downstream_consumers:
  - bc.reliability-verification
  - bc.kiln-operations
  - bc.quality-verification
  - bc.operations-record
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, 2026-08-10
      description: Mark clarified that MP2 contains no meaningful asset management beyond posting WR/WO to machine assets, leaving meaningful asset lifecycle semantics as a ManuFactor gap.
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Mark confirmed that Vehicle Management should merge into Physical Asset Management rather than remain a separate model.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 MP2 clarification
      description: Mark clarified that MP2 performs well as a CMMS work-request/work-order mechanism but does not do a good job representing the asset itself, reinforcing ManuFactor ownership of the richer asset model.
  confidence: high
  status: candidate
