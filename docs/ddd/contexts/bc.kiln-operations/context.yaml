id: bc.kiln-operations
name: Kiln Operations
purpose: Replace spreadsheet-based kiln scheduling/operations with a retained operational model that translates business-led market demand into actionable kiln loading and compares retained kiln history with downstream moisture statistics at the lumber-dimension level.
subdomain: subdomain.production-operations
model_statement: >
  Within Kiln Operations, kiln scheduling and kiln-run performance analysis are related but distinct concerns.
  Kiln Scheduling turns business direction originating from business leaders through Sales and market demand into
  an actionable drying plan, while also considering upstream available green lumber. The planning decision is about
  what lumber needs to be dried; it does not determine the finished SKU mix. Finished SKU creation is determined later
  by proper optimization of planed product and remains outside Kiln Operations. The required market/sales direction is
  not currently available as a usable structured data source, so ManuFactor fills that gap by creating the operational
  planning record needed to drive drying. Kiln run execution/history preserves what actually occurred. Downstream
  ProTrack planer moisture records do not carry a kiln-run/charge identifier; they are recorded by lumber dimension
  (thickness x width x length). Therefore ManuFactor cannot truthfully correlate an individual ProTrack moisture record
  to a specific Kiln Run/Charge. Drying-performance analysis is statistical, comparing retained kiln history with
  downstream ProTrack moisture distributions/statistics by dimension while preserving that lack of run-level traceability.
  ProTrack moisture records remain external source facts and are not re-owned or rewritten by ManuFactor.
responsibilities:
  - Translate business-led sales/market demand into an actionable kiln loading/sequencing plan where no structured demand data source currently exists.
  - Determine what lumber needs to be dried by considering business direction and upstream green-lumber availability.
  - Preserve kiln schedule revisions and the business basis for planned loading where applicable.
  - Preserve kiln run/charge and operating history for what actually occurred.
  - Consume downstream ProTrack planer moisture measurements and statistics by lumber dimension (thickness x width x length).
  - Support statistical drying-performance analysis by comparing retained kiln history with downstream moisture behavior by dimension without asserting individual run-to-measurement traceability.
  - Extend to additional kiln data-collection and process-control gaps as concrete rules emerge.
scope:
  - Translation of business/sales market direction into drying action
  - Determination of what lumber needs to be dried
  - Kiln loading and scheduling based on upstream supply and business-led product demand
  - Kiln schedule revision/history
  - Kiln run/charge history
  - Operating parameters and retained process records
  - Downstream ProTrack moisture statistics by lumber dimension
  - Statistical comparison of kiln history and downstream moisture outcomes
  - Drying-performance analysis and dashboards
out_of_scope:
  - Finished-product or SKU-mix determination
  - Planer optimization logic that determines which SKUs are created from dried lumber
  - Ownership of enterprise sales, market-demand, order-management, or commercial-planning lifecycles
  - Treating currently unavailable business/sales direction as if it were a structured upstream system integration
  - Ownership or mutation of upstream production facts merely used as scheduling inputs
  - Ownership or mutation of downstream planer/warehouse production facts outside Kiln Operations
  - Ownership or mutation of ProTrack moisture source records
  - Claiming that ProTrack moisture records can be traced to a specific Kiln Run/Charge when the source data contains no such identifier
  - Treating dashboards as authoritative domain state
  - General operational reporting unrelated to kiln process semantics
  - Environmental compliance modeling unless a concrete Environmental gap is later established
owned_concepts:
  - Kiln Schedule
  - Kiln Run/Charge
  - Kiln Operating Record
  - Drying Performance Statistical Analysis
external_concepts:
  - Business/Sales market direction
  - Market demand
  - Upstream green-lumber availability
  - Planer optimization / SKU creation
  - ProTrack Moisture Measurement
  - ProTrack dimension-level moisture statistics
  - Lumber Dimension (thickness x width x length)
  - Asset
ubiquitous_language:
  - kiln
  - kiln loading
  - drying schedule
  - run/charge
  - operating parameters
  - drying process
  - moisture result
  - dimension
  - thickness x width x length
  - market demand
  - drying performance
business_rules:
  - Kiln scheduling must translate business-led market demand into operational drying action rather than assuming a formal downstream production schedule already exists as data.
  - Kiln scheduling decides what lumber needs to be dried; it does not decide which finished SKUs will be produced.
  - Finished SKU creation is determined by downstream planer optimization and is outside Kiln Operations ownership.
  - Kiln scheduling state and revisions must be retained rather than overwritten as an ephemeral spreadsheet state.
  - Kiln-run history represents what actually occurred and is distinct from the planned schedule.
  - ProTrack planer moisture records do not provide a Kiln Run/Charge identifier and therefore must not be represented as individually correlated to a specific kiln run.
  - Moisture analysis may use ProTrack statistics grouped by lumber dimension (thickness x width x length), with ProTrack provenance retained.
  - Drying-performance interpretation based on dimension-level statistics is analytical/statistical evidence, not run-level traceability and not authoritative ProTrack state.
  - Dashboards and analytical views are projections of the model, not authoritative state.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - Capture/translate business-led Sales and market-demand direction into kiln planning because the needed demand signal is not currently available as structured data.
  - Consume/translate upstream availability facts needed for kiln-loading decisions without taking source ownership.
  - Provide the drying plan needed by downstream planer operations without taking ownership of planer optimization or SKU creation.
  - Consume ProTrack planer moisture measurements/statistics from its database by lumber dimension for statistical drying-performance analysis.
  - Reference physical kiln/assets from Asset Lifecycle where needed.
upstream_dependencies:
  - business leadership / Sales market-demand direction, currently human-provided rather than structured data
  - upstream production/green-lumber availability source, exact authority unresolved
  - ProTrack moisture data source
  - bc.asset-lifecycle
downstream_consumers:
  - planer operations / planer optimization, exact owning contexts/systems unresolved
  - Operational dashboards and analytical projections
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, 2026-08-10
      description: Mark identified the kiln gaps as replacing Excel scheduling/operations with retained records, coordinating with ProTrack moisture data, dashboards, and future process-control/data-collection needs.
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Mark clarified that kiln scheduling looks upstream and downstream to determine the correct kiln loading needed to meet required planer runs, while kiln-run execution is primarily about analyzing kiln performance against downstream planer results using ProTrack data.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 market-demand clarification
      description: The planer/product requirement originates with business leaders through Sales in response to market demand, but that demand is not presently available as structured data; Kiln Operations must therefore create the actionable drying plan.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 SKU-boundary clarification
      description: Kiln planning determines what lumber needs to be dried; finished SKU creation is determined later by proper optimization of planed product and is not owned by Kiln Operations.
    - type: domain-expert
      reference: Mark direct, 2026-08-23 ProTrack correlation clarification
      description: ProTrack moisture data is not tied to kiln runs; it is recorded by lumber dimension, so analysis is statistical on thickness x width x length rather than individual run traceability.
  confidence: high
  status: candidate
