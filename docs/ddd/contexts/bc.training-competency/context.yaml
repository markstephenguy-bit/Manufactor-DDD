id: bc.training-competency
name: Operational Training and Qualification
purpose: Represent and formalize operational training coverage and cross-operator qualification depth needed to keep mill crews capable of performing required jobs where the current process is informal to a fault.
subdomain: subdomain.production-operations
model_statement: >
  Within Operational Training and Qualification, qualification means a retained operational determination that a person can perform a mill job.
  The current mill process is often informal and depends heavily on management knowledge rather than a consistently recorded qualification event.
  ManuFactor therefore fills a control/evidence gap by making operational qualification explicit and traceable. Source learning completion records from Moodle or other systems are evidence inputs and are not automatically identical to operational qualification. Practical qualification evidence comes from the person shadowing the current competent worker and being observed sufficiently for an authorized supervisor or designated trainer/subject-matter expert to determine that the person is capable of doing the job. Once established, an Operational Qualification remains valid until the responsible supervisor explicitly withdraws or supersedes it; elapsed time alone does not cause expiration.
responsibilities:
  - Replace overly informal knowledge of who can perform which jobs with explicit retained operational qualification records.
  - Represent onboarding-related operational training coverage.
  - Maintain cross-operator training/qualification relationships across crews and jobs.
  - Show depth of qualified coverage for operational positions.
  - Consume source learning records as evidence without surrendering operational qualification semantics to the source LMS.
  - Retain the practical shadowing/observed-performance basis supporting qualification decisions where available.
  - Preserve qualification and withdrawal history so staffing decisions can distinguish current qualification from prior qualification.
  - Keep withdrawal/supersession under the responsible supervisor who manages the qualification.
scope:
  - Formalization of currently informal operator qualification knowledge
  - Onboarding training coverage
  - Operator qualification
  - Cross-training matrix
  - Crew/job qualification depth
  - Job shadowing and observed practical capability as qualification evidence
  - Supervisor-managed withdrawal or supersession of qualification
out_of_scope:
  - LMS course administration
  - Payroll/HR administration
  - Time-specific staffing availability and vacation coverage
  - Automatic qualification expiration based solely on elapsed time
owned_concepts:
  - Operational Qualification
  - Cross-Training Relationship
  - Training/Qualification Matrix
  - Crew Qualification Depth
external_concepts:
  - Person
  - Moodle Training Completion
  - Job/Position
  - Current competent worker
ubiquitous_language:
  - onboarding
  - operator training
  - qualification
  - qualified
  - shadowing
  - capable of doing the job
  - withdraw qualification
  - cross-training
  - training matrix
  - crew depth
  - trained-for
business_rules:
  - Operational qualification should be explicit and retained rather than existing only as informal management knowledge.
  - Operational qualification may be granted by either the employee's supervisor or a designated trainer/subject-matter expert.
  - Before qualification is granted, the person shadows the current competent worker and is observed sufficiently for the authorized reviewer to determine that the person is capable of doing the job.
  - Practical job capability, not course completion alone, is the qualification evidence rule under current evidence.
  - Source training completion may support the decision but is not automatically equivalent to operational qualification.
  - Once established, Operational Qualification remains valid until the responsible supervisor explicitly withdraws or supersedes it.
  - Elapsed time alone does not expire Operational Qualification.
  - Withdrawal preserves the prior qualification decision, evidence references, reason, supervisor, and effective time as retained history.
  - Because the supervisor manages both qualification and operational coverage judgment, withdrawal is not modeled as an unrelated external event that can silently invalidate a supervisor's staffing decision without supervisory awareness.
  - Availability does not imply qualification.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - Consumes learning-completion facts from Moodle or other learning sources as supporting evidence where useful.
  - Supplies current qualification/coverage information and qualification withdrawal changes to Operational Workforce Availability.
upstream_dependencies:
  - Moodle or other learning system, when relevant evidence exists
downstream_consumers:
  - bc.workforce-availability
