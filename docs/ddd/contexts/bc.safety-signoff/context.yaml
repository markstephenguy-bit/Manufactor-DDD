id: bc.safety-signoff
name: LTV Form Management
purpose: Manage the LTV form lifecycle, including maintaining form definitions/templates, producing printable instances, retaining and tracking issued forms, and supporting approval/sign-off where the business process requires it.
subdomain: subdomain.safety-compliance-signoff
model_statement: Within LTV Form Management, ManuFactor is authoritative for the managed LTV form/template and the lifecycle of printable/issued LTV form instances; printing and form management are the primary gap, while approval/sign-off is one possible lifecycle step rather than the defining model.
responsibilities:
  - Maintain the LTV form/template information needed to produce current forms.
  - Produce printable LTV form instances from the applicable managed form/template.
  - Track and retain issued/printed LTV form instances and their history.
  - Support approval, completion, or sign-off state where required by the applicable LTV process.
  - Preserve traceability between a printed/issued instance and the form/template from which it was produced.
scope:
  - LTV form/template management
  - LTV form printing
  - LTV printed/issued instances
  - LTV form history and traceability
  - Approval/sign-off where applicable to an LTV form lifecycle
out_of_scope:
  - General Safety incident management
  - CAPA lifecycle
  - Operations incident reporting
  - Entire Safety departmental scope
owned_concepts:
  - LTV Form
  - LTV Form Template
  - LTV Printed Instance
  - LTV Form Status
  - LTV Form History
external_concepts:
  - Person
  - Safety requirement
ubiquitous_language:
  - LTV Form
  - LTV Template
  - LTV Printed Instance
  - print
  - issue
  - approval
  - sign-off
business_rules:
  - A printed or issued LTV form instance must remain traceable to the form/template version from which it was produced.
  - Printing or issuing a form does not by itself imply approval or sign-off unless the applicable LTV process requires that state.
  - Approval/sign-off state, where required, belongs to the managed LTV form instance and must not redefine unrelated Safety or CAPA lifecycles.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - May provide LTV form status or completed-form references to other contexts where operational or corrective work needs them.
upstream_dependencies: []
downstream_consumers:
  - bc.corrective-action
  - bc.operations-record
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, 2026-08-10
      description: Mark clarified that the actual Safety gap is LTV form printing and a system to manage those forms; sign-off alone is too narrow a description of the required model.
    - type: existing-model
      reference: ManuFactor-arch LTV template/instance evidence
      description: Existing evidence supports managed LTV templates/forms, printable instances, and related lifecycle information.
  confidence: high
  status: candidate
