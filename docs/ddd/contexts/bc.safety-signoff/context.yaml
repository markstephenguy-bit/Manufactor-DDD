id: bc.safety-signoff
name: Safety Sign-Off
purpose: Manage the template/instance approval lifecycle that makes a ManuFactor safety sign-off record authoritative.
subdomain: subdomain.safety-compliance-signoff
model_statement: Within Safety Sign-Off, a safety sign-off record becomes authoritative only through the required template/instance approval lifecycle; this context does not model the entire Safety business area.
responsibilities:
  - Manage safety sign-off templates and instances.
  - Track required approval state.
  - Establish when a sign-off record becomes authoritative.
  - Retain sign-off evidence/history.
scope:
  - LTV Template
  - LTV Printed Instance
  - Site Safety Manager approval
  - Safety sign-off authority lifecycle
out_of_scope:
  - General Safety incident management
  - CAPA lifecycle
  - Operations incident reporting
  - Entire Safety departmental scope
owned_concepts:
  - Safety Sign-Off Template
  - Safety Sign-Off Instance
  - Safety Approval
  - Authoritative Safety Sign-Off Record
external_concepts:
  - Person
  - Safety finding
ubiquitous_language:
  - LTV Template
  - LTV Printed Instance
  - Site Safety Manager approval
  - sign-off
  - authoritative record
business_rules:
  - A sign-off record is not authoritative until its required approval state is satisfied.
  - A Safety Sign-Off record may be referenced by Operations Record or Corrective Action without transferring ownership of its approval lifecycle.
owner: unresolved
domain_experts: [Mark]
integration_surface:
  - May provide findings or authoritative sign-off references to other contexts.
upstream_dependencies: []
downstream_consumers:
  - bc.corrective-action
  - bc.operations-record
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, ISSUE-0002
      description: Mark confirmed Safety Sign-Off as a real Safety responsibility while rejecting the inference that it exhausts the Safety business area.
    - type: existing-model
      reference: ManuFactor-arch LTV template/instance approval evidence
      description: Existing evidence supports a distinct template-instance-approval lifecycle.
  confidence: high
  status: candidate
