id: bc.corrective-action
name: Corrective Action
purpose: Coordinate Nonconformity-driven correction and corrective action through root-cause, routing, and closure without duplicating work ownership held by other contexts or systems.
subdomain: subdomain.quality
model_statement: >
  Within Corrective Action, a Nonconformity is a finding that enters a remediation lifecycle of correction,
  root-cause analysis, corrective action, routing, and closure. The salaried Quality office within the affected
  department owns the active Nonconformity/CAPA work and is accountable for driving the issue through that
  lifecycle. Routed work may be executed by other departments, contexts, or systems and does not become locally
  owned merely because CAPA coordinates it.
responsibilities:
  - Represent Nonconformities and Corrections.
  - Coordinate root-cause and Corrective Action work.
  - Keep the department's salaried Quality office accountable for active Nonconformity/CAPA progression and closure.
  - Route resulting work to the context/system that owns that work class.
  - Track CAPA coordination through closure.
scope:
  - Nonconformity lifecycle
  - Correction and Corrective Action coordination
  - Root-cause work
  - Routing and closure semantics
out_of_scope:
  - Product measurement/quality-check lifecycle
  - Ownership of routed maintenance, Safety, Operations, project, or other work
  - A monolithic QMS
owned_concepts:
  - Nonconformity
  - Correction
  - Corrective Action
  - CAPA Item
  - Routing Rule
external_concepts:
  - Project
  - Maintenance work
  - Safety finding
  - Quality Verification Result
ubiquitous_language:
  - Nonconformity
  - Correction
  - Corrective Action
  - root cause
  - CAPA item
  - routing
  - closure
business_rules:
  - The salaried Quality office in the affected department is accountable for working the Nonconformity/CAPA issue through investigation, corrective-action coordination, and closure.
  - CAPA closure must reflect the corrective-action lifecycle without falsely becoming authoritative for work owned by another context.
  - Routing execution work to another department/system does not transfer ownership of the Nonconformity/CAPA record away from Quality.
  - Planned project work is not inherently a CAPA item.
  - External standards may inform vocabulary/rules but do not define this Bounded Context boundary.
owner: department salaried Quality office
domain_experts: [Mark]
integration_surface:
  - Accepts eligible findings from Quality Verification and potentially other contexts when explicit rules allow.
  - Routes corrective work to contexts/systems that own execution while retaining Quality ownership of the CAPA lifecycle.
upstream_dependencies:
  - bc.quality-verification
downstream_consumers:
  - bc.project-tracking
  - bc.asset-lifecycle
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Mark direct, ISSUE-0002
      description: Mark established CAPA as a Quality aspect and distinct from project tracking.
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Mark clarified that the salaried Quality office in the department works the Nonconformity/CAPA issue.
    - type: decision
      reference: DDD-0005
      description: CAPA vocabulary, trigger, routing, and ISO-boundary semantics were clarified.
  confidence: high
  status: candidate
