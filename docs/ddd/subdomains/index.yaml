# ManuFactor DDD — Candidate Subdomains
# Phase 4 (SPECIFICATION.md S50). All status: candidate. No new evidence
# gathered this pass. Bounded Contexts not drawn yet (Phase 5). Detailed
# reasoning behind non-obvious groupings/splits lives in docs/ddd/decisions/,
# not here — boundary_rationale stays tight, per external audit feedback.
# cap.project-tracking (unresolved) and cap.risk-management (rejected)
# remain unplaced, not silently dropped.

subdomains:

  - id: subdomain.safety-compliance-signoff
    name: Safety Compliance & Procedure Sign-Off
    purpose: Gate safety-related procedures/equipment through a formal approval workflow before a sign-off record is authoritative.
    capabilities: [cap.safety-compliance-signoff]
    classification: core
    boundary_rationale: >
      Owns a proactive approval-gate workflow — Template lifecycle through
      Site Safety Manager approval. Distinguished from CAPA by timing:
      prevents via required sign-off, rather than reacting to a finding.
      Split out from a broader "Quality & Compliance" grouping — see DDD-0001.
    evidence: [ev.arch.addendum rev 1/4/40, ev.arch.workbook "Rules" (LTV SSM approval rule)]
    confidence: medium
    status: candidate

  - id: subdomain.corrective-preventive-action
    name: Corrective & Preventive Action
    purpose: Resolve a quality/operational finding by dispatching corrective work to whichever system already owns that class of work.
    capabilities: [cap.corrective-preventive-action]
    classification: core
    boundary_rationale: >
      Reactive dispatcher, not a domain hub (addendum session 020) —
      distinguished from Safety Compliance's proactive gate shape by timing
      and intent. Split out from a broader "Quality & Compliance" grouping —
      see DDD-0001.
    evidence: [ev.arch.addendum "CAPA reframed" session 020, ev.arch.workbook "Rules" (CAPA routing rule)]
    confidence: medium
    status: candidate

  - id: subdomain.environmental-compliance
    name: Environmental Compliance Reporting
    purpose: Produce periodic regulatory compliance reporting (Boiler/Kiln forms).
    capabilities: [cap.environmental-compliance]
    classification: core
    boundary_rationale: >
      No shared vocabulary or rule structure links this to Safety Compliance
      or CAPA beyond the generic "compliance" label — kept separate rather
      than re-merged. Split out from a broader "Quality & Compliance"
      grouping — see DDD-0001. Thin evidence; confidence reflects that.
    evidence: [ev.arch.workbook "Data Gathering" item 21]
    confidence: low
    status: candidate

  - id: subdomain.asset-reliability
    name: Asset & Reliability
    purpose: Know what physical assets the mill has, their condition, and verify they remain reliable and compliant.
    capabilities: [cap.physical-asset-management, cap.equipment-reliability-verification]
    classification: core
    boundary_rationale: >
      Owns asset lifecycle state and reliability/verification together — the
      Rules sheet lists AssetManagement and InspectionsCalibration under one
      due-check rule. Separate from the compliance subdomains (procedure/
      regulation, not equipment state) and Production Operations.
    evidence: [ev.arch.workbook "Status Catalog Mappings", ev.arch.workbook "Rules"]
    confidence: medium
    status: candidate

  - id: subdomain.production-operations
    name: Production Operations
    purpose: Manage the mill's production process and record what happens during production.
    capabilities: [cap.kiln-drying-operations, cap.operational-reporting]
    classification: core
    boundary_rationale: >
      Owns the production process itself and its operational record, not
      equipment condition or compliance. Process/Parameter Change Control's
      inclusion in cap.operational-reporting remains provisional — near-zero
      independent evidence, not re-confirmed by this grouping.
    evidence: [ev.arch.drawings.mill_hierarchy, ev.arch.workbook "Build Order" Phase_B/B1]
    confidence: medium overall, low for the Process/Parameter Change portion
    status: candidate

  - id: subdomain.people-workforce
    name: People & Workforce
    purpose: Track training/competency and workforce scheduling/absence.
    capabilities: [cap.training-competency, cap.workforce-scheduling]
    classification: supporting
    boundary_rationale: >
      General HR-shaped need, not mill-specific — Kronos already owns part of
      absence tracking, narrowing ManuFactor's real contribution. That
      narrower contribution is what supports supporting over core.
    evidence: [ev.arch.workbook "Constraints & Assumptions" A-05, ev.arch.workbook "Constraints & Assumptions" A-06]
    confidence: medium
    status: candidate

  - id: subdomain.identity-access
    name: Identity & Access
    purpose: Recognize who is using the system and govern what they can do.
    capabilities: [cap.identity-access]
    classification: generic
    boundary_rationale: >
      Enables every other subdomain, produces no business outcome of its
      own — the substrate's own Ports sheet classifies Identity.Login as
      platform-ambient. Renamed from "Identity & Platform" — see DDD-0002.
    evidence: [ev.arch.addendum rev 116/117/121/122, ev.arch.workbook "Ports"]
    confidence: high
    status: candidate
