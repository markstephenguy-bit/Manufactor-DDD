subdomains:

  - id: subdomain.safety-compliance-signoff
    name: Safety
    description: Safety business responsibilities relevant to ManuFactor gap-filling, records, and cross-system information use.
    classification: supporting
    business_capabilities: [cap.safety-compliance-signoff]
    business_value: Preserve trustworthy safety work and records where existing GP systems do not fully satisfy the mill need.
    differentiation: Safety is important to mill operation but the currently known ManuFactor work does not establish proprietary Safety domain knowledge as a principal differentiator.
    scope:
      - Safety Compliance & Procedure Sign-Off
      - Additional Safety gaps discovered later where ManuFactor has a legitimate business role
    out_of_scope:
      - Treating the Safety department itself as a software or Bounded Context boundary
      - Assuming ManuFactor owns Safety responsibilities already authoritative in another GP system
    domain_experts: [Mark]
    candidate_bounded_contexts: [bc.safety-signoff]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, ISSUE-0002 and 2026-08-10
          description: Mark confirmed Safety as a broader mill business area and Safety Sign-Off as one responsibility within it.
      confidence: high
      status: candidate

  - id: subdomain.quality
    name: Quality
    description: Quality responsibilities and mill-specific quality knowledge where ManuFactor fills workflow, recording, verification, correlation, or information gaps.
    classification: core
    business_capabilities: [cap.corrective-preventive-action, cap.product-quality-verification]
    business_value: Make quality problems, verification, corrective work, and contextual mill quality knowledge usable and traceable where existing systems leave gaps.
    differentiation: Product-quality rules vary by mill, machine, and process context, creating domain-specific knowledge that materially affects how ManuFactor must behave.
    scope:
      - Corrective & Preventive Action coordination
      - Product Quality Verification
      - Additional Quality gaps discovered later
    out_of_scope:
      - Owning a monolithic QMS
      - Replacing authoritative GP systems merely because Quality consumes their data
      - Treating ISO 9001 or SPIB organizational boundaries as ManuFactor DDD boundaries
    domain_experts: [Mark]
    candidate_bounded_contexts: [bc.quality-verification, bc.corrective-action]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, ISSUE-0002 and 2026-08-09 through 2026-08-10
          description: Mark identified CAPA as a Quality aspect, established Product Quality Verification as Quality work, and supplied mill/machine/process-specific quality knowledge.
        - type: decision
          reference: DDD-0004 and DDD-0005
          description: Prior QMS-shaped grouping was corrected so responsibilities and external standards do not define boundaries by themselves.
      confidence: high
      status: candidate

  - id: subdomain.environmental-compliance
    name: Environmental
    description: Environmental business responsibilities where ManuFactor may eventually fill compliance, record, reporting, or information-access gaps.
    classification: supporting
    business_capabilities: [cap.environmental-compliance]
    business_value: Preserve the Environmental business area in the strategic map without inventing a ManuFactor-owned model before a concrete gap exists.
    differentiation: Environmental is a real mill responsibility, but no concrete current ManuFactor Environmental gap is established strongly enough to justify a Bounded Context.
    scope:
      - Future Environmental gaps when concrete language, rules, lifecycle, and ownership are known
    out_of_scope:
      - Treating regulatory or departmental organization as a Bounded Context definition
      - Assuming ManuFactor owns all environmental compliance work
      - Creating an Environmental Bounded Context solely from historical form/report evidence
    domain_experts: [Mark]
    candidate_bounded_contexts: [bc.environmental-compliance]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Mark confirmed Environmental as a broader business area but later stated he cannot currently identify a concrete ManuFactor Environmental gap.
      confidence: high
      status: candidate

  - id: subdomain.asset-reliability
    name: Maintenance / Reliability
    description: Maintenance, physical-asset, and reliability responsibilities relevant to ManuFactor gaps while existing systems such as the CMMS may remain operationally authoritative.
    classification: supporting
    business_capabilities: [cap.physical-asset-management, cap.equipment-reliability-verification]
    business_value: Expose and support reliability information and missing workflows without duplicating the CMMS, including cross-system correlation and novel analysis of existing maintenance data.
    differentiation: The domain is mill-specific and operationally important, but much of the authoritative maintenance workflow exists in established systems; ManuFactor differentiates mainly by filling the gaps around them.
    scope:
      - Physical Asset Management gaps
      - Equipment Reliability & Compliance Verification gaps
      - Reading, correlating, aggregating, and analyzing maintenance/reliability data where useful
    out_of_scope:
      - Replacing the CMMS as the system of record for operational maintenance work
      - Creating an Analytics or Superset business Subdomain from tooling choices
    domain_experts: [Mark]
    candidate_bounded_contexts: [bc.asset-lifecycle, bc.reliability-verification]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Mark confirmed Maintenance/Reliability as the broader area and described database extraction plus Superset analysis as a representative gap-filling pattern.
        - type: existing-model
          reference: ManuFactor-arch workbook Status Catalog Mappings and Rules
          description: Existing evidence supports physical-asset and equipment-reliability responsibilities.
      confidence: high
      status: candidate

  - id: subdomain.production-operations
    name: Operations
    description: Mill-operating responsibilities and gaps that ManuFactor supports without claiming ownership of ERP, MES, production planning, HR systems, or other established systems that provide source facts.
    classification: core
    business_capabilities: [cap.kiln-drying-operations, cap.operational-reporting, cap.project-tracking, cap.training-competency, cap.workforce-scheduling]
    business_value: Fill practical mill-operating gaps and provide operational information or workflows that established systems do not provide adequately.
    differentiation: Operations is central to ManuFactor's mill-specific problem space and is where gap-filling workflows combine operational process knowledge with facts sourced from other systems.
    scope:
      - Operational Reporting
      - Kiln Drying Operations gaps
      - Project Tracking
      - Operational workforce readiness, including onboarding/training coverage, vacation planning, crew depth, and replacement capability for absent operators
      - Additional mill-operating gaps discovered later
    out_of_scope:
      - Owning ERP, MES, production planning, production-execution, learning-management, or HR-system responsibilities solely because ManuFactor uses related data
      - Requiring Projects / Continuous Improvement as an intermediate or peer Subdomain
      - Treating personnel-related source data as proof that an operational gap belongs to an HR Bounded Context
    domain_experts: [Mark]
    candidate_bounded_contexts: [bc.operations-record, bc.kiln-operations, bc.project-tracking, bc.training-competency, bc.workforce-availability]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Mark confirmed Operations as the broader area for operational gaps and placed Project Tracking directly under Operations.
        - type: domain-expert
          reference: Mark direct, 2026-08-10 workforce clarification
          description: Mark clarified that training, vacation scheduling, cross-operator training depth, and sick-call replacement are Operations gaps that happen to depend on HR-related information.
        - type: existing-model
          reference: ManuFactor-arch mill hierarchy and Build Order Phase_B/B1
          description: Existing evidence supports operational reporting and kiln-related responsibilities.
      confidence: high
      status: candidate

  - id: subdomain.people-workforce
    name: Human Resources
    description: Historical candidate retained for traceability after domain clarification showed that currently known ManuFactor workforce/training gaps are Operations concerns that consume HR-related facts rather than an HR-owned domain model.
    classification: generic
    business_capabilities: []
    business_value: No active ManuFactor business capability is currently assigned here.
    differentiation: Existing HR, learning, and timekeeping systems may remain authoritative for personnel facts; current ManuFactor gaps concern operational readiness and staffing decisions.
    scope:
      - Historical traceability of the earlier HR candidate
      - Future genuinely HR-owned gaps if discovered later
    out_of_scope:
      - Current operational training coverage, vacation planning, crew-depth, or operator-replacement gaps
      - Treating Moodle, Kronos, or personnel data as a reason to create an HR Bounded Context
    domain_experts: [Mark]
    candidate_bounded_contexts: []
    status: rejected
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10 workforce clarification
          description: Mark clarified that the known training and workforce gaps are operational gaps that fall into an HR category, not a separate HR-owned ManuFactor model.
      confidence: high
      status: rejected

  - id: subdomain.identity-access
    name: Identity & Access
    description: Shared platform infrastructure for recognizing users and governing access; retained as a rejected historical candidate so the modeling correction remains explicit.
    classification: generic
    business_capabilities: [cap.identity-access]
    business_value: Enables access control but does not itself constitute a ManuFactor business-domain outcome.
    differentiation: Commodity platform infrastructure rather than proprietary domain knowledge.
    scope:
      - Historical traceability of the rejected candidate
    out_of_scope:
      - Active ManuFactor business-domain Subdomain map
    domain_experts: [Mark]
    candidate_bounded_contexts: []
    status: rejected
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Mark explicitly classified Identity & Access as shared platform infrastructure rather than a business Subdomain.
        - type: decision
          reference: DDD-0002
          description: Earlier Identity & Access modeling is retained for history but superseded by the domain-expert correction.
      confidence: high
      status: rejected
