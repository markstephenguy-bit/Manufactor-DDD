subdomains:

  - id: subdomain.safety-compliance-signoff
    name: Safety Compliance & Procedure Sign-Off
    purpose: Gate safety-related procedures/equipment through a formal approval workflow before a sign-off record is authoritative.
    capabilities: [cap.safety-compliance-signoff]
    classification: core
    boundary_rationale: Confirmed separate from Quality/CAPA and Environmental by Mark direct.
    evidence: ["domain-expert: Mark, direct, ISSUE-0002"]
    confidence: high
    status: confirmed
    decision_refs: [DDD-0004]
    issue_refs: []

  - id: subdomain.quality-capa
    name: Quality — Corrective & Preventive Action
    purpose: Resolve quality/operational findings by routing corrective work to whichever system already owns that class of work.
    capabilities: [cap.corrective-preventive-action]
    classification: core
    boundary_rationale: Confirmed separate by Mark direct — "CAPA is a quality aspect."
    evidence: ["domain-expert: Mark, direct, ISSUE-0002", "external-standard: ISO 9001:2015 clause 10.2"]
    confidence: high
    status: confirmed
    decision_refs: [DDD-0004]
    issue_refs: [ISSUE-0001]

  - id: subdomain.environmental-compliance
    name: Environmental Compliance Reporting
    purpose: Produce periodic regulatory compliance reporting.
    capabilities: [cap.environmental-compliance]
    classification: core
    boundary_rationale: Confirmed separate from Safety and Quality/CAPA by Mark direct; content beyond this remains thin.
    evidence: ["domain-expert: Mark, direct, ISSUE-0002"]
    confidence: medium
    status: confirmed
    decision_refs: [DDD-0004]
    issue_refs: []

  - id: subdomain.asset-reliability
    name: Asset & Reliability
    purpose: Know what physical assets the mill has, their condition, and verify they remain reliable and compliant.
    capabilities: [cap.physical-asset-management, cap.equipment-reliability-verification]
    classification: core
    boundary_rationale: Owns asset lifecycle state and reliability/verification together. Separate from Production Operations by subject.
    evidence: [ev.arch.workbook "Status Catalog Mappings", ev.arch.workbook "Rules"]
    confidence: medium
    status: candidate
    decision_refs: []
    issue_refs: [ISSUE-0003]

  - id: subdomain.production-operations
    name: Production Operations
    purpose: Manage the mill's production process and record what happens during production.
    capabilities: [cap.kiln-drying-operations, cap.operational-reporting]
    classification: core
    boundary_rationale: Owns the production process and its operational record, not equipment condition or compliance.
    evidence: [ev.arch.drawings.mill_hierarchy, ev.arch.workbook "Build Order" Phase_B/B1]
    confidence: medium
    status: candidate
    decision_refs: []
    issue_refs: []

  - id: subdomain.people-workforce
    name: People & Workforce
    purpose: Track training/competency and workforce scheduling/absence.
    capabilities: [cap.training-competency, cap.workforce-scheduling]
    classification: supporting
    boundary_rationale: General HR-shaped need; Kronos already owns part of absence tracking, narrowing ManuFactor's contribution.
    evidence: [ev.arch.workbook "Constraints & Assumptions" A-05, ev.arch.workbook "Constraints & Assumptions" A-06]
    confidence: medium
    status: candidate
    decision_refs: []
    issue_refs: []

  - id: subdomain.identity-access
    name: Identity & Access
    purpose: Recognize who is using the system and govern what they can do.
    capabilities: [cap.identity-access]
    classification: generic
    boundary_rationale: Enables every other subdomain; produces no business outcome of its own.
    evidence: [ev.arch.addendum rev 116/117/121/122, ev.arch.workbook "Ports"]
    confidence: high
    status: candidate
    decision_refs: [DDD-0002]
    issue_refs: []
