application_use_cases:
  - id: use-case.operations-record.record-and-correct
    name: Capture and Correct a Specific Operational Record
    bounded_context: bc.operations-record
    goal: Capture a structured record for a concrete operational need that otherwise lacks an appropriate system of record and retain corrections without destroying history.
    actors: [employees participating in the specific operational record workflow]
    trigger: A concrete operational fact or occurrence needs a retained ManuFactor record.
    preconditions: [The record type represents a distinct justified business need and the occurrence is sufficiently identified.]
    commands: [command.operations-record.record-operational-fact, command.operations-record.correct-operational-record]
    queries: [query.operations-record.history]
    domain_services: []
    events_observed: [event.operations-record.operational-record-recorded, event.operations-record.operational-record-corrected]
    result: A retained operational record exists with history-preserving corrections.
    failure_paths: [Insufficient occurrence identity/provenance; attempted correction would erase history; attempted use as a generic analytics/grain model.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.operations-record.record-and-correct, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.kiln-operations.manage-schedule
    name: Plan What Lumber Needs Drying
    bounded_context: bc.kiln-operations
    goal: Translate human business/Sales direction and upstream green-lumber availability into a retained revisable kiln drying/loading plan.
    actors: [employees responsible for kiln planning]
    trigger: Kiln drying work must be planned or revised.
    preconditions: [Planning scope and period are defined; human business/Sales direction and available green-lumber information are available to the planner.]
    commands: [command.kiln-operations.create-kiln-schedule, command.kiln-operations.revise-kiln-schedule]
    queries: [query.kiln-operations.schedule]
    domain_services: []
    events_observed: [event.kiln-operations.kiln-schedule-created, event.kiln-operations.kiln-schedule-revised]
    result: A retained, revisable plan states what lumber needs drying with revision history.
    failure_paths: [Planning scope is undefined; revision would overwrite history; orchestration attempts to determine downstream finished SKU creation.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.kiln-operations.manage-schedule, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.kiln-operations.run-history
    name: Record a Kiln Run and Review Drying Performance
    bounded_context: bc.kiln-operations
    goal: Preserve one Kiln Run/Charge and later interpret drying performance using authoritative ProTrack moisture evidence.
    actors: [employees involved in kiln execution and review]
    trigger: A kiln run begins, operating facts are recorded, the run completes, or completed-run performance is reviewed.
    preconditions: [The run is distinguishable; source measurements used for review come through the ProTrack integration boundary.]
    commands: [command.kiln-operations.start-kiln-run, command.kiln-operations.record-kiln-operation, command.kiln-operations.complete-kiln-run]
    queries: [query.kiln-operations.run-moisture]
    domain_services: []
    events_observed: [event.kiln-operations.kiln-run-started, event.kiln-operations.kiln-operation-recorded, event.kiln-operations.kiln-run-completed]
    result: Retained kiln-run history is available for explicit cross-context moisture correlation and review.
    failure_paths: [Run identity is ambiguous; operating fact cannot be associated reliably; ProTrack measurement cannot be correlated and therefore remains uncorrelated.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.kiln-operations.run-history, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.project-tracking.manage-project
    name: Manage a Project
    bounded_context: bc.project-tracking
    goal: Manage a real Project using conventional project-management lifecycle semantics.
    actors: [project participants according to project role and authority]
    trigger: Distinct planned project work is created or completed.
    preconditions: [The work is a genuine Project rather than an ordinary task, MP2 work order, investigation, or CAPA action.]
    commands: [command.project-tracking.create-project, command.project-tracking.complete-project]
    queries: [query.project-tracking.project-status]
    domain_services: []
    events_observed: [event.project-tracking.project-created, event.project-tracking.project-completed]
    result: Project-owned lifecycle/status is retained independently of external work lifecycles.
    failure_paths: [Work lacks a distinct project lifecycle; completion is justified only by another context's state.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.project-tracking.manage-project, description: Reconciled Phase 14 use-case candidate after Project boundary clarification.}]
      confidence: high
      status: candidate

  - id: use-case.quality-verification.intake-concern
    name: Intake a Quality Concern
    bounded_context: bc.quality-verification
    goal: Retain a suspected quality concern for authorized review without prematurely creating a Quality Check or Nonconformity.
    actors: [management, designated quality technician, QC channel acting as intake path for non-salaried employee concerns]
    trigger: A possible lumber-quality problem is observed or communicated.
    preconditions: [The concern is sufficiently identified to retain; formal intake respects the confirmed role/channel rule.]
    commands: [command.quality-verification.record-quality-concern]
    queries: [query.quality-verification.concerns]
    domain_services: []
    events_observed: [event.quality-verification.quality-concern-recorded]
    result: A retained Quality Concern exists for authorized triage.
    failure_paths: [Intake is too ambiguous to retain; orchestration attempts to create a Quality Check or Nonconformity automatically; QC channel implementation is invented rather than left unspecified.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.quality-verification.intake-concern, description: Reconciled Phase 14 use-case candidate promoted after tactical reconciliation.}]
      confidence: high
      status: candidate

  - id: use-case.quality-verification.review-concern
    name: Review and Disposition a Quality Concern
    bounded_context: bc.quality-verification
    goal: Allow authorized quality review to retain a concern disposition and, where justified, link an optional Quality Check or independently accepted Nonconformity.
    actors: [management, designated quality technician]
    trigger: A retained Quality Concern is ready for formal triage/review.
    preconditions: [The concern exists; the reviewer has formal triage authority.]
    commands: [command.quality-verification.disposition-quality-concern, command.quality-verification.link-quality-check-to-concern, command.quality-verification.link-nonconformity-to-concern]
    queries: [query.quality-verification.concerns, query.quality-verification.check, query.corrective-action.capa-status]
    domain_services: []
    events_observed: [event.quality-verification.quality-concern-dispositioned, event.quality-verification.quality-check-linked-to-concern, event.quality-verification.nonconformity-linked-to-concern]
    result: Authorized triage/disposition is retained with explicit links to later formal records where they independently exist.
    failure_paths: [Unauthorized reviewer; orchestration treats Quality Check as mandatory; attempted implicit Nonconformity creation; escalation attempts to close the concern automatically.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.quality-verification.review-concern, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.quality-verification.perform-check
    name: Perform and Evaluate a Quality Check
    bounded_context: bc.quality-verification
    goal: Start a formal Quality Check, capture measurement evidence, resolve the applicable historical target, and record the evaluation result.
    actors: [management, designated quality technician]
    trigger: Authorized quality review determines that a formal measurement/evaluation is useful or a check is otherwise initiated.
    preconditions: [Check context is sufficient to resolve an applicable target; measurement evidence can be retained.]
    commands: [command.quality-verification.initiate-quality-check, command.quality-verification.record-quality-measurement, command.quality-verification.evaluate-quality-check]
    queries: [query.quality-verification.check, query.quality-verification.targets]
    domain_services: []
    events_observed: [event.quality-verification.quality-check-initiated, event.quality-verification.quality-measurement-recorded, event.quality-verification.quality-check-evaluated]
    result: A retained Quality Check contains measurement evidence, historical evaluation basis, and result.
    failure_paths: [Applicable target cannot be established; evidence is insufficient; orchestration attempts to turn a failed check directly into a Nonconformity.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.quality-verification.perform-check, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.quality-verification.manage-targets
    name: Manage Applicable Quality Target Parameters
    bounded_context: bc.quality-verification
    goal: Allow salaried management to create or change contextual ManuFactor quality-target parameters while preserving historical applicability.
    actors: [salaried management]
    trigger: A target must be established or changed for a mill/machine/process context.
    preconditions: [The actor is salaried management; applicability context is sufficiently defined.]
    commands: [command.quality-verification.create-quality-target-parameter, command.quality-verification.change-quality-target-parameter]
    queries: [query.quality-verification.targets]
    domain_services: []
    events_observed: [event.quality-verification.quality-target-parameter-created, event.quality-verification.quality-target-parameter-changed]
    result: Current target configuration changes while historical versions remain resolvable for retained checks.
    failure_paths: [Actor lacks authority; applicability is ambiguous; change would destroy historical evaluation basis.]
    status: candidate
    provenance:
      sources: [{type: domain-expert, reference: PHASE14-QUALITY-PARAMETERS / PHASE14-QUALITY-PARAMETER-AUTHORITY, description: Confirmed target ownership and management authority required tactical/application promotion.}]
      confidence: high
      status: candidate

  - id: use-case.corrective-action.manage-nonconformity
    name: Manage a Nonconformity Through CAPA
    bounded_context: bc.corrective-action
    goal: Work an accepted Nonconformity through CAPA coordination, routed work, and closure without taking ownership of destination execution lifecycles.
    actors: [affected department salaried Quality office]
    trigger: A finding is explicitly accepted into the Nonconformity lifecycle.
    preconditions: [An explicit supported decision admits the finding as a Nonconformity.]
    commands: [command.corrective-action.accept-nonconformity, command.corrective-action.route-corrective-work, command.corrective-action.close-nonconformity]
    queries: [query.corrective-action.capa-status]
    domain_services: []
    events_observed: [event.corrective-action.nonconformity-accepted, event.corrective-action.corrective-work-routed, event.corrective-action.nonconformity-closed]
    result: CAPA lifecycle/coordination is retained while routed execution remains owned by the appropriate context/system.
    failure_paths: [No supported admission rule; routing would create duplicate local execution ownership; closure evidence/rules are not satisfied.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.corrective-action.manage-nonconformity, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.asset-lifecycle.manage-asset
    name: Manage Rich Asset State and History
    bounded_context: bc.asset-lifecycle
    goal: Maintain richer ManuFactor asset identity/condition/lifecycle/history while reusing MP2 hierarchy and linking MP2 WR/WO facts.
    actors: [authorized asset or reliability users, controlled import processes]
    trigger: An asset is registered or an accepted asset-domain condition change occurs.
    preconditions: [The physical asset can be distinguished; external MP2 facts remain source-owned.]
    commands: [command.asset-lifecycle.register-asset, command.asset-lifecycle.change-asset-condition]
    queries: [query.asset-lifecycle.asset-history]
    domain_services: []
    events_observed: [event.asset-lifecycle.asset-registered, event.asset-lifecycle.asset-condition-changed]
    result: ManuFactor retains stable rich asset semantics/history correlated to MP2 hierarchy/work facts.
    failure_paths: [Asset identity cannot be resolved; MP2 status is treated as Asset state without an explicit rule; unmatched MP2 references are silently assigned.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.asset-lifecycle.manage-asset, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.reliability-verification.verify-asset
    name: Record and Review a Reliability Finding
    bounded_context: bc.reliability-verification
    goal: Retain reliability verification evidence/results while preserving the requirement that Asset state changes belong to Asset Lifecycle authority.
    actors: [millwright, maintenance supervisor, Reliability Manager as accountable process role]
    trigger: A reliability verification/finding is completed and reviewed.
    preconditions: [The asset is resolved; applicable verification criteria/evidence are available.]
    commands: [command.reliability-verification.complete-verification]
    queries: [query.reliability-verification.verification-history]
    domain_services: []
    events_observed: [event.reliability-verification.verification-completed]
    result: An authoritative verification fact is retained; any later promotion to Asset state/action remains a separate explicit decision.
    failure_paths: [Verification evidence is insufficient; orchestration treats result as Asset condition; an Asset state transition is fabricated without Asset Lifecycle authority.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.reliability-verification.verify-asset, description: Reconciled Phase 14 use-case candidate with authority clarification.}]
      confidence: high
      status: candidate

  - id: use-case.ltv-form-management.manage-forms
    name: Manage an LTV Record Through Its Workflow
    bounded_context: bc.safety-signoff
    goal: Manage versioned LTV templates/instances with exact version, applicability, completion/sign-off evidence, and retained workflow progression.
    actors: [employees participating where LTV work applies, subject to workflow role]
    trigger: An LTV template is published or an LTV instance is generated for applicable work.
    preconditions: [A managed template/version exists for instance generation; workflow role requirements are respected.]
    commands: [command.ltv-form-management.publish-template, command.ltv-form-management.generate-instance]
    queries: [query.ltv-form-management.forms]
    domain_services: []
    events_observed: [event.ltv-form-management.template-version-published, event.ltv-form-management.form-instance-generated]
    result: LTV records retain exact template/version provenance and individual workflow history.
    failure_paths: [Exact source version cannot be preserved; printing/issuance is treated as sign-off; process-specific approval rules are invented.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.ltv-form-management.manage-forms, description: Reconciled Phase 14 use-case candidate.}]
      confidence: high
      status: candidate

  - id: use-case.training-qualification.establish-qualification
    name: Establish Operational Qualification
    bounded_context: bc.training-competency
    goal: Retain an explicit determination that a person can perform a specific operational job based on acceptable evidence.
    actors: [employee supervisor, designated trainer or subject-matter expert]
    trigger: Sufficient evidence is presented for an Operational Qualification decision.
    preconditions: [Person/job are identified; acceptable evidence exists; actor is within confirmed grant authority.]
    commands: [command.training-qualification.establish-qualification]
    queries: [query.training-qualification.who-can-do-job]
    domain_services: []
    events_observed: [event.training-qualification.operational-qualification-established]
    result: A retained Operational Qualification exists independently of source LMS/course completion.
    failure_paths: [Evidence is insufficient; course completion is treated as qualification automatically; actor is outside confirmed authority.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.training-qualification.establish-qualification, description: Reconciled Phase 14 use-case candidate after grant-authority clarification.}]
      confidence: high
      status: candidate

  - id: use-case.workforce-availability.fill-gap
    name: Fill an Operational Staffing Gap
    bounded_context: bc.workforce-availability
    goal: Support and retain a supervisor's judgment about who can cover a specific operational job at a specific time.
    actors: [supervisor]
    trigger: A staffing gap requires replacement coverage.
    preconditions: [Staffing need identifies job/time context; qualification and availability facts are available or explicitly unknown.]
    commands: [command.workforce-availability.select-replacement]
    queries: [query.workforce-availability.coverage]
    domain_services: []
    events_observed: [event.workforce-availability.replacement-selected]
    result: The supervisor's selected replacement decision is retained with qualification/availability evidence references.
    failure_paths: [Qualification or availability prerequisites are not satisfied; missing source facts are fabricated; application orchestration replaces the supervisor's business judgment with an unsupported deterministic rule.]
    status: candidate
    provenance:
      sources: [{type: discovery, reference: use-case-candidate.workforce-availability.fill-gap, description: Reconciled Phase 14 use-case candidate after supervisor-judgment clarification.}]
      confidence: high
      status: candidate
