application_use_cases:
  - id: use-case.training-qualification.withdraw-qualification
    name: Withdraw Operational Qualification
    bounded_context: bc.training-competency
    goal: Explicitly end a person's current Operational Qualification for a job while preserving the complete qualification and withdrawal history.
    actors: [employee supervisor, designated trainer or subject-matter expert]
    trigger: An authorized person determines that an existing Operational Qualification should no longer remain current.
    preconditions: [The Operational Qualification exists and is currently valid; the actor is within confirmed qualification authority.]
    commands: [command.training-qualification.withdraw-qualification]
    queries: [query.training-qualification.who-can-do-job]
    domain_services: []
    events_observed: [event.training-qualification.operational-qualification-withdrawn]
    result: The qualification is no longer current for future staffing/coverage decisions, while its prior establishment, evidence, withdrawal reason, actor, and effective time remain retained history.
    failure_paths: [Actor lacks authority; qualification is not current; history would be erased; elapsed time is treated as automatic expiration.]
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-23 qualification lifecycle clarification
          description: Operational Qualification remains valid until explicitly withdrawn.
      confidence: high
      status: candidate
