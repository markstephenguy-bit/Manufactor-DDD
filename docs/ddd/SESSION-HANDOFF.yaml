language_model:
  domain_language: docs/ddd/language/domain-language.yaml
  contextual_language: docs/ddd/language/ubiquitous-language.yaml
  major_stabilized_distinctions:
    - Operational Incident is not automatically a Nonconformity, failed verification, or asset failure.
    - Failed Quality Check is not automatically a Corrective Action Nonconformity.
    - Reliability Verification result is not Asset Condition.
    - Operational Qualification is not source course completion and is not Availability.
    - Operational Availability is not Qualification; Operational Coverage requires both.
    - Kiln Operations Moisture Outcome is an operational interpretation of source ProTrack measurements, not the source measurement itself.
    - LTV Form Template and LTV Printed Instance are distinct; Sign-Off is only a possible instance lifecycle state/action.
    - ManuFactor Gap does not imply replacement-system ownership.
    - Source Authority remains with the context/system that owns the original fact lifecycle.
