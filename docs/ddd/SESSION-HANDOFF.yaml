domain_expert_answers:
  - subject: business-responsibility-separation
    answer: Safety Sign-Off, CAPA, and Environmental are separate business responsibilities; CAPA is a quality aspect
  - subject: qms-ownership
    answer: There is no QMS; QMS components may be handled by GP systems such as CMMS, SAP ERP, and others; ManuFactor is a gap filler, current-system reader, and data aggregator; QMS responsibilities must be evaluated individually
  - subject: product-quality-verification-current-state
    answer: If someone in a quasi-QC role suspects a lumber quality problem, they may manually measure lumber with a caliper; they may not know the applicable targets; there is no system or schedule for performing the check and no system for recording the result
  - subject: product-quality-target-context
    answer: Quality targets differ mill to mill because they are relative to the machines in the different parts of each mill
session_resume: Read this file and files_to_read from the canonical repository. Strategic domain questions are asked directly by ChatGPT. Prior chat memory and Claude Code state are not required.
