  - name: Analytics
    reason: Superset/data-analysis examples are gap-filling mechanisms within business domains, not evidence of a separate Analytics Subdomain
important_domain_facts:
  - ManuFactor is a gap filler, current-system reader, data aggregator, and analytical enabler around existing GP systems; reading or analyzing data does not imply ownership of the source business workflow
  - There is no ManuFactor-owned monolithic QMS
  - Quality contains CAPA and Product Quality Verification; additional Quality responsibilities may remain open without blocking strategic progress
  - Product Quality Verification uses contextual mill/machine/process targets; finished planed sizes use standard market sizes and SPIB monitors finished sizes
  - Safety, Environmental, and HR are broader business areas; currently known capabilities do not exhaust them
  - Maintenance/Reliability remains a business domain even where CMMS owns operational maintenance workflows
  - Operations means gaps under mill operations and must not imply ERP/MES/production-execution ownership
  - Project Tracking belongs directly under Operations; Projects / Continuous Improvement is not required as a separate grouping
