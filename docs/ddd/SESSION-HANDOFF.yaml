  - DDD discovery is complete for current evidence; do not resume broad questioning merely because tactical artifacts remain candidate.
  - Mark is the domain authority.
  - Preserve stable IDs unless modeled identity changes.
  - Do not equate departments, capabilities, applications, Subdomains, or Bounded Contexts.
  - Do not use ArchiMate as canonical DDD authority.
  - ManuFactor is a gap filler, source-system reader/aggregator/correlator, and owner of missing workflows/records where real gaps exist.
  - Reading/correlating source data does not transfer source authority or create lineage absent from source data.
  - Reusable development components may provide technical mechanics across contexts but must not own domain-specific state-transition rules merely because those mechanics are shared.
  - A shared workflow/history/evidence/parameter/identity component is infrastructure unless business semantics prove an independent Bounded Context.
  - If component design exposes a real business contradiction, record it as new DDD evidence and reopen only the affected model area.

