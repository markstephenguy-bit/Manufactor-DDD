behavior_model:
  commands: docs/ddd/commands/index.yaml
  command_count: 23
  domain_events: docs/ddd/domain-events/index.yaml
  domain_event_count: 21
  modeling_rules:
    - Commands express intent to change domain state and target the owning Aggregate.
    - Domain Events are domain-significant facts that occurred and use past-tense names.
    - Technical CRUD/database changes are not Domain Events.
    - Cross-context transition policies remain outside Aggregate behavior until their business decision rule is known.
important_event_boundaries:
  - QualityCheckEvaluated remains a Quality Verification fact and does not create Nonconformity automatically.
  - VerificationCompleted remains a Reliability Verification fact and does not change Asset Condition automatically.
  - LTVFormInstanceIssued records printing/issuance and does not imply sign-off.
  - OperationalQualificationEstablished can be consumed by Workforce Availability without transferring qualification ownership.
  - CorrectiveWorkRouted records CAPA routing without transferring destination work ownership into Corrective Action.
unresolved_transition_rules:
  - Failed Quality Check to Nonconformity exact acceptance rule
  - Reliability Verification Result to Asset Condition/Lifecycle State exact transition rule
  - Qualification completion/demonstrated capability/authorization/expiration details
  - LTV process-specific approval/sign-off requirements
