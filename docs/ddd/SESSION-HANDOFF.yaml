important_tactical_constraints:
  - Do not aggregate concepts just because they have parent-child relationships or database foreign keys.
  - Quality Check and Nonconformity remain cross-context concepts with an explicit translation/transition boundary.
  - Verification Result and Asset Condition remain cross-context concepts with explicit transition rules still unresolved.
  - ProTrack source measurements remain external authority; Moisture Outcome is a Kiln Operations interpretation.
  - MP2 WR/WO records remain external authority; Asset owns richer ManuFactor lifecycle semantics.
  - LTV Form Template and LTV Printed Instance have separate identity/lifecycle semantics even if they ultimately participate in one Aggregate.
  - Operational Qualification and Operational Availability are distinct inputs to staffing coverage.
