  candidates: [Operational Record, Kiln Schedule, Kiln Run/Charge, Project, Quality Check, Nonconformity, Asset, Reliability Verification, LTV Form Template, LTV Printed Instance, Operational Qualification, Operational Coverage Plan]
entity_value_model:
  entities: docs/ddd/entities/index.yaml
  aggregate_root_entity_count: 12
  value_objects: docs/ddd/value-objects/index.yaml
  value_object_candidate_count: 8
  entity_classification_rule: Persistent business identity through change, not database key presence.
  value_object_classification_rule: Meaning/equality by value with no independent lifecycle; conceptual immutability preferred.
  unresolved_internal_identity:
    - Milestone
    - Project Action
    - Correction
    - Corrective Action coordination record
    - AFAL Category Check
    - Asset History entry
    - Operational Setting History entry
  value_object_candidates:
    - Quality Measurement
    - Quality Verification Result
    - Asset Condition
    - Asset Lifecycle State (unresolved exact vocabulary)
    - Reliability Verification Result
    - LTV Form Status
    - Staffing Gap
    - Replacement Option
important_tactical_findings:
  - Aggregate roots are identity-bearing Entity candidates because their business identity persists through lifecycle/state change.
  - Asset Condition is value state of Asset, not a separate Entity.
  - Verification Result is value produced by one Reliability Verification, not an independently identified object.
  - Staffing Gap and Replacement Option are value-semantic parts of one Coverage Plan under current evidence.
  - LTV Form Template and LTV Printed Instance are separate identity-bearing Entities and separate Aggregates.
  - Ambiguous internals remain unresolved until independent business identity/lifecycle evidence is discovered.
