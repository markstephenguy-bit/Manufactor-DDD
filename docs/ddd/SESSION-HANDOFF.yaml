phase14_reconciled_business_decisions:
  operations_record:
    - Operations Record owns structured transactional capture for specific operational needs that otherwise lack an appropriate system of record.
    - Each form/record type must represent a distinct concrete business need; do not model one generic catch-all form merely for convenience.
    - Captured records may feed Superset/grains downstream, but Operations Record is not the analytics/grain layer.
  kiln_operations:
    - Kiln scheduling translates human business/Sales direction based on market demand plus upstream green-lumber availability into what lumber needs to be dried.
    - Market/Sales direction is not currently available as a structured data source.
    - Kiln planning determines what lumber needs drying, not finished SKU creation.
    - Planer optimization determines SKU creation downstream and is outside Kiln Operations.
    - Kiln run review is performance analysis comparing retained kiln history with downstream planer results using ProTrack moisture data.
    - ProTrack remains authoritative for its source moisture measurements.
  project_tracking:
    - A project is a project; use conventional project-management semantics with Monday.com as a practical reference point.
    - Do not use Project Tracking as a bucket for ordinary tasks, investigations, MP2 work orders, or CAPA actions.
  training_qualification:
    - Current qualification practice is informal to a fault; ManuFactor fills a control/evidence gap by making qualification explicit and retained.
    - Operational Qualification may be granted by either the employee's supervisor or a designated trainer/subject-matter expert.
    - LMS/course completion may be evidence but is not automatically the Operational Qualification.
  workforce_availability:
    - Qualification and current availability are inputs to staffing decisions.
    - Ability to cover a specific job is ultimately a supervisor's subjective judgment.
    - That judgment/selection should be retained as a matter of record rather than existing only in supervisor memory.
  asset_lifecycle:
    - MP2 is primarily effective as a WR/WO mechanism and is weak as a rich asset-management model.
    - Reuse MP2 hierarchy as the structural/drillable asset backbone.
    - Link MP2 records to the appropriate drillable asset levels.
    - ManuFactor owns richer asset identity/condition/lifecycle/history semantics while MP2 retains authority for its hierarchy and WR/WO transaction facts.
  reliability_verification:
    - A millwright may log a reliability finding.
    - The maintenance supervisor decides whether to promote the finding into formal action/state change.
    - The Reliability Manager is ultimately accountable for the reliability process.
    - A logged finding does not automatically change Asset state.
  quality_verification:
    - ISO 9001/ISO 9000 is the default QMS conceptual/terminology baseline without creating a monolithic QMS context.
    - Non-salaried employees route QMS-based quality concerns through the QC channel for triage; do not invent whether that channel is software or human workflow.
    - Management (all salaried employees at the mill) and designated quality technicians control formal quality triage/promotion and may initiate Quality Checks.
    - Quality Check is optional before Nonconformity; sufficient evidence may allow direct promotion.
    - Failed Quality Check does not automatically create a Nonconformity.
    - Quality Concern remains open when promoted to a Nonconformity unless a later independent closure rule is established.
    - Applicable quality targets are ManuFactor-maintained parameters resolved by mill/machine/process context.
    - Salaried management may create/change quality-target parameters.
  corrective_action:
    - CAPA belongs to Quality.
    - The affected department's salaried Quality office works the Nonconformity through investigation, corrective-action coordination/routing, and closure.
    - Routed execution may occur in another system/context without transferring ownership of the quality record.
  ltv_form_management:
    - LTV is a controlled workflow record, not merely a printable document.
    - The normal record includes exact form/template version, the job/equipment/process it applies to, who completed/signed it and when, and progression/maturity through workflow states.
    - General Safety incident management remains outside this bounded context.
  environmental_compliance:
    - Real gaps exist, but detail is insufficient. Keep deferred until Mark has a concrete list.

