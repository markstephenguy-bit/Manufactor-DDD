scenario_validated_business_boundaries:
  - Quality Concern, Quality Check, and Nonconformity remain distinct; failed checks do not automatically become Nonconformities.
  - CAPA corrective work is task-based; routed execution remains externally owned; CAPA closure requires retained effectiveness verification.
  - ProTrack moisture analysis is statistical by thickness x width x length and cannot fabricate kiln-run lineage.
  - Workforce replacement requires current qualification plus availability and retained supervisor judgment.
  - Operational Qualification is established by job shadowing/observed capability, persists until explicit withdrawal/supersession, and retains history.
  - Reliability Verification findings do not directly mutate Asset state; maintenance supervisor promotion and Asset Lifecycle authority remain separate.
  - Asset Condition and Asset Lifecycle State remain separate controlled concepts.
  - LTV becomes Recorded only after Safety receipt, scan, and reliable match to the originating electronic record; LTV history is retained.
  - Operations Record owns concrete structured-record gaps and correction/history semantics, not a generic catch-all form or analytics lifecycle.
  - Project Tracking owns actual business Projects; routine tasks remain outside it; Project completion does not imply CAPA closure.
  - Corrective work may be routed to Project Tracking only when the business genuinely recognizes/manages that work as a Project; CAPA and Project lifecycles remain separate.
  - Environmental remains intentionally deferred until a concrete ManuFactor Environmental workflow/system gap is evidenced.

