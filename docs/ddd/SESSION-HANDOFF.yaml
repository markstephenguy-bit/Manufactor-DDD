startup_instructions:
  - Treat markstephenguy-bit/Manufactor-DDD as authoritative session state.
  - Read docs/ddd/SPECIFICATION.md before changing model semantics.
  - Read docs/ddd/CANONICAL-REGISTRY.yaml before counting or validating tactical objects.
  - Read docs/ddd/reports/validation-report.md and docs/ddd/issues/unresolved.yaml before asking domain questions.
  - Do not reconstruct canonical state from chat when GitHub contains it.
  - Mark is the domain authority.
  - Ask one high-value business question at a time only when a genuinely new unresolved rule exists.
  - Do substantial model/repository work between questions.
  - Preserve stable IDs unless modeled identity changes.
  - Do not equate departments, capabilities, applications, Subdomains, or Bounded Contexts.
  - Do not use ArchiMate as canonical DDD authority.
  - Prefer standard-informed terminology where useful, but do not claim a standard mandates terminology without evidence.
  - Use ISO 9000/9001 as the default Quality/QMS conceptual vocabulary baseline without inventing a monolithic QMS.
  - ManuFactor is a gap filler, source-system reader/aggregator/correlator, and owner of missing workflows/records where real gaps exist; it is not a wholesale ERP/MES/CMMS/HR/QMS/Safety/analytics replacement.
  - Reading, correlating, or statistically comparing source data does not transfer source authority or create lineage that source data does not contain.
  - Retained business records generally change status/history rather than disappearing when current domain evidence establishes continued referenceability.

