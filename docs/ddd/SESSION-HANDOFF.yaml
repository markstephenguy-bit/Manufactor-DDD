important_completed_business_decisions:
  - Operations Record owns concrete missing operational record workflows, not a generic catch-all form or analytics grain model.
  - Kiln planning determines what lumber needs drying; downstream planer optimization determines finished SKU creation.
  - ProTrack moisture records are not traceable to individual Kiln Runs/Charges; they support statistical analysis by lumber dimension thickness x width x length only.
  - Project means a real Project using conventional project-management semantics.
  - Operational Qualification evidence is practical job shadowing/observed capability with the current competent worker; LMS/course completion alone does not equal qualification.
  - Operational Qualification remains valid until explicitly withdrawn or superseded; elapsed time alone does not expire it.
  - Workforce replacement selection is ultimately a supervisor judgment retained as business history; qualification and availability remain prerequisite inputs.
  - MP2 provides hierarchy and WR/WO transaction facts; ManuFactor owns richer Asset identity/condition/lifecycle/history semantics.
  - Asset Condition is Operating, Degraded, or Down; Asset Lifecycle State is In Service, Out of Service, or Retired.
  - Reliability findings may be logged by a millwright; maintenance supervisor decides promotion; Reliability Manager is accountable.
  - Quality Concern, Quality Check, and Nonconformity are distinct lifecycle concepts.
  - Quality Concern records never disappear when handling ends; they change status and retain identity/history so they can be referenced later.
  - Quality Check is optional before Nonconformity; a failed check is not automatically a Nonconformity.
  - Nonconformity admission requires explicit authorized determination that an applicable requirement was not fulfilled.
  - Corrective work under a CAPA is represented as tasks; tasks are not independent child Corrective Action lifecycles.
  - CAPA closure requires all required corrective work plus retained effectiveness verification showing that the correction actually worked.
  - Applicable quality targets are ManuFactor-maintained contextual parameters; salaried management may create/change them.
  - CAPA belongs to Quality; the affected department's salaried Quality office owns the Nonconformity/CAPA lifecycle while routed execution remains externally owned.
  - LTV printed/issued paper is returned to the Safety Office, scanned, matched to the originating electronic record, and then the retained record transitions to Recorded.
  - LTV records never disappear after recording; later changes are retained status/history transitions.
  - Environmental remains a confirmed opportunity area but is deferred until concrete process gaps are identified.

