important_boundary_corrections:
  - Human Resources is rejected as an active ManuFactor Subdomain for known training/qualification and staffing gaps; those are operational semantics.
  - Identity & Access is shared platform infrastructure, not a business Subdomain.
  - Environmental Compliance is deferred until a concrete gap exists.
  - MP2 owns WR/WO records but does not provide meaningful asset-management semantics; Asset Lifecycle owns the richer ManuFactor asset model.
  - Vehicle Management is merged into Physical Asset Management / Asset Lifecycle; equipment and vehicles use the same physical-asset model under current evidence.
  - ProTrack owns planer moisture measurements; Kiln Operations owns retained scheduling/run history and correlation to drying outcomes.
  - LTV Form Management is the real Safety gap: managing LTV forms/templates, printing/issuing instances, retaining/tracking those forms, and supporting approval/sign-off only where applicable. Sign-off is not the defining context.
