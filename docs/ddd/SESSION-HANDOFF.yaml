important_boundary_findings:
  - Kiln Operations owns retained kiln scheduling/operations history and correlation to downstream ProTrack moisture outcomes; ProTrack remains authoritative for source moisture measurements.
  - Asset Lifecycle owns meaningful asset identity/condition/lifecycle/history missing from MP2; MP2 remains authoritative for its WR/WO records posted to machine assets.
  - Reliability Verification owns verification/checkpoint evidence and is distinct from Asset Lifecycle.
  - Operational Training and Qualification owns the operational interpretation of training coverage/cross-operator depth; Moodle/learning systems remain source authorities for their records.
  - Operational Workforce Availability owns vacation/coverage/replacement-readiness semantics and consumes qualification plus HR/timekeeping facts.
  - Quality Verification and Corrective Action remain distinct models.
  - Operations Record is authoritative for the operational record it creates, not for every referenced subject.
open_nonblocking_issues:
