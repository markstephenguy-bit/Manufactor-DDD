aggregate_model:
  canonical_index: docs/ddd/aggregates/index.yaml
  additional_candidate_files:
    - docs/ddd/aggregates/kiln-schedule.yaml
  candidate_aggregate_count: 12
  candidates:
    - Operational Record
    - Kiln Schedule
    - Kiln Run/Charge
    - Project
    - Quality Check
    - Nonconformity
    - Asset
    - Reliability Verification
    - LTV Form Template
    - LTV Printed Instance
    - Operational Qualification
    - Operational Coverage Plan
  rejected_oversized_groupings:
    - One Kiln aggregate containing schedule, runs, moisture outcomes, and ProTrack source measurements
    - One Asset/Reliability aggregate
    - One LTV aggregate containing template and every printed instance
    - One Training Matrix aggregate containing all people/jobs/qualifications
    - One Workforce aggregate containing HR facts, qualifications, schedules, and every coverage decision
  important_invariant_findings:
    - Kiln Schedule revision/history is a separate consistency boundary from Kiln Run execution history.
    - Moisture Outcome is derived and does not currently justify its own aggregate.
    - A Quality Check owns its historical measurement/evaluation basis but does not own Nonconformity transition.
    - Asset Condition changes through Asset; Verification Result remains inside Reliability Verification.
    - LTV Form Template and LTV Printed Instance must remain separate aggregates because issued instances must not change when templates are revised.
    - Cross-Training Matrix is a projection over person-job Operational Qualification relationships, not one atomic aggregate.
    - Staffing coverage decisions consume qualification and HR/time facts but do not own those source models.
