invariant_model:
  canonical: docs/ddd/invariants/index.yaml
  candidate_invariant_count: 22
  major_invariant_groups:
    - Operational Record history preservation
    - Kiln Schedule revision history and Kiln Run identity/history
    - ProTrack source-authority preservation
    - Project lifecycle status ownership
    - Quality target/evidence coherence and failed-check boundary
    - Explicit Nonconformity acceptance and CAPA routing ownership
    - Asset identity/history integrity and MP2 translation boundary
    - Reliability Verification evidence and Asset-state separation
    - LTV template/version and printed-instance traceability
    - Qualification evidence and availability separation
    - Staffing coverage requires both qualification and availability
  unresolved_transition_rules:
    - Failed Quality Check to Nonconformity exact acceptance rule
    - Reliability Verification Result to Asset Condition/Lifecycle State exact transition rule
    - Qualification completion/demonstrated capability/authorization/expiration details
    - LTV process-specific approval/sign-off requirements
important_tactical_findings:
  - Invariants are now first-class and must govern later Commands/Events/Policies.
  - Cross-context transitions are not Aggregate invariants unless the destination rule is known.
  - Source-system facts remain externally authoritative even when consumed by local behavior.
  - Failed checks and failed verifications remain facts in their source contexts until an explicit transition rule acts.
open_nonblocking_issues:
  - ISSUE-0003: Vehicle Management versus Physical Asset Management
  - Exact business identity/revision semantics for Kiln Schedule require tactical refinement
  - Exact CAPA closure details and child Corrective Action identity remain unresolved
  - Exact Asset condition/state vocabulary remains unresolved
  - Exact kiln-to-ProTrack correlation identifiers/rules remain unresolved
  - Vacation planning may later justify its own aggregate if schedule-wide invariants are discovered
specification_authority:
  source_document: ManuFactor_DDD_Modeling_Specification.docx
  repository_specification: docs/ddd/SPECIFICATION.md
  rule: Commands express domain intent; Domain Events express facts that occurred. Neither may bypass Aggregate invariants or invent unresolved business transitions.
