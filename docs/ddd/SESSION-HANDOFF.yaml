next_action: Walk through each active Subdomain and its Bounded Contexts during Phase 14. For each, state the current model, identify where assumptions may be wrong or underspecified, and ask one high-value business question at a time where clarification can materially change the model. After Phase 14, perform Specification Phase 15 Integration Validation.
startup_instructions:
  - Treat this repository as the authoritative DDD session state.
  - Read docs/ddd/SPECIFICATION.md before strategic or tactical modeling.
  - Read docs/ddd/reports/validation-report.md and this SESSION-HANDOFF.yaml before new work.
  - Continue from Specification Phase 14; do not use obsolete session-local phase numbering.
  - Mark is the domain authority.
  - During Phase 14, deliberately walk through every active Subdomain/Bounded Context that needs clarification rather than only modeling obvious use cases.
  - For each area, explain what the model currently assumes, challenge assumptions that may be wrong, and ask one business-facing question at a time when the answer can materially change the model.
  - Perform substantial whole-map work between questions; do not turn Phase 14 into a long questionnaire.
  - Existing systems, code, databases, documents, and architecture are evidence, not automatic domain truth.
  - Preserve stable IDs when names/framing change unless modeled identity itself changes.
  - For Quality/QMS concepts, use ISO 9001/ISO 9000 terminology and conceptual structure as the default baseline where applicable; do not repeatedly rediscover standard QMS mechanics unless mill practice materially differs.
  - ManuFactor remains a gap filler rather than a wholesale QMS implementation.
  - Non-salaried employees may submit QMS-based quality concerns through the QC channel for triage; they do not directly create formal QMS records. Management (all salaried employees at the mill) and designated quality technicians control triage/promotion into formal quality records.
