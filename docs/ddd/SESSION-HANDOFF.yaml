post_phase15_hardening:
  resolved:
    - issue: ISSUE-0004
      result: >
        Nonconformity admission is modeled by policy.corrective-action.determine-nonconformity-admission. An authorized management/designated-quality-technician reviewer must explicitly determine from retained evidence that an identified applicable requirement was not fulfilled. Quality Concern or failed Quality Check alone never creates a Nonconformity automatically, and Quality Check is not a mandatory gate.
    - issue: ISSUE-0005
      result: >
        There is no deterministic Reliability Verification Result to Asset State mapping. A millwright records the finding; the maintenance supervisor decides whether to promote it; Asset Lifecycle owns any resulting state transition.
    - issue: ISSUE-0006
      result: >
        Operational Qualification is supported by practical job evidence: the person shadows the current competent worker and is observed sufficiently for an authorized supervisor or designated trainer/SME to determine that the person is capable of doing the job. Course/LMS completion may support but does not establish qualification automatically. Once granted, qualification persists until explicitly withdrawn or superseded; elapsed time alone does not expire it. Withdrawal preserves prior evidence/history.
    - issue: ISSUE-0008
      result: >
        ProTrack does not record a Kiln Run/Charge identifier. Moisture data is recorded by lumber dimension, so Kiln Operations may analyze moisture statistically by thickness x width x length but must not attribute individual ProTrack measurements to a specific kiln run. The prior run-moisture query was replaced with query.kiln-operations.dimension-moisture-statistics.
    - issue: ISSUE-0009
      result: >
        Asset Condition uses Operating, Degraded, and Down. Asset Lifecycle State uses In Service, Out of Service, and Retired. Functional condition and lifecycle position remain separate Value Objects. Accepted transitions preserve history and are not inferred from MP2 or Reliability Verification alone.
    - issue: ISSUE-0010
      result: >
        Corrective work is represented as tasks owned by the parent Nonconformity/CAPA rather than independent child Corrective Action lifecycles. Completing tasks is necessary but not sufficient for closure. The CAPA remains active until post-correction effectiveness is verified and retained as closure evidence. Routed execution work may remain externally owned.
    - issue: ISSUE-0011
      result: >
        No separate vacation-planning Aggregate is justified at current evidence level. Vacation coverage is a staffing need handled within Operational Coverage Plan unless future schedule-wide invariants establish a distinct consistency boundary.
    - issue: ISSUE-0012
      result: >
        Quality Concern is a retained historical record whose identity persists through triage, escalation, disposition, and later status changes. Ending active handling changes status rather than deleting or replacing the concern. Links to accepted Nonconformities remain references while CAPA lifecycle stays externally owned.
  narrowed:
    - issue: ISSUE-0007
      result: Printing/issuance is modeled; only process-specific completion/approval/sign-off transitions remain unresolved.

open_nonblocking_issues:
