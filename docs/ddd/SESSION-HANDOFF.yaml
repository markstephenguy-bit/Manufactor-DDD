bounded_context_discovery:
  candidate_count: 11
  strong_candidates: [bc.operations-record, bc.project-tracking, bc.quality-verification, bc.corrective-action, bc.reliability-verification, bc.safety-signoff, bc.environmental-compliance]
  ownership_challenge_candidates: [bc.kiln-operations, bc.asset-lifecycle, bc.training-competency, bc.workforce-availability]
  important_boundary_findings:
    - Subdomains do not map one-to-one to Bounded Contexts.
    - Quality Verification and Corrective Action have distinct language, triggers, and lifecycle and should remain separate candidates.
    - Project Tracking is distinct from Corrective Action because planned/improvement work is not inherently Nonconformity-driven.
    - Asset Lifecycle and Reliability Verification are distinct candidate models: persistent asset state versus discrete verification evidence.
    - Training/Competency and Workforce Availability are distinct semantics even if both consume HR systems.
    - Safety Sign-Off and Environmental Compliance each currently form one cohesive candidate context, not the whole parent Subdomain.
    - Operations Record must not become authoritative for every subject referenced in an operational report.
    - External systems and departments do not define Bounded Context boundaries.
material_domain_question:
  subject: kiln-operation-authority
  question: Does ManuFactor actually own meaningful kiln scheduling/operating decisions and lifecycle, or is its kiln role primarily reading existing systems, reporting, analysis, and other gap-filling around an externally owned kiln-operation model?
deferred_nonblocking_questions:
