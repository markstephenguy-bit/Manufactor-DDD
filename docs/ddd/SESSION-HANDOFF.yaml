important_completed_business_decisions:
  - Operations Record owns concrete missing operational record workflows, not a generic catch-all form or analytics grain model.
  - Kiln planning determines what lumber needs drying; downstream planer optimization determines finished SKU creation.
  - ProTrack has no Kiln Run/Charge identifier; moisture analysis is statistical by lumber dimension thickness x width x length only.
  - Project means a real Project using conventional project-management semantics.
  - MP2 provides hierarchy and WR/WO transaction facts; ManuFactor owns richer Asset identity, condition, lifecycle, and retained history semantics.
  - Asset Condition uses Operating, Degraded, Down.
  - Asset Lifecycle State uses In Service, Out of Service, Retired.
  - Reliability findings may be recorded by a millwright; maintenance supervisor decides promotion; Reliability Manager is accountable; Reliability Verification does not directly mutate Asset state.
  - Operational Qualification may be granted by the employee supervisor or designated trainer/SME.
  - Operational Qualification evidence is practical job shadowing/observed capability with the current competent worker; LMS completion alone does not establish qualification.
  - Operational Qualification persists until explicitly withdrawn or superseded; elapsed time alone does not expire it; withdrawal preserves history.
  - Workforce replacement requires qualification and availability, with final supervisor judgment retained as business history.
  - Quality Concern, Quality Check, and Nonconformity are distinct lifecycle concepts.
  - Quality Concern retains identity and full status/history through escalation/disposition and remains referenceable later.
  - Quality Check is optional before Nonconformity; failed check does not automatically create Nonconformity.
  - Nonconformity admission requires explicit authorized determination that an applicable requirement was not fulfilled.
  - Applicable quality targets are ManuFactor-maintained contextual parameters; salaried management may create/change them.
  - CAPA belongs to Quality; affected department salaried Quality office owns the Nonconformity/CAPA lifecycle while routed execution remains externally owned.
  - Corrective work under CAPA is represented as tasks under the parent Nonconformity, not independent child Corrective Action aggregates.
  - CAPA closure requires required corrective work to be complete plus retained post-correction verification that the correction was effective.
  - LTV printing/issuance is an early lifecycle step.
  - A used LTV becomes Recorded only after Safety Office receipt, scan, reliable match to the originating electronic record, and retained recording transition.
  - LTV records never disappear on completion; identity/status/history remain referenceable.
  - Environmental remains a confirmed opportunity area but is deferred until concrete process gaps are identified.

