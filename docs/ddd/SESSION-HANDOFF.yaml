    unknown: Exact cancellation/abandonment transition, authority, status, and retained evidence.

scenario_validated_business_boundaries:
  - Quality target changes do not silently rewrite historical Quality Check evaluation basis.
  - Ambiguous target applicability blocks evaluation rather than selecting arbitrarily.
  - ProTrack late data may change analytical projections but cannot create fabricated kiln-run lineage.
  - Kiln Schedule revisions do not rewrite already-started Kiln Run execution history.
  - LTV scan without a reliable originating-record match cannot transition to Recorded.
  - Failed CAPA effectiveness verification keeps CAPA active even when all planned tasks were completed.
  - Operations Record correction preserves source history even after downstream analytics consumed an earlier value.
  - MP2 hierarchy restructuring changes external structural mapping, not established ManuFactor physical-asset identity by itself.

