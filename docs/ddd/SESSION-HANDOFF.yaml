important_boundary_findings:
  - Kiln Operations owns retained kiln scheduling/operations history and correlation to downstream ProTrack moisture outcomes; ProTrack remains authoritative for source moisture measurements.
  - Asset Lifecycle owns meaningful asset identity/condition/lifecycle/history missing from MP2; MP2 remains authoritative for its WR/WO records.
  - Reliability Verification owns verification/checkpoint evidence and is distinct from Asset Lifecycle.
  - Operational Training and Qualification owns operational qualification/cross-training coverage; source learning systems own their source completion records.
  - Operational Workforce Availability owns vacation/coverage/replacement-readiness semantics and consumes qualification plus personnel facts.
  - Quality Verification and Corrective Action remain distinct models; failed checks do not automatically become Nonconformities.
  - LTV Form Management owns the LTV template/form/printed-instance lifecycle; printing and form management are primary, while approval/sign-off is only part of that lifecycle where applicable.
  - Operations Record is authoritative for the operational record it creates, not for every referenced subject.
