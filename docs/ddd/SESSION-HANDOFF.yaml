  rejected_as_separate_aggregates:
    - Moisture Outcome: derived interpretation tied to Kiln Run and ProTrack facts
    - Applicable Quality Target: no independent transactional consistency boundary established
    - Asset Condition: state of Asset
    - Verification Result: produced by Reliability Verification
    - Replacement Option: member of staffing/coverage decision
    - LTV Form Status: state of Printed Instance
  unresolved:
