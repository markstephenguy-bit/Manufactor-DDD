post_phase15_hardening:
  resolved:
    - issue: ISSUE-0004
      result: >
        Nonconformity admission is modeled by policy.corrective-action.determine-nonconformity-admission. An authorized management/designated-quality-technician reviewer must explicitly determine from retained evidence that an identified applicable requirement was not fulfilled. Quality Concern or failed Quality Check alone never creates a Nonconformity automatically, and Quality Check is not a mandatory gate.
    - issue: ISSUE-0005
      result: >
        There is no deterministic Reliability Verification Result to Asset State mapping. A millwright records the finding; the maintenance supervisor decides whether to promote it; Asset Lifecycle owns any resulting state transition. The remaining state vocabulary/transition detail is ISSUE-0009.
    - issue: ISSUE-0008
      result: >
        ProTrack does not record a Kiln Run/Charge identifier. Moisture data is recorded by lumber dimension, so Kiln Operations may analyze moisture statistically by thickness x width x length but must not attribute individual ProTrack measurements to a specific kiln run. The prior run-moisture query was replaced with query.kiln-operations.dimension-moisture-statistics.
    - issue: ISSUE-0011
      result: >
        No separate vacation-planning Aggregate is justified at current evidence level. Vacation coverage is a staffing need handled within Operational Coverage Plan unless future schedule-wide invariants establish a distinct consistency boundary.
  narrowed:
    - issue: ISSUE-0006
      result: Grant authority is already known; only evidence/review/expiration/withdrawal rules remain unresolved.
    - issue: ISSUE-0007
      result: Printing/issuance is modeled; only process-specific completion/approval/sign-off transitions remain unresolved.
    - issue: ISSUE-0012
      result: No-escalation disposition/closure with retained reason is supported; only independent closure after Nonconformity escalation remains unresolved.

