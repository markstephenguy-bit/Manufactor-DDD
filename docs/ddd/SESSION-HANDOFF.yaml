    - Cross-Training Matrix is currently best treated as a projection across Operational Qualification relationships
important_tactical_constraints:
  - Aggregate roots must protect real invariants; no table/container aggregates.
  - Quality Check -> Nonconformity remains a cross-context transition, not one aggregate.
  - Reliability Verification -> Asset Condition remains a cross-context transition, not one aggregate.
  - ProTrack source measurements remain external authority.
  - MP2 WR/WO records remain external authority.
  - LTV Form Template and LTV Printed Instance are separate aggregates under current identity/version/provenance evidence.
  - Operational Coverage validates qualification and availability references but does not own either source lifecycle.
