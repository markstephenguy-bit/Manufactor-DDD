business_positioning:
  - ManuFactor is a gap filler, current-system reader, extractor, aggregator, correlator, analysis enabler, and owner of missing workflows/records when a real gap exists.
  - ManuFactor is not a wholesale ERP, MES, CMMS, HR, QMS, or analytics replacement.
  - Reading or correlating data does not transfer source authority.
