phase: Specification Phase 14 — Use Cases and Queries
status: discovery-candidate
purpose: >
  Capture the whole-map application-facing information needs and orchestration flows
  implied by the established domain model before promoting them to canonical Queries
  and Application Use Cases.

actor_model:
  direct_user_scope: every employee may be a direct ManuFactor user where a workflow applies
  interpretation: >
    ManuFactor is a frontline-through-management work system, not primarily a supervisor or
    specialist application. Specific actions may still be constrained by role, authority,
    qualification, or workflow rules; broad direct-user scope does not mean every employee
    can perform every command.
  mill_management_definition: all salaried employees at the mill are considered management
  strongest_current_example: bc.safety-signoff / LTV Form Management
  evidence:
    - type: domain-expert
      reference: Mark direct, 2026-08-22
      description: Mark stated that ManuFactor direct use extends all the way down to every employee and that this is manifest in the LTV subdomain.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 quality concern clarification
      description: Any employee may report a suspected lumber-quality concern, but a selected role starts the formal Quality Check.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 quality authorization clarification
      description: At the mill, all salaried employees are considered management; formal Quality Checks may be started by management and designated quality technicians.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 quality concern disposition clarification
      description: A reported quality concern that does not rise to formal quality action is closed/dispositioned with a retained reason.
    - type: domain-expert
      reference: Mark direct, 2026-08-22 concern promotion lifecycle clarification
      description: When a Quality Concern is promoted to a Nonconformity, the Quality Concern remains open rather than closing at promotion.
  confidence: high

quality_terminology_guardrail:
  rule: >
    Preserve established quality-management terminology in the canonical model. Domain-expert
    shorthand such as "issue" may describe intent conversationally, but should map to the
    appropriate quality term when the meaning is clear. In the current workflow the formal
    escalated quality record is Nonconformity, not a generic Issue.
  current_terms:
    - Quality Concern: reported suspicion/intake before formal determination
    - Quality Check: optional formal verification/measurement activity used to gather/evaluate evidence
    - Nonconformity: formal quality record when the concern is accepted as failure to meet an applicable requirement
    - Corrective Action: action addressing cause/recurrence within the CAPA lifecycle

quality_concern_lifecycle_candidate:
  concept_name: Quality Concern
  bounded_context: bc.quality-verification
  meaning: A reported suspicion of a product-quality problem that exists before any formal Quality Check or Nonconformity.
  cmms_analogy: >
    Quality Concern behaves like a work request in a CMMS for intake and review, but differs in one
    important respect established by Mark: promotion to a formal Nonconformity does not close the
    source concern. The concern and Nonconformity remain related records with independent lifecycles.
  reported_by: any employee
  reviewed_by: [management, designated quality technician]
  lifecycle:
    - reported
    - reviewed/triaged
    - closed/dispositioned with reason when no formal quality escalation is justified
    - or linked/promoted directly to a Nonconformity when sufficient basis exists, while concern remains open
    - or linked to a formal Quality Check when additional measurement/evaluation is useful
    - concern closure after escalation requires its own later rule and must not be inferred from Nonconformity creation
  important_rules:
    - Reporting a Quality Concern does not create a Quality Check.
    - Reporting a Quality Concern does not create a Nonconformity.
    - A Quality Check is not a mandatory gate before Nonconformity.
    - Management or a designated quality technician may promote a Quality Concern directly to Nonconformity when sufficient basis exists.
    - If the concern does not justify formal escalation, it must be closed/dispositioned with a retained reason.
    - When a Quality Check is used, its result remains evidence and does not automatically create a Nonconformity.
    - Promotion to Nonconformity does not close the Quality Concern.
    - Quality Concern and Nonconformity retain independent lifecycles and remain linked by identity/reference, not by aggregate containment.
  modeling_implication: >
    Quality Concern has meaningful identity/lifecycle/history and is therefore a strong candidate
    for a first-class Domain Concept and likely its own Aggregate rather than a transient notification.

candidate_queries:
  - id: query-candidate.operations-record.history
    bounded_context: bc.operations-record
    name: View Operational Record History
    purpose: Show retained operational records, including corrections/history, for a selected operational scope and time period.
    likely_inputs: [mill or operational scope, time period, record type]
    likely_result: Operational records with retained correction/history context.
    authoritative_source: bc.operations-record

  - id: query-candidate.kiln-operations.schedule
    bounded_context: bc.kiln-operations
    name: View Kiln Schedule
    purpose: Show the current retained kiln plan and relevant schedule revision history.
    likely_inputs: [mill, kiln or planning scope, planning period]
    likely_result: Current schedule plus historically traceable revisions as needed.
    authoritative_source: bc.kiln-operations

  - id: query-candidate.kiln-operations.run-moisture
    bounded_context: bc.kiln-operations
    name: Review Kiln Run and Moisture Outcome
    purpose: Review one completed Kiln Run/Charge together with correlated downstream ProTrack moisture measurements/outcome information.
    likely_inputs: [kiln run identity]
    likely_result: Retained run history plus composed/correlated moisture outcome information with ProTrack provenance preserved.
    authoritative_source: Composition of bc.kiln-operations and external.protrack-moisture; not one shared model.

  - id: query-candidate.project-tracking.project-status
    bounded_context: bc.project-tracking
    name: View Project Status
    purpose: Show project purpose, lifecycle/status, and retained project information.
    likely_inputs: [project identity or project filters]
    likely_result: Project status and owned project information.
    authoritative_source: bc.project-tracking

  - id: query-candidate.quality-verification.concerns
    bounded_context: bc.quality-verification
    name: Review Reported Quality Concerns
    purpose: Show suspected product-quality concerns reported by employees and their disposition/escalation state.
    likely_inputs: [mill or operational scope, time period, concern status, subject/product context]
    likely_result: Reported concerns, review status, retained disposition reason, linked Quality Check where used, or linked Nonconformity while the concern may remain open.
    authoritative_source: bc.quality-verification for concern lifecycle; linked Nonconformity remains authoritative in bc.corrective-action.

  - id: query-candidate.quality-verification.check
    bounded_context: bc.quality-verification
    name: Review Quality Check
    purpose: Show a Quality Check with its measurement evidence, applicable historical target/basis, and evaluation result.
    likely_inputs: [quality check identity]
    likely_result: Quality Check evidence and result without implying CAPA/Nonconformity status.
    authoritative_source: bc.quality-verification

  - id: query-candidate.corrective-action.capa-status
    bounded_context: bc.corrective-action
    name: Review Nonconformity and CAPA Status
    purpose: Show a Nonconformity, its corrective-action coordination state, routed-work references, and closure status.
    likely_inputs: [nonconformity identity]
    likely_result: CAPA-owned status plus source concern/check references and externally owned execution references where applicable.
    authoritative_source: bc.corrective-action for Nonconformity/CAPA semantics; source contexts retain authority for their own facts.

  - id: query-candidate.asset-lifecycle.asset-history
    bounded_context: bc.asset-lifecycle
    name: Review Asset State and History
    purpose: Show a physical asset's ManuFactor identity, condition/lifecycle state, retained history, and correlated MP2 work references.
    likely_inputs: [asset identity]
    likely_result: Asset Lifecycle state/history with MP2 facts clearly identified as external.
    authoritative_source: bc.asset-lifecycle plus external.mp2-maintenance references.

  - id: query-candidate.reliability-verification.verification-history
    bounded_context: bc.reliability-verification
    name: Review Reliability Verification History
    purpose: Show verification instances/results and retained evidence for a selected asset.
    likely_inputs: [asset identity, optional time period]
    likely_result: Reliability Verification facts without treating results as Asset Condition.
    authoritative_source: bc.reliability-verification

  - id: query-candidate.ltv-form-management.forms
    bounded_context: bc.safety-signoff
    name: Find and Review LTV Forms
    purpose: Find current/past LTV templates and printed/issued form instances with exact template-version traceability.
    likely_inputs: [form type/template, date/status, instance identity]
    likely_result: Template/version and printed-instance information, including lifecycle state where known.
    authoritative_source: bc.safety-signoff

  - id: query-candidate.training-qualification.who-can-do-job
    bounded_context: bc.training-competency
    name: Who Can Do This Job
    purpose: Show personnel currently represented as operationally qualified for a selected job/role.
    likely_inputs: [job or operational role, optional mill/crew scope]
    likely_result: Qualification/cross-training coverage with evidence references as available.
    authoritative_source: bc.training-competency; external learning facts remain evidence only.

  - id: query-candidate.workforce-availability.coverage
    bounded_context: bc.workforce-availability
    name: Who Can Cover This Job Now
    purpose: Show replacement options for a staffing need by composing operational qualification with current availability.
    likely_inputs: [job/position, required time or shift, mill/crew context]
    likely_result: Eligible replacement options and the qualification/availability basis used at decision time.
    authoritative_source: bc.workforce-availability for coverage decision; qualification and HR/timekeeping facts retain their source authority.

candidate_use_cases:
  - id: use-case-candidate.operations-record.record-and-correct
    bounded_context: bc.operations-record
    name: Record and Correct an Operational Occurrence
    goal: Capture a retained operational fact and allow later correction without destroying the original history.
    actor_scope: Employees may directly participate where the operational workflow applies; correction authority may be narrower than record creation.
    established_commands: [RecordOperationalFact, CorrectOperationalRecord]
    supporting_queries: [View Operational Record History]

  - id: use-case-candidate.kiln-operations.manage-schedule
    bounded_context: bc.kiln-operations
    name: Maintain the Kiln Schedule
    goal: Replace spreadsheet-only planning with a retained schedule that can be revised without losing history.
    actor_scope: Direct users are employees participating in kiln operations; exact authority to create/revise schedules remains workflow-specific.
    established_commands: [CreateKilnSchedule, ReviseKilnSchedule]
    supporting_queries: [View Kiln Schedule]

  - id: use-case-candidate.kiln-operations.run-history
    bounded_context: bc.kiln-operations
    name: Record a Kiln Run and Review Drying Outcome
    goal: Start, record, complete, and later review a distinct Kiln Run/Charge together with downstream moisture outcome information.
    actor_scope: Employees involved in kiln work may directly use the workflow according to their responsibilities.
    established_commands: [StartKilnRun, RecordKilnOperation, CompleteKilnRun]
    supporting_queries: [Review Kiln Run and Moisture Outcome]

  - id: use-case-candidate.project-tracking.manage-project
    bounded_context: bc.project-tracking
    name: Track an Improvement or Capital Project
    goal: Establish and complete a discrete Project according to its own lifecycle rather than CAPA lifecycle.
    actor_scope: Direct use is not limited to management; employees participating in a project may interact with it as the workflow allows.
    established_commands: [CreateProject, CompleteProject]
    supporting_queries: [View Project Status]

  - id: use-case-candidate.quality-verification.report-concern
    bounded_context: bc.quality-verification
    name: Report a Suspected Quality Concern
    goal: Allow any employee who notices a possible lumber-quality problem to report it without creating a formal Quality Check or Nonconformity.
    actors: [any employee]
    trigger: Employee notices or suspects a possible lumber-quality problem.
    result: A retained Quality Concern is available for management or a designated quality technician to review.
    supporting_queries: [Review Reported Quality Concerns]
    boundary_rule: Reporting a concern does not itself create a Quality Check and does not create a Nonconformity.

  - id: use-case-candidate.quality-verification.review-concern
    bounded_context: bc.quality-verification
    name: Review and Disposition a Quality Concern
    goal: Review a reported Quality Concern and choose its proper disposition using quality-management terminology.
    actors: [management, designated quality technician]
    actor_definition: At the mill all salaried employees are considered management.
    trigger: A reported Quality Concern is awaiting review.
    result_options:
      - close/disposition the concern with a retained reason when no formal escalation is justified
      - start/link a formal Quality Check when additional evidence or measurement is useful
      - promote/link directly to a Nonconformity when sufficient basis exists without requiring a Quality Check; the concern remains open
    supporting_queries: [Review Reported Quality Concerns]
    boundary_rules:
      - Quality Check is optional and is not a mandatory gate to Nonconformity.
      - The Quality Concern remains retained as the source intake record regardless of disposition.
      - Promotion to a Nonconformity does not close the Quality Concern.
      - The Nonconformity, once accepted, belongs to bc.corrective-action rather than becoming a larger Quality Concern object.

  - id: use-case-candidate.quality-verification.perform-check
    bounded_context: bc.quality-verification
    name: Perform and Evaluate a Quality Check
    goal: Management or a designated quality technician starts a formal Quality Check when measurement/evaluation is useful, captures evidence, resolves the applicable target/basis, and records the evaluation result.
    actors: [management, designated quality technician]
    actor_definition: At the mill all salaried employees are considered management.
    trigger: Management or a designated quality technician determines that a concern or other valid trigger warrants formal measurement/evaluation.
    established_commands: [InitiateQualityCheck, RecordQualityMeasurement, EvaluateQualityCheck]
    supporting_queries: [Review Reported Quality Concerns, Review Quality Check]
    boundary_rule: A failed Quality Check does not automatically become a Nonconformity; explicit acceptance into the Nonconformity lifecycle remains required.

  - id: use-case-candidate.corrective-action.manage-nonconformity
    bounded_context: bc.corrective-action
    name: Manage a Nonconformity Through CAPA
    goal: Accept an eligible finding, coordinate/route corrective work, and close the Nonconformity under CAPA-owned rules.
    actor_scope: ManuFactor is broadly accessible, but Nonconformity admission/routing/closure authority may be role-specific.
    established_commands: [AcceptNonconformity, RouteCorrectiveWork, CloseNonconformity]
    supporting_queries: [Review Nonconformity and CAPA Status]
    established_policy: Route Corrective Work to Its Owning Context
    source_paths:
      - direct promotion from a reviewed Quality Concern when sufficient basis exists; the source Quality Concern remains open
      - explicit acceptance following a Quality Check or another supported finding source
    unresolved_boundary: Exact general admission and closure details remain ISSUE-0004 and ISSUE-0010.

  - id: use-case-candidate.asset-lifecycle.manage-asset
    bounded_context: bc.asset-lifecycle
    name: Manage Physical Asset State and History
    goal: Establish stable identity for equipment/vehicles and maintain meaningful condition/lifecycle history independent of MP2 work status.
    actor_scope: Employees may directly consume asset information; authority to register/change asset state remains workflow-specific.
    established_commands: [RegisterAsset, ChangeAssetCondition]
    supporting_queries: [Review Asset State and History]
    unresolved_boundary: Exact condition/lifecycle vocabulary remains ISSUE-0009.

  - id: use-case-candidate.reliability-verification.verify-asset
    bounded_context: bc.reliability-verification
    name: Perform a Reliability Verification
    goal: Record applicable verification evidence and complete a supported verification result for an asset.
    actor_scope: Employees assigned or authorized to perform the relevant verification directly use ManuFactor.
    established_commands: [CompleteVerification]
    supporting_queries: [Review Reliability Verification History]
    unresolved_boundary: Result-to-Asset-state effect remains ISSUE-0005.

  - id: use-case-candidate.ltv-form-management.manage-forms
    bounded_context: bc.safety-signoff
    name: Manage and Issue an LTV Form
    goal: Publish/manage a versioned LTV template, generate a traceable form instance, and track its print/issue lifecycle.
    actor_scope: Every employee is within the direct-user boundary where LTV work applies; this context is the strongest current evidence that ManuFactor extends to frontline employees.
    established_commands: [PublishLTVFormTemplate, GenerateLTVFormInstance]
    supporting_queries: [Find and Review LTV Forms]
    unresolved_boundary: Process-specific approval/sign-off rules remain ISSUE-0007.

  - id: use-case-candidate.training-qualification.establish-qualification
    bounded_context: bc.training-competency
    name: Establish Operational Qualification
    goal: Determine and retain that a person can perform a particular operational job based on acceptable evidence.
    actor_scope: Employees may directly view/interact with qualification information where appropriate; establishment authority remains role/workflow-specific.
    established_commands: [EstablishOperationalQualification]
    supporting_queries: [Who Can Do This Job]
    unresolved_boundary: Exact evidence/authorization/expiration rules remain ISSUE-0006.

  - id: use-case-candidate.workforce-availability.fill-gap
    bounded_context: bc.workforce-availability
    name: Fill an Operational Staffing Gap
    goal: Identify and select a replacement who is both qualified and available for the specific operational need.
    actor_scope: ManuFactor direct use extends to employees, while staffing selection authority may be constrained to roles responsible for coverage.
    established_commands: [SelectReplacement]
    supporting_queries: [Who Can Cover This Job Now]
    established_policy: Determine Operational Replacement Eligibility
    unresolved_boundary: Vacation planning aggregate question remains ISSUE-0011.

whole_map_observation: >
  ManuFactor is an enterprise-wide employee-facing work system. Use Cases therefore should
  not assume manager/specialist actors by default. Quality demonstrates a reusable intake-to-formal-work pattern:
  broad employee reporting creates a retained concern; authorized review either dispositions it,
  requests further formal evidence through a Quality Check, or promotes it directly into the
  formal Nonconformity lifecycle. Promotion does not terminate the source concern; the two records
  remain linked and independently open/closed according to their own lifecycle rules.

answered_questions:
  - id: PHASE14-Q1
    answer: Every employee may be a direct ManuFactor user where the workflow applies; LTV Form Management is explicit evidence of that scope.
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q2
    answer: Any employee may report a suspected lumber-quality concern, but a selected role starts the formal Quality Check.
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q3
    answer: Formal Quality Checks may be started by management or designated quality technicians; at the mill all salaried employees are considered management.
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q4
    answer: If a reported Quality Concern does not warrant formal escalation, it is closed/dispositioned with a retained reason.
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q5
    answer: Quality Concern should follow a CMMS work-request-like intake pattern; if it rises to the level of a formal quality problem, canonical terminology should promote it to the appropriate formal quality record rather than a generic "issue".
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q6
    answer: A Quality Concern may be promoted directly to a Nonconformity without first performing a Quality Check.
    evidence: domain-expert Mark, direct, 2026-08-22
  - id: PHASE14-Q7
    answer: When a Quality Concern is promoted to a Nonconformity, the Quality Concern remains open.
    evidence: domain-expert Mark, direct, 2026-08-22

material_question:
  id: PHASE14-Q8
  topic: Quality Concern closure after escalation
  question: >
    If a Quality Concern has been promoted to a Nonconformity and remains open, what business event should eventually allow the Quality Concern itself to close: closure of the linked Nonconformity, management/designated-quality review that the original concern is adequately addressed, or some other rule?
  why_it_matters: >
    Promotion no longer supplies the terminal disposition. The Quality Concern therefore needs an explicit closure condition independent from Nonconformity creation, and this rule determines whether closure is coupled to CAPA completion or remains a separate Quality Verification decision.
