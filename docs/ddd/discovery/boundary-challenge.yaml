boundary_challenges:
  - context: bc.operations-record
    merge_test: Do not merge with Kiln Operations, Project Tracking, or workforce-readiness contexts; historical operational facts have a distinct lifecycle.
    split_test: Retain intact for now; challenge overloaded Incident terminology during language stabilization.
    domain_not_software_test: Boundary follows operational-record semantics, not a report screen or module.
    ownership_test: ManuFactor owns operational records it creates while referenced subject matter remains owned elsewhere.
    language_change: Incident, change, event, and report may change meaning across adjacent contexts.
    result: retain-candidate

  - context: bc.kiln-operations
    merge_test: Do not merge with Operations Record or ProTrack moisture-source semantics.
    split_test: Do not split dashboards from the context; they are projections. Split future process-control concerns only when rules/lifecycle justify it.
    domain_not_software_test: Boundary follows the real gap of replacing Excel kiln scheduling/operations with a persistent model correlated to downstream moisture outcomes.
    ownership_test: Resolved. ManuFactor owns kiln scheduling/operations records and correlation semantics; ProTrack owns its planer moisture measurements.
    language_change: Schedule, run/charge, operating history, moisture result, and drying performance are local kiln-operational meanings.
    result: retain-strong-candidate

  - context: bc.project-tracking
    merge_test: Do not merge with Corrective Action; ordinary project work is not inherently Nonconformity-driven work.
    split_test: No supported split.
    domain_not_software_test: Boundary follows the project lifecycle, not a module name.
    ownership_test: ManuFactor owns project tracking where the operational gap exists.
    language_change: Project, action, task, milestone, and closure differ from CAPA semantics.
    result: retain-candidate

  - context: bc.quality-verification
    merge_test: Do not merge with Corrective Action; measurement/acceptance and remediation have distinct triggers, rules, language, and lifecycle.
    split_test: Do not split targets from checks yet; target selection is part of interpreting a check.
    domain_not_software_test: Boundary follows quality-acceptance meaning and mill/machine/process-specific rules.
    ownership_test: ManuFactor owns quality-check records and evaluation semantics where the current process has no system.
    language_change: Target, acceptable, measurement, failure, and Nonconformity change meaning at the Corrective Action boundary.
    result: retain-strong-candidate

  - context: bc.corrective-action
    merge_test: Do not merge with Quality Verification or Project Tracking.
    split_test: Do not split routing from CAPA lifecycle yet.
    domain_not_software_test: Boundary follows Nonconformity/remediation semantics, not ISO structure or a QMS module.
    ownership_test: Owns CAPA coordination and closure semantics but not routed work owned elsewhere.
    language_change: Nonconformity, Correction, Corrective Action, root cause, routing, and closure are local semantics.
    result: retain-strong-candidate

  - context: bc.asset-lifecycle
    merge_test: Keep separate from Reliability Verification; persistent asset identity/lifecycle and discrete verification evidence are distinct models.
    split_test: Vehicle versus equipment remains ISSUE-0003 and is nonblocking.
    domain_not_software_test: Boundary does not mirror MP2. MP2 posts WR/WO transactions to machine assets but does not provide meaningful asset-management semantics.
    ownership_test: Resolved. ManuFactor owns the missing meaningful asset identity, condition, lifecycle, and retained history; MP2 remains authoritative for its own WR/WO records.
    language_change: Asset condition/lifecycle has ManuFactor semantics distinct from MP2 maintenance transactions and Reliability Verification results.
    result: retain-strong-candidate

  - context: bc.reliability-verification
    merge_test: Keep separate from Asset Lifecycle because verification/checkpoints have their own evidence, rules, and lifecycle.
    split_test: No supported split.
    domain_not_software_test: AFAL/check concepts justify the boundary independent of application topology.
    ownership_test: ManuFactor owns verification records/results; effects on asset state cross explicitly into Asset Lifecycle.
    language_change: Verified, compliant, known-good, failed check, and asset condition are not synonymous.
    result: retain-strong-candidate

  - context: bc.safety-signoff
    merge_test: Keep separate from Corrective Action and Operations Record because the LTV form/template and printed-instance lifecycle is distinct from corrective remediation or operational reporting.
    split_test: Do not split printing from form management; producing printable instances, tracking them, and retaining their relationship to the managed form/template are one cohesive lifecycle. Approval/sign-off should split only if later evidence shows an independent model.
    domain_not_software_test: Boundary follows the real Safety gap of LTV form management and printing, not the Safety department or an approval screen.
    ownership_test: ManuFactor owns the managed LTV form/template and printed/issued-instance lifecycle. Approval/sign-off is a subordinate state where required, not the context-defining responsibility.
    language_change: LTV Form, template, printed instance, print, issue, form status, approval, and sign-off are local lifecycle terms.
    result: retain-strong-candidate-renamed-ltv-form-management

  - context: bc.environmental-compliance
    merge_test: No merge decision is warranted because no current ManuFactor Environmental model is established.
    split_test: No split decision is warranted.
    domain_not_software_test: Environmental is a business area, but business-area existence alone does not justify a Bounded Context.
    ownership_test: No current ManuFactor lifecycle or authoritative environmental record is established.
    language_change: Not established.
    result: defer-until-concrete-gap

  - context: bc.training-competency
    merge_test: Keep separate from Operational Workforce Availability. Qualification answers who can perform a job; availability answers who can cover it at a particular time.
    split_test: Keep onboarding and cross-operator training together for now because both contribute to operational qualification coverage.
    domain_not_software_test: Moodle/HR are sources/categories, not the semantic boundary.
    ownership_test: Resolved. ManuFactor owns operational training/qualification coverage; source learning systems own their completion records.
    language_change: Training completion, qualification, cross-training, crew depth, and trained-for require operational meanings.
    result: retain-strong-candidate-under-operations

  - context: bc.workforce-availability
    merge_test: Keep separate from Operational Training and Qualification; availability consumes qualification information rather than defining it.
    split_test: Keep vacation planning and sick-call replacement together for now because both answer operational staffing coverage across time.
    domain_not_software_test: HR/timekeeping sources provide personnel facts; the boundary is operational coverage planning.
    ownership_test: Resolved. ManuFactor owns operational vacation/coverage and replacement-readiness semantics.
    language_change: Vacation, absence, available, coverage, replacement operator, and staffing gap have operational meanings distinct from HR administration.
    result: retain-strong-candidate-under-operations

whole_map_result:
  active_candidate_context_count: 10
  deferred_context_count: 1
  strong_candidates:
    - bc.operations-record
    - bc.kiln-operations
    - bc.project-tracking
    - bc.quality-verification
    - bc.corrective-action
    - bc.asset-lifecycle
    - bc.reliability-verification
    - bc.safety-signoff
    - bc.training-competency
    - bc.workforce-availability
  deferred_contexts: [bc.environmental-compliance]
  material_domain_questions: []
  deferred_nonblocking_questions:
    - Environmental Compliance remains deferred until a concrete ManuFactor Environmental gap is identified.
    - ISSUE-0003 Vehicle Management versus Physical Asset Management remains nonblocking.
    - Exact cross-context rules such as failed-verification asset-state changes and failed-quality-check Nonconformity creation belong to later rule/context-map discovery.
