context_candidates:

  - id: bc.operations-record
    name: Operations Record
    subdomain: subdomain.production-operations
    responsibilities:
      - Capture operational facts such as shift reports, downtime or incident reports, and process/parameter changes.
      - Preserve an operational record of what happened without becoming the authoritative model for every subject mentioned in a report.
    language_cohesion: Shift Report, Downtime/Incident Report, Process/Parameter Change, operational occurrence, shift.
    model_cohesion: Historical operational facts and reporting have a record-oriented lifecycle distinct from kiln control, project lifecycle, or workforce-readiness planning.
    lifecycle_ownership: Owns creation, correction, and retention semantics for ManuFactor operational records; does not own the underlying equipment, people, quality, safety, or environmental lifecycle merely because they are referenced.
    boundary_indicators:
      - Reports can reference concepts owned elsewhere without taking over those models.
      - An operational incident record may describe the same occurrence that another context treats as a Safety, Quality, or Maintenance concern.
    adjacent_contexts: [bc.kiln-operations, bc.project-tracking, bc.corrective-action, bc.asset-lifecycle, bc.safety-signoff, bc.workforce-availability]
    ambiguities:
      - The term Incident may have materially different meanings in Operations, Safety, Maintenance, and Quality and must be challenged in Phase 6/8.
    confidence: medium
    status: candidate

  - id: bc.kiln-operations
    name: Kiln Operations
    subdomain: subdomain.production-operations
    responsibilities:
      - Replace spreadsheet-based kiln scheduling/operations with a persistent operational schedule and history.
      - Represent kiln runs/charges, scheduling decisions, operating records, and evolving kiln process-control/data-collection gaps.
      - Correlate downstream planer moisture measurements from ProTrack with the kiln schedule/run history that produced the lumber.
      - Support operational understanding of drying performance and actual board moisture through dashboards/projections derived from the model.
    language_cohesion: Kiln, drying schedule, charge/run, operating parameters, drying process, moisture result, drying performance.
    model_cohesion: Kiln scheduling, retained operating history, and correlation to downstream moisture outcomes form a process model distinct from general operational reporting and from the ProTrack moisture-measurement source model.
    lifecycle_ownership: Owns ManuFactor's kiln scheduling/operations record and correlation semantics. ProTrack remains authoritative for the moisture measurements it records in the planer database.
    boundary_indicators:
      - ProTrack moisture measurements are consumed as downstream facts and correlated to kiln runs without importing ProTrack's source model as the Kiln Operations model.
      - Operations Record may record kiln events without owning kiln scheduling or drying-performance semantics.
      - Dashboards are projections of Kiln Operations and correlated source facts, not a separate Bounded Context.
    adjacent_contexts: [bc.operations-record, bc.asset-lifecycle, bc.reliability-verification]
    ambiguities:
      - Exact identifiers/rules used to correlate kiln runs to downstream ProTrack moisture records remain to be discovered during later language/rule modeling.
      - Additional process-control responsibilities will be modeled as concrete gaps are discovered rather than inferred in advance.
    confidence: high
    status: candidate

  - id: bc.project-tracking
    name: Project Tracking
    subdomain: subdomain.production-operations
    responsibilities:
      - Track discrete improvement or capital projects that are not triggered by a Nonconformity.
    language_cohesion: Project, milestone, task/action, planned work, capital/improvement work.
    model_cohesion: Projects have a planned-work lifecycle distinct from incident/report records and from CAPA's nonconformity-driven lifecycle.
    lifecycle_ownership: Owns the ManuFactor project lifecycle and project-specific status where ManuFactor fills the gap.
    boundary_indicators:
      - The same work may be referenced by CAPA or Maintenance, but a Project is not a CAPA item merely because corrective work later becomes a project.
    adjacent_contexts: [bc.corrective-action, bc.operations-record, bc.asset-lifecycle]
    ambiguities: []
    confidence: medium
    status: candidate

  - id: bc.quality-verification
    name: Quality Verification
    subdomain: subdomain.quality
    responsibilities:
      - Determine the applicable product-quality target for mill/machine/process context.
      - Capture and interpret product measurements/checks against those targets.
      - Retain quality verification results where the current process leaves a gap.
    language_cohesion: Quality target, quality check, measurement, mill context, machine context, process context, finished size.
    model_cohesion: Target selection and verification results form a measurement/acceptance model distinct from CAPA's corrective-action lifecycle.
    lifecycle_ownership: Owns the meaning and lifecycle of ManuFactor quality checks and their contextual evaluation; does not own machine setup or external market standards themselves.
    boundary_indicators:
      - Machine/process identity is referenced from Operations or Maintenance but quality acceptance semantics are local to Quality Verification.
      - A failed check may create a Nonconformity that enters Corrective Action, but the measurement remains a Quality Verification fact.
    adjacent_contexts: [bc.corrective-action, bc.operations-record, bc.asset-lifecycle]
    ambiguities:
      - The exact semantic transition from a failed quality check to a Nonconformity requires later rule discovery but does not prevent the candidate split.
    confidence: high
    status: candidate

  - id: bc.corrective-action
    name: Corrective Action
    subdomain: subdomain.quality
    responsibilities:
      - Represent Nonconformities, Corrections, Corrective Actions, root-cause work, routing, and closure.
      - Route resulting work to the business/system context that already owns that class of work rather than becoming a duplicate owner.
    language_cohesion: Nonconformity, Correction, Corrective Action, CAPA item, root cause, routing rule, closure.
    model_cohesion: A nonconformity-driven remediation lifecycle has different triggers, states, and authority from product measurement or ordinary project tracking.
    lifecycle_ownership: Owns CAPA/nonconformity coordination and closure semantics while referenced corrective work may be owned by another context/system.
    boundary_indicators:
      - CAPA can originate from Quality, Safety, Environmental, Maintenance, or Operations findings without those domains becoming part of the CAPA model.
      - Project Tracking is distinguished by trigger: planned/improvement work is not inherently a Nonconformity response.
    adjacent_contexts: [bc.quality-verification, bc.project-tracking, bc.asset-lifecycle, bc.reliability-verification, bc.safety-signoff]
    ambiguities:
      - Whether every Safety/Environmental/Maintenance finding can become a CAPA item is not yet established; cross-context relationship remains candidate.
    confidence: high
    status: candidate

  - id: bc.asset-lifecycle
    name: Asset Lifecycle
    subdomain: subdomain.asset-reliability
    responsibilities:
      - Represent physical asset identity, meaningful lifecycle/condition state, and retained asset history that MP2 does not provide.
      - Correlate maintenance work-request/work-order activity from MP2 to the richer ManuFactor asset model without treating MP2 as authoritative for asset-management semantics it does not contain.
    language_cohesion: Asset, equipment, vehicle, condition, lifecycle state, operational setting/history, work request, work order.
    model_cohesion: Persistent asset identity, condition, lifecycle, and history form a model distinct from MP2 maintenance transactions and from individual Reliability Verification records.
    lifecycle_ownership: ManuFactor can own meaningful asset-management state and history because MP2's practical role is limited to posting work requests and work orders against machine assets; MP2 remains authoritative for its own WR/WO records.
    boundary_indicators:
      - MP2 asset references identify where maintenance work is posted but do not supply a meaningful asset lifecycle model.
      - Reliability Verification evaluates an asset at a checkpoint but does not define the full asset lifecycle.
      - Operations and Quality reference machines/equipment with context-specific meanings without owning asset lifecycle.
    adjacent_contexts: [bc.reliability-verification, bc.kiln-operations, bc.operations-record, bc.quality-verification, bc.project-tracking]
    ambiguities:
      - ISSUE-0003 remains open for Vehicle Management versus Physical Asset Management but does not invalidate this broader candidate context.
      - Later modeling must establish which specific asset states/history are ManuFactor-owned versus merely correlated from MP2 or other sources.
    confidence: high
    status: candidate

  - id: bc.reliability-verification
    name: Reliability Verification
    subdomain: subdomain.asset-reliability
    responsibilities:
      - Verify equipment is in a known-good/compliant state at post-maintenance, scheduled, or condition-triggered checkpoints.
      - Retain AFAL/check verification evidence where ManuFactor owns the gap.
    language_cohesion: AFAL, verification, checkpoint, category-check, known-good state, post-maintenance verification.
    model_cohesion: Verification has a discrete assessment lifecycle and rules distinct from the asset's persistent lifecycle.
    lifecycle_ownership: Owns verification record lifecycle and verification result semantics; references assets owned by Asset Lifecycle and may correlate to MP2 maintenance work.
    boundary_indicators:
      - A failed verification can affect ManuFactor asset state or trigger corrective/maintenance work, but the verification record remains its own fact.
    adjacent_contexts: [bc.asset-lifecycle, bc.corrective-action, bc.operations-record]
    ambiguities:
      - The exact rule by which a failed verification changes Asset Lifecycle state or generates MP2 work remains to be modeled later.
    confidence: high
    status: candidate

  - id: bc.safety-signoff
    name: Safety Sign-Off
    subdomain: subdomain.safety-compliance-signoff
    responsibilities:
      - Manage safety-related template/instance sign-off and approval semantics where ManuFactor fills the gap.
      - Establish when a safety sign-off record becomes authoritative.
    language_cohesion: LTV Template, LTV Printed Instance, Site Safety Manager approval, sign-off, authoritative record.
    model_cohesion: Template-instance-approval rules form a cohesive safety record model with a distinct authorization lifecycle.
    lifecycle_ownership: Owns ManuFactor safety sign-off record lifecycle; does not own the entire Safety business area.
    boundary_indicators:
      - A safety finding may be referenced by Corrective Action or Operations Record without merging the models.
    adjacent_contexts: [bc.corrective-action, bc.operations-record]
    ambiguities: []
    confidence: high
    status: candidate

  - id: bc.environmental-compliance
    name: Environmental Compliance
    subdomain: subdomain.environmental-compliance
    responsibilities: []
    language_cohesion: Not yet established from an actual ManuFactor gap.
    model_cohesion: Not yet established.
    lifecycle_ownership: Not established; Mark cannot currently identify a concrete Environmental gap that ManuFactor needs to own.
    boundary_indicators:
      - Environmental remains a valid broader business area, but business-area existence alone does not justify a Bounded Context.
      - A future Environmental gap may justify this or a differently named context once real language, rules, lifecycle, and authority are known.
    adjacent_contexts: []
    ambiguities:
      - No current concrete ManuFactor Environmental responsibility is known from the domain expert.
    confidence: low
    status: unresolved

  - id: bc.training-competency
    name: Operational Training and Qualification
    subdomain: subdomain.production-operations
    responsibilities:
      - Represent operational training coverage across mill activities, with particular importance during onboarding.
      - Maintain the cross-operator training/qualification matrix needed to understand depth of coverage across crews and jobs.
      - Use authoritative learning records from Moodle or other sources as evidence without treating source-system completion as automatically identical to operational qualification.
    language_cohesion: Onboarding, operator training, qualification, cross-training, training matrix, crew depth, trained-for.
    model_cohesion: Operational qualification/coverage answers which people can perform which mill jobs; this differs from personnel administration and from whether a person is available on a particular date/shift.
    lifecycle_ownership: Owns the operational interpretation of training coverage and cross-operator depth where ManuFactor fills the gap; external learning systems remain authoritative for their source completion records.
    boundary_indicators:
      - Moodle provides learning facts but does not define the entire operational readiness model.
      - Workforce Availability consumes qualification/coverage when deciding who can step into a job after vacation or a sick call.
    adjacent_contexts: [bc.workforce-availability, bc.operations-record, bc.safety-signoff]
    ambiguities:
      - Later rule discovery must distinguish training completion, demonstrated qualification, and operational authorization where those differ.
    confidence: high
    status: candidate

  - id: bc.workforce-availability
    name: Operational Workforce Availability
    subdomain: subdomain.production-operations
    responsibilities:
      - Represent vacation scheduling where no adequate software process currently exists.
      - Represent crew/shift availability needed for mill operations.
      - Determine replacement options when an operator is absent by combining availability with cross-operator qualification/coverage.
    language_cohesion: Crew, Shift, vacation, absence, available, replacement operator, coverage, staffing gap.
    model_cohesion: The context answers the operational question of who can actually cover work at a given time, rather than administering HR absence/payroll semantics.
    lifecycle_ownership: Owns ManuFactor's operational vacation/coverage planning and replacement-readiness semantics. HR/timekeeping systems remain authoritative for personnel facts they own.
    boundary_indicators:
      - An HR absence record is an input fact; operational coverage is a separate derived/business decision.
      - Qualification comes from Operational Training and Qualification, while this context applies it to a time/crew staffing need.
    adjacent_contexts: [bc.training-competency, bc.operations-record]
    ambiguities:
      - Exact interfaces to timekeeping/HR absence data remain to be mapped, but the operational coverage lifecycle is now established.
    confidence: high
    status: candidate
