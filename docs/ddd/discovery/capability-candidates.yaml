capabilities:

  - id: cap.safety-compliance-signoff
    name: LTV Form Management & Printing
    purpose: Manage LTV forms/templates, produce printable form instances, retain and track those instances, and support approval/sign-off where the applicable LTV process requires it.
    business_outcome: Current LTV forms can be reliably produced, printed, tracked, and retained through their actual lifecycle instead of relying on an unmanaged form-printing process.
    important_terms: [LTV Form, LTV Template, LTV Printed Instance, print, issue, approval, sign-off]
    evidence: [ev.arch.addendum rev 1/4/40, ev.arch.workbook "Catalog Entities", ev.arch.workbook "Rules", "domain-expert: Mark, direct, ISSUE-0002", "domain-expert: Mark, direct, 2026-08-10 LTV gap clarification"]
    confidence: high
    status: confirmed

  - id: cap.physical-asset-management
    name: Physical Asset Management
    purpose: Track physical asset condition and lifecycle across mill equipment and vehicles.
    business_outcome: Knowing an asset's current condition and history, for maintenance and replacement decisions.
    important_terms: [Operational Setting Logbook]
    evidence: [ev.arch.workbook "Status Catalog Mappings", ev.arch.workbook "Data Gathering" items 13/14/17]
    confidence: medium
    status: candidate
    issue_refs: [ISSUE-0003]

  - id: cap.equipment-reliability-verification
    name: Equipment Reliability & Compliance Verification
    purpose: Verify equipment is working correctly and compliant, post-maintenance or on a calendar/condition trigger.
    business_outcome: Confidence that equipment is in a known-good, verified state at defined checkpoints.
    important_terms: [AFAL, AFAL record, AFAL category-check]
    evidence: [ev.arch.addendum rev 1/13, ev.arch.workbook "Rules", ev.arch.workbook "Status Catalog Mappings", ev.arch.workbook "Notifications"]
    confidence: medium
    status: candidate

  - id: cap.corrective-preventive-action
    name: Corrective & Preventive Action (CAPA)
    purpose: Resolve a Nonconformity (ISO 9001:2015 clause 10.2) by root-cause corrective action, routing the work to whichever system already owns that class of work.
    business_outcome: Findings tracked to closure without CAPA becoming a second owner of work another system already owns.
    important_terms: [CAPA item, CAPA routing rule, Nonconformity, Correction, Corrective Action]
    evidence: [ev.arch.addendum "CAPA reframed" session 020, ev.arch.workbook "Catalog Entities", ev.arch.workbook "Rules", "domain-expert: Mark, direct, ISSUE-0002", "external-standard: ISO 9001:2015 clause 10.2"]
    confidence: high
    status: confirmed
    decision_refs: [DDD-0005]

  - id: cap.product-quality-verification
    name: Product Quality Verification
    purpose: Verify lumber against applicable quality targets that are specific to the mill and relevant machine/process context when a possible quality problem is suspected.
    business_outcome: A repeatable quality check with the correct contextual targets and retained results instead of an ad hoc unrecorded measurement.
    important_terms: [quality target, mill context, machine context, process context, caliper measurement, quality check]
    evidence: ["domain-expert: Mark, direct, 2026-08-09"]
    confidence: high
    status: candidate

  - id: cap.project-tracking
    name: Project Tracking
    purpose: Track discrete improvement/capital projects not triggered by a Nonconformity.
    business_outcome: Visibility into planned/capital work, distinct from CAPA by trigger — CAPA responds to a failure against a requirement, Project Tracking does not.
    important_terms: [Nonconformity]
    evidence: [ev.arch.workbook "Components" (ProjectTracking row), ev.arch.workbook "Data Gathering" item 22, "domain-expert: Mark, direct, ISSUE-0002", "external-standard: ISO 9001:2015 clause 10.2"]
    confidence: medium
    status: candidate
    decision_refs: [DDD-0005]

  - id: cap.operational-reporting
    name: Operational Reporting
    purpose: Capture what happened operationally — a shift, a downtime/incident event, or a process/parameter change.
    business_outcome: Operational visibility across the mill.
    important_terms: [Shift Report, Downtime/Incident Report]
    evidence: [ev.arch.workbook "Build Order" Phase_B/B1, ev.arch.workbook "Decisions (ADRs)", ev.arch.workbook "Components" (ParameterProcessChange row)]
    confidence: medium overall, low for the Process/Parameter Change portion
    status: candidate

  - id: cap.training-competency
    name: Training / Competency Records
    purpose: Track training completion and competency, sourced from Moodle.
    business_outcome: A record of who is trained/qualified for what.
    important_terms: []
    evidence: [ev.arch.workbook "Endpoints" (moodle-api/moodle-db), ev.arch.workbook "Constraints & Assumptions" A-05]
    confidence: medium
    status: candidate

  - id: cap.workforce-scheduling
    name: Workforce Scheduling & Absence
    purpose: Represent crew/shift/supervisor structure and track absence categories.
    business_outcome: An accurate picture of who is scheduled/available, and absence accounting.
    important_terms: [Department, Crew, Shift, Supervisor]
    evidence: [ev.arch.drawings.glossary, ev.arch.workbook "Constraints & Assumptions" A-06]
    confidence: medium
    status: candidate

  - id: cap.environmental-compliance
    name: Environmental Compliance Reporting
    purpose: Produce Boiler/Kiln environmental compliance forms.
    business_outcome: Documented compliance with environmental regulation.
    important_terms: []
    evidence: [ev.arch.workbook "Data Gathering" item 21, ev.arch.workbook "Components" (Environmental row), "domain-expert: Mark, direct, ISSUE-0002"]
    confidence: medium
    status: confirmed

  - id: cap.kiln-drying-operations
    name: Kiln Drying Operations
    purpose: Manage the kiln drying production process.
    business_outcome: Effective kiln scheduling and operation.
    important_terms: []
    evidence: [ev.arch.workbook "Data Gathering" item 23, ev.arch.workbook "Components" (KilnDrying row), ev.arch.drawings.mill_hierarchy]
    confidence: medium
    status: candidate

  - id: cap.identity-access
    name: Identity & Access
    purpose: Recognize who is using the system and govern what they can do.
    business_outcome: Not a peer business capability — enables every other capability rather than producing its own outcome.
    important_terms: [Guest, Profile, app-owned permissions, Identity/Profile trust lifecycle]
    evidence: [ev.arch.addendum rev 116/117/121/122, ev.code.dev_plan, ev.code.webapp_identity, ev.arch.workbook "Ports"]
    confidence: high
    status: rejected
    decision_refs: [DDD-0002]
