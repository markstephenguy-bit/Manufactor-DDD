registry_version: 2026-08-23-scenario-validated-batch2
status: canonical
purpose: >
  Define the complete canonical tactical registries after post-Phase-15 hardening and scenario-based validation. Where large historical index files remain intact, explicitly compose later sidecar additions and reconciliation overlays by stable ID so validators and future agents do not treat index.yaml alone as the complete registry.

rules:
  - Stable IDs are authoritative; duplicate IDs across files are one model object only when the content is a historical reconciliation copy, otherwise duplication is a validation error.
  - Files listed under additions extend the corresponding baseline index and are canonical until physically folded into that index.
  - Files listed under overlays modify only named fields of an existing stable-ID object; unspecified fields remain inherited from the baseline object.
  - Historical reconciliation sidecars are evidence/audit artifacts and do not add duplicate objects when their IDs already exist in the baseline index.
  - Scenario-validation additions are canonical when the scenario demonstrated a previously implicit but already-supported interaction or rule.
  - Open domain-rule issues are composed from docs/ddd/issues/unresolved.yaml plus any files listed under unresolved_issue_additions. An empty primary issues list does not mean zero open issues when canonical additions are present.

unresolved_issue_registry:
  baseline: docs/ddd/issues/unresolved.yaml
  unresolved_issue_additions:
    - docs/ddd/issues/scenario-validation-open.yaml
  current_open_issue_count: 2

