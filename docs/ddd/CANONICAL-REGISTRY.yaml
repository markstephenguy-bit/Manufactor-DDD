registry_version: 2026-08-23-consolidated
status: canonical
purpose: >
  Define the complete canonical tactical registries after post-Phase-15 hardening. Where large historical index files remain intact, explicitly compose later sidecar additions by stable ID so validators and future agents do not treat index.yaml alone as the complete registry.

rules:
  - Stable IDs are authoritative; duplicate IDs across files are one model object only when the content is a historical reconciliation copy, otherwise duplication is a validation error.
  - Files listed under additions extend the corresponding baseline index and are canonical until physically folded into that index.
  - Historical reconciliation sidecars are evidence/audit artifacts and do not add duplicate objects when their IDs already exist in the baseline index.
  - unresolved issue registry is docs/ddd/issues/unresolved.yaml; issues: [] means no currently known domain-rule issue remains open.

