domain_events:
  - id: event.operations-record.operational-record-recorded
    name: OperationalRecordRecorded
    bounded_context: bc.operations-record
    owning_aggregate: aggregate.operations-record.operational-record
    meaning: A new retained Operational Record was created for a specific operational fact or occurrence.
    trigger: Successful RecordOperationalFact command.
    payload_concepts: [Operational Record identity, record type, occurrence/report provenance]
    consumers: [Operations read models, authorized downstream references]
    business_significance: Establishes the authoritative ManuFactor operational record for what was reported.
    ordering_requirements: Must precede any OperationalRecordCorrected event for the same record.
    status: candidate
    provenance:
      sources:
        - type: aggregate-model
          reference: aggregate.operations-record.operational-record
          description: Operational Record creation is domain-significant retained history.
      confidence: high
      status: candidate

  - id: event.operations-record.operational-record-corrected
    name: OperationalRecordCorrected
    bounded_context: bc.operations-record
    owning_aggregate: aggregate.operations-record.operational-record
    meaning: A retained Operational Record was corrected while preserving its prior state/history.
    trigger: Successful CorrectOperationalRecord command.
    payload_concepts: [Operational Record identity, corrected fields/facts, correction provenance]
    consumers: [Operations read models, audit/history projections]
    business_significance: Makes later consumers aware that the current interpreted record changed without erasing prior evidence.
    ordering_requirements: Ordered after OperationalRecordRecorded and after prior corrections for the same record.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.operations-record.preserve-history
          description: Correction history is part of the domain meaning.
      confidence: high
      status: candidate

  - id: event.kiln-operations.kiln-schedule-created
    name: KilnScheduleCreated
    bounded_context: bc.kiln-operations
    owning_aggregate: aggregate.kiln-operations.kiln-schedule
    meaning: A retained kiln planning object was established for a defined planning scope/period.
    trigger: Successful CreateKilnSchedule command.
    payload_concepts: [Kiln Schedule identity, planning scope, planning period]
    consumers: [Kiln Operations planning views, Kiln Run creation/orchestration]
    business_significance: Establishes the retained planning model replacing spreadsheet-only state.
    ordering_requirements: Precedes KilnScheduleRevised events for the same schedule.
    status: candidate
    provenance:
      sources:
        - type: aggregate-model
          reference: docs/ddd/aggregates/kiln-schedule.yaml
          description: Schedule lifecycle has retained identity and revision history.
      confidence: high
      status: candidate

  - id: event.kiln-operations.kiln-schedule-revised
    name: KilnScheduleRevised
    bounded_context: bc.kiln-operations
    owning_aggregate: aggregate.kiln-operations.kiln-schedule
    meaning: The current planning state of a Kiln Schedule changed while prior revision history remained traceable.
    trigger: Successful ReviseKilnSchedule command.
    payload_concepts: [Kiln Schedule identity, revision information, revised planning state]
    consumers: [Kiln Operations planning views]
    business_significance: Preserves how kiln planning changed over time instead of overwriting spreadsheet state.
    ordering_requirements: Ordered by revision for the same Kiln Schedule.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.kiln-schedule.preserve-revisions
          description: Revision history is a first-class business invariant.
      confidence: high
      status: candidate

  - id: event.kiln-operations.kiln-run-started
    name: KilnRunStarted
    bounded_context: bc.kiln-operations
    owning_aggregate: aggregate.kiln-operations.kiln-run
    meaning: A specific Kiln Run/Charge began execution.
    trigger: Successful StartKilnRun command.
    payload_concepts: [Kiln Run identity, Kiln asset reference, schedule reference, start context]
    consumers: [Kiln Operations history/read models]
    business_significance: Marks the transition from planned work to retained execution history for one distinguishable run.
    ordering_requirements: Must precede KilnRunCompleted for the same run.
    status: candidate
    provenance:
      sources:
        - type: aggregate-model
          reference: aggregate.kiln-operations.kiln-run
          description: Run execution lifecycle is distinct from schedule planning.
      confidence: high
      status: candidate

  - id: event.kiln-operations.kiln-operation-recorded
    name: KilnOperationRecorded
    bounded_context: bc.kiln-operations
    owning_aggregate: aggregate.kiln-operations.kiln-run
    meaning: A retained operating fact or parameter was associated with a specific Kiln Run/Charge.
    trigger: Successful RecordKilnOperation command.
    payload_concepts: [Kiln Run identity, operating fact/parameter, timestamp/context, provenance]
    consumers: [Kiln Operations history, drying-performance projections]
    business_significance: Builds the retained operational history needed to understand drying performance later.
    ordering_requirements: Ordered within the run by business time/source ordering where known.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Kiln operating records must be retained instead of spreadsheet-only state.
      confidence: high
      status: candidate

  - id: event.kiln-operations.kiln-run-completed
    name: KilnRunCompleted
    bounded_context: bc.kiln-operations
    owning_aggregate: aggregate.kiln-operations.kiln-run
    meaning: A specific Kiln Run/Charge completed and became a historical correlation anchor for downstream moisture outcomes.
    trigger: Successful CompleteKilnRun command.
    payload_concepts: [Kiln Run identity, completion information]
    consumers: [Kiln Operations history, moisture-correlation processes/read models]
    business_significance: Establishes the completed run whose drying history can be compared to ProTrack moisture outcomes.
    ordering_requirements: Occurs after KilnRunStarted for the same run.
    status: candidate
    provenance:
      sources:
        - type: aggregate-model
          reference: aggregate.kiln-operations.kiln-run
          description: Completed runs remain retained for downstream correlation.
      confidence: high
      status: candidate

  - id: event.project-tracking.project-created
    name: ProjectCreated
    bounded_context: bc.project-tracking
    owning_aggregate: aggregate.project-tracking.project
    meaning: A discrete planned improvement/capital Project was established.
    trigger: Successful CreateProject command.
    payload_concepts: [Project identity, project purpose, initial lifecycle state]
    consumers: [Project Tracking views]
    business_significance: Establishes a planned-work lifecycle independent of CAPA.
    ordering_requirements: Precedes later Project lifecycle events for the same Project.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.project-tracking/context.yaml
          description: Project is its own planned-work lifecycle.
      confidence: medium
      status: candidate

  - id: event.project-tracking.project-completed
    name: ProjectCompleted
    bounded_context: bc.project-tracking
    owning_aggregate: aggregate.project-tracking.project
    meaning: A Project reached completion according to its own lifecycle rules.
    trigger: Successful CompleteProject command.
    payload_concepts: [Project identity, completion evidence/status]
    consumers: [Project Tracking views, external references where explicitly contracted]
    business_significance: Records project completion without equating it to CAPA closure or another context state.
    ordering_requirements: Occurs after ProjectCreated and applicable project lifecycle changes.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.project.status-owned-by-project
          description: Project status/completion belongs to the Project lifecycle.
      confidence: medium
      status: candidate

  - id: event.quality-verification.quality-check-initiated
    name: QualityCheckInitiated
    bounded_context: bc.quality-verification
    owning_aggregate: aggregate.quality-verification.quality-check
    meaning: A specific Quality Check was opened with contextual information needed to evaluate lumber against the applicable target.
    trigger: Successful InitiateQualityCheck command.
    payload_concepts: [Quality Check identity, mill/machine/process context, subject/product context]
    consumers: [Quality Verification workflow/read models]
    business_significance: Establishes a retained check occurrence rather than an ad hoc unrecorded measurement.
    ordering_requirements: Precedes measurement and evaluation events for the same check.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-09
          description: The current gap is an ad hoc quality check with no formal system or retained record.
      confidence: high
      status: candidate

  - id: event.quality-verification.quality-measurement-recorded
    name: QualityMeasurementRecorded
    bounded_context: bc.quality-verification
    owning_aggregate: aggregate.quality-verification.quality-check
    meaning: Measurement evidence was recorded for a specific Quality Check.
    trigger: Successful RecordQualityMeasurement command.
    payload_concepts: [Quality Check identity, Quality Measurement]
    consumers: [Quality Check evaluation behavior, Quality Verification views]
    business_significance: Creates retained evidence used to determine whether the applicable target is met.
    ordering_requirements: Occurs after QualityCheckInitiated and before or as part of evaluation.
    status: candidate
    provenance:
      sources:
        - type: value-object-model
          reference: value-object.quality-verification.quality-measurement
          description: Measurement is retained evidence inside the check.
      confidence: high
      status: candidate

  - id: event.quality-verification.quality-check-evaluated
    name: QualityCheckEvaluated
    bounded_context: bc.quality-verification
    owning_aggregate: aggregate.quality-verification.quality-check
    meaning: A Quality Check was evaluated against its applicable historical target/basis and produced a retained result.
    trigger: Successful EvaluateQualityCheck command.
    payload_concepts: [Quality Check identity, Quality Verification Result, applicable target/basis reference or snapshot]
    consumers: [Quality Verification views, potential cross-context finding transition process]
    business_significance: Records acceptable/failed verification meaning while remaining distinct from Nonconformity.
    ordering_requirements: Follows required measurement evidence for the same check.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.quality-check.failure-not-nonconformity
          description: Evaluation result remains a Quality Verification fact even when failed.
      confidence: high
      status: candidate

  - id: event.corrective-action.nonconformity-accepted
    name: NonconformityAccepted
    bounded_context: bc.corrective-action
    owning_aggregate: aggregate.corrective-action.nonconformity
    meaning: An eligible finding was explicitly accepted into the Corrective Action lifecycle as a Nonconformity.
    trigger: Successful AcceptNonconformity command.
    payload_concepts: [Nonconformity identity, source finding reference, unmet requirement/evidence, acceptance rationale]
    consumers: [Corrective Action workflow/read models]
    business_significance: Marks the semantic boundary crossing from a source finding into CAPA ownership.
    ordering_requirements: First lifecycle event for the Nonconformity aggregate.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.nonconformity.explicit-acceptance
          description: Findings require explicit admission into the Nonconformity lifecycle.
      confidence: high
      status: candidate

  - id: event.corrective-action.corrective-work-routed
    name: CorrectiveWorkRouted
    bounded_context: bc.corrective-action
    owning_aggregate: aggregate.corrective-action.nonconformity
    meaning: Corrective work was routed to the context/system that owns execution of that work class.
    trigger: Successful RouteCorrectiveWork command.
    payload_concepts: [Nonconformity identity, Corrective Action reference, destination context/system, routing information]
    consumers: [Corrective Action coordination views, destination integration when explicitly contracted]
    business_significance: Records CAPA coordination without transferring destination work ownership into Corrective Action.
    ordering_requirements: Occurs after NonconformityAccepted and after the relevant corrective action is defined.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, ISSUE-0002
          description: CAPA routes work to the system/context that already owns it.
      confidence: high
      status: candidate

  - id: event.corrective-action.nonconformity-closed
    name: NonconformityClosed
    bounded_context: bc.corrective-action
    owning_aggregate: aggregate.corrective-action.nonconformity
    meaning: A Nonconformity completed its CAPA lifecycle and was closed under the applicable closure rules.
    trigger: Successful CloseNonconformity command.
    payload_concepts: [Nonconformity identity, closure evidence]
    consumers: [Corrective Action views, explicitly contracted downstream references]
    business_significance: Establishes CAPA closure without asserting ownership of externally routed work lifecycle.
    ordering_requirements: Final lifecycle event after required remediation/closure evidence.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.corrective-action/context.yaml
          description: Corrective Action owns CAPA closure semantics.
      confidence: high
      status: candidate

  - id: event.asset-lifecycle.asset-registered
    name: AssetRegistered
    bounded_context: bc.asset-lifecycle
    owning_aggregate: aggregate.asset-lifecycle.asset
    meaning: ManuFactor identity was established for a physical Asset.
    trigger: Successful RegisterAsset command.
    payload_concepts: [Asset identity, physical/business identity, external reference mappings if present]
    consumers: [Asset Lifecycle views, Reliability Verification, Kiln Operations, Quality Verification where explicitly integrated]
    business_significance: Creates the stable asset identity MP2 does not meaningfully provide as an asset-management model.
    ordering_requirements: Precedes Asset condition/lifecycle state changes for the same Asset.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: ManuFactor fills meaningful asset-management gaps absent from MP2.
      confidence: high
      status: candidate

  - id: event.asset-lifecycle.asset-condition-changed
    name: AssetConditionChanged
    bounded_context: bc.asset-lifecycle
    owning_aggregate: aggregate.asset-lifecycle.asset
    meaning: The ManuFactor-owned condition of an Asset changed under an accepted asset-domain rule and the transition was retained in history.
    trigger: Successful ChangeAssetCondition command.
    payload_concepts: [Asset identity, prior condition, new condition, transition evidence/reason]
    consumers: [Asset Lifecycle history/views, Reliability Verification or other explicitly contracted consumers]
    business_significance: Records meaningful asset condition independently of MP2 WR/WO status and individual verification results.
    ordering_requirements: Ordered with other Asset state/history events for the same Asset.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.asset.state-change-records-history
          description: Asset state changes require retained history.
      confidence: high
      status: candidate

  - id: event.reliability-verification.verification-completed
    name: VerificationCompleted
    bounded_context: bc.reliability-verification
    owning_aggregate: aggregate.reliability-verification.verification
    meaning: A Reliability Verification completed with a result supported by its applicable checkpoint/category-check evidence.
    trigger: Successful CompleteVerification command.
    payload_concepts: [Verification identity, Asset reference, Verification Result, checkpoint/check evidence references]
    consumers: [Reliability Verification views, Asset Lifecycle integration/policy evaluation]
    business_significance: Establishes the authoritative verification fact while leaving any Asset-state effect to explicit Asset-domain policy.
    ordering_requirements: Final result follows the verification's applicable evidence/check recording.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.verification.result-supported-by-checks
          description: Verification result must derive from retained evidence.
      confidence: high
      status: candidate

  - id: event.ltv-form-management.template-version-published
    name: LTVFormTemplateVersionPublished
    bounded_context: bc.safety-signoff
    owning_aggregate: aggregate.ltv-form-management.form-template
    meaning: A distinguishable LTV Form Template version became available for generating printable/issued instances.
    trigger: Successful PublishLTVFormTemplate command.
    payload_concepts: [LTV Form Template identity, published version, applicability]
    consumers: [LTV Form generation behavior, LTV Form Management views]
    business_significance: Establishes the exact managed form definition from which later form instances may be generated.
    ordering_requirements: Ordered by version/revision for the same LTV Form Template.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.ltv-template.preserve-published-versions
          description: Published versions must remain distinguishable and historically available.
      confidence: high
      status: candidate

  - id: event.ltv-form-management.form-instance-generated
    name: LTVFormInstanceGenerated
    bounded_context: bc.safety-signoff
    owning_aggregate: aggregate.ltv-form-management.printed-instance
    meaning: A specific LTV form instance was generated from an exact managed template version.
    trigger: Successful GenerateLTVFormInstance command.
    payload_concepts: [LTV Printed Instance identity, source template identity/version, intended use/context]
    consumers: [LTV printing/issue workflow, LTV Form Management views]
    business_significance: Establishes the individual managed form instance and its immutable template provenance.
    ordering_requirements: Precedes issue/print and any later completion/approval/sign-off events for the same instance.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: LTV form printing and management are the actual Safety gap.
      confidence: high
      status: candidate

  - id: event.ltv-form-management.form-instance-issued
    name: LTVFormInstanceIssued
    bounded_context: bc.safety-signoff
    owning_aggregate: aggregate.ltv-form-management.printed-instance
    meaning: A specific LTV Form Instance was printed or issued while remaining distinct from approval/sign-off state.
    trigger: Successful MarkLTVFormIssued command.
    payload_concepts: [LTV Printed Instance identity, print/issue facts]
    consumers: [LTV Form Management views, later applicable completion/approval workflow]
    business_significance: Records the core printing/issue gap without collapsing it into sign-off semantics.
    ordering_requirements: Occurs after LTVFormInstanceGenerated for the same instance.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.ltv-instance.printing-not-signoff
          description: Printing/issuing does not imply sign-off.
      confidence: high
      status: candidate

  - id: event.training-qualification.operational-qualification-established
    name: OperationalQualificationEstablished
    bounded_context: bc.training-competency
    owning_aggregate: aggregate.training-qualification.qualification
    meaning: A person was established as operationally qualified for a specific job/role based on acceptable evidence.
    trigger: Successful EstablishOperationalQualification command.
    payload_concepts: [Operational Qualification identity, Person reference, Job/Position reference, supporting evidence references]
    consumers: [Operational Training/Qualification views, Operational Workforce Availability]
    business_significance: Makes the operationally usable person-job capability explicit for crew depth and replacement decisions.
    ordering_requirements: Ordered with later qualification review/withdrawal events for the same person-job qualification identity.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Cross-operator training depth must identify who can perform another operational job.
      confidence: high
      status: candidate

  - id: event.workforce-availability.staffing-gap-identified
    name: StaffingGapIdentified
    bounded_context: bc.workforce-availability
    owning_aggregate: aggregate.workforce-availability.coverage-plan
    meaning: A specific operational staffing need was identified for a job/time/crew context and requires coverage evaluation.
    trigger: Successful CreateOperationalCoveragePlan command.
    payload_concepts: [Operational Coverage Plan identity, Staffing Gap]
    consumers: [Operational Workforce Availability workflow/read models]
    business_significance: Establishes the real operational need that replacement options will be evaluated against.
    ordering_requirements: Precedes replacement selection for the same Coverage Plan.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Sick calls and vacation create operational staffing gaps that need explicit coverage planning.
      confidence: high
      status: candidate

  - id: event.workforce-availability.replacement-selected
    name: ReplacementSelected
    bounded_context: bc.workforce-availability
    owning_aggregate: aggregate.workforce-availability.coverage-plan
    meaning: A replacement was selected for a staffing gap after satisfying the applicable qualification and availability checks at decision time.
    trigger: Successful SelectReplacement command.
    payload_concepts: [Operational Coverage Plan identity, Staffing Gap, selected Person reference, qualification reference/evidence, availability reference/evidence]
    consumers: [Operational Workforce Availability views, mill operations users]
    business_significance: Records who can actually cover the operational need without re-owning HR absence or qualification source facts.
    ordering_requirements: Occurs after StaffingGapIdentified and after evaluation of replacement evidence for the same Coverage Plan.
    status: candidate
    provenance:
      sources:
        - type: invariant-model
          reference: invariant.coverage.replacement-must-be-qualified-and-available
          description: Selected replacement must satisfy both qualification and availability.
      confidence: high
      status: candidate
