commands:
  - id: command.training-qualification.withdraw-qualification
    name: WithdrawOperationalQualification
    bounded_context: bc.training-competency
    target_aggregate: aggregate.training-qualification.qualification
    intent: Explicitly end an established Operational Qualification while retaining the prior qualification and withdrawal history.
    initiators: [employee supervisor, designated trainer or subject-matter expert]
    input: [operational qualification identity, withdrawal reason, effective time]
    preconditions: [The Operational Qualification exists and is currently valid; the actor is within confirmed qualification authority.]
    invariants_checked: [invariant.qualification.persists-until-withdrawn, invariant.qualification.withdrawal-preserves-history]
    possible_events: [event.training-qualification.operational-qualification-withdrawn]
    failure_conditions: [Qualification does not exist; actor lacks authority; withdrawal would erase prior qualification/evidence history.]
    idempotency_expectation: Repeating the same withdrawal against an already-withdrawn qualification must not create a second contradictory withdrawal fact.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-23 qualification lifecycle clarification
          description: Operational Qualification remains valid until someone explicitly withdraws it.
      confidence: high
      status: candidate
