issues:
  - id: ISSUE-0006
    title: What evidence and rules establish, review, expire, or withdraw Operational Qualification?
    description: Grant authority is already confirmed as the employee's supervisor or a designated trainer/subject-matter expert. Learning completion is not automatically Operational Qualification. Exact rules for acceptable evidence, review, expiration, and withdrawal remain to be discovered.
    affected_objects: [bc.training-competency, aggregate.training-qualification.qualification]
    evidence: [language.training-qualification.operational-qualification, invariant.qualification.requires-evidence, bc.training-competency]
    blocking: false
    needed_input: domain-rule discovery
    status: open

  - id: ISSUE-0007
    title: Which LTV processes require completion, approval, or sign-off transitions and under what rules?
    description: LTV printing/issuance does not imply completion, approval, or sign-off. Process-specific workflow transition requirements remain unknown and must not be generalized.
    affected_objects: [bc.safety-signoff, aggregate.ltv-form-management.printed-instance]
    evidence: [invariant.ltv-instance.printing-not-signoff]
    blocking: false
    needed_input: domain-rule discovery
    status: open

  - id: ISSUE-0008
    title: What identifiers and rules correlate Kiln Runs to ProTrack moisture records?
    description: ProTrack remains source authority for planer moisture data while Kiln Operations owns correlation and Moisture Outcome semantics. Exact business correlation keys/rules remain unresolved.
    affected_objects: [bc.kiln-operations, rel.protrack-moisture-to-kiln-operations, aggregate.kiln-operations.kiln-run]
    evidence: [contract.protrack-moisture-to-kiln-operations, language.kiln-operations.moisture-outcome]
    blocking: false
    needed_input: domain-rule/integration discovery
    status: open

  - id: ISSUE-0009
    title: What is the controlled Asset condition and lifecycle-state vocabulary?
    description: Asset identity and state ownership are established, but the exact allowed condition/state vocabulary and transition policy remain tactical work. This is also the remaining unknown needed when a maintenance supervisor promotes a Reliability finding into an Asset-state change.
    affected_objects: [bc.asset-lifecycle, aggregate.asset-lifecycle.asset, value-object.asset-lifecycle.asset-condition, value-object.asset-lifecycle.lifecycle-state]
    evidence: [invariant.asset.stable-identity, invariant.asset.state-change-records-history, bc.reliability-verification]
    blocking: false
    needed_input: domain-rule discovery
    status: open

  - id: ISSUE-0010
    title: What are the exact child Corrective Action identity and CAPA closure rules?
    description: Nonconformity owns the CAPA lifecycle and routes external work correctly, but exact child Corrective Action identity and closure evidence requirements remain unresolved.
    affected_objects: [bc.corrective-action, aggregate.corrective-action.nonconformity]
    evidence: [invariant.nonconformity.explicit-acceptance, invariant.nonconformity.do-not-own-routed-work]
    blocking: false
    needed_input: domain-rule discovery
    status: open

  - id: ISSUE-0012
    title: What independent rule closes a Quality Concern after disposition or Nonconformity escalation?
    description: Quality Concern is a retained independent lifecycle. A concern may be closed/dispositioned with retained reason when authorized review determines no formal escalation is justified. Promotion/linkage to a Nonconformity explicitly does not close it automatically; the independent closure rule after escalation remains unknown.
    affected_objects: [bc.quality-verification, aggregate.quality-verification.quality-concern]
    evidence: [invariant.quality-concern.promotion-does-not-close, contract.corrective-action-to-quality-verification, Phase 14 Quality reconciliation]
    blocking: false
    needed_input: domain-rule discovery
    status: open

resolved_issues:
  - id: ISSUE-0003
    title: Should Vehicle Management merge into Physical Asset Management?
    answer: merge confirmed correct
    resolution: Vehicles are modeled within the existing Physical Asset Management / Asset Lifecycle model rather than as a separate capability or Bounded Context.
    affected_objects: [cap.physical-asset-management, bc.asset-lifecycle]
    evidence:
      - ev.arch.workbook "Status Catalog Mappings"
      - "domain-expert: Mark, direct, 2026-08-22 — merge confirmed correct"
    resolved_by: domain-expert
    resolved_at: 2026-08-22
    blocking: false
    status: resolved

  - id: ISSUE-0004
    title: What exact rule admits a failed Quality Check as a Nonconformity?
    answer: Explicit authorized determination that retained evidence establishes nonfulfillment of an identified applicable requirement.
    resolution: Corrective Action now uses policy.corrective-action.determine-nonconformity-admission. Management or a designated quality technician with formal promotion authority may admit a finding only when an applicable requirement is identifiable and retained evidence is sufficient to determine that the requirement was not fulfilled. A Quality Concern or failed Quality Check alone does not automatically create a Nonconformity, and a Quality Check is not a mandatory gate.
    affected_objects: [bc.quality-verification, bc.corrective-action, aggregate.quality-verification.quality-check, aggregate.quality-verification.quality-concern, aggregate.corrective-action.nonconformity, policy.corrective-action.determine-nonconformity-admission]
    evidence: [invariant.quality-check.failure-not-nonconformity, invariant.nonconformity.explicit-acceptance, policy.corrective-action.determine-nonconformity-admission, Phase 14 Quality reconciliation]
    resolved_by: confirmed-domain-evidence-and-ISO-vocabulary-baseline
    resolved_at: 2026-08-22
    blocking: false
    status: resolved

  - id: ISSUE-0005
    title: What exact rule maps Reliability Verification results to Asset state?
    answer: There is no deterministic result-to-state mapping; maintenance-supervisor promotion is the decision gate, and Asset Lifecycle owns any resulting state transition.
    resolution: A millwright-recorded finding or failed Reliability Verification remains a verification fact. The maintenance supervisor decides whether the finding is promoted into formal action or an Asset-state change; the Reliability Manager remains accountable for the reliability process. The actual allowed Asset condition/lifecycle state and transition selected after promotion remain governed by ISSUE-0009 rather than by Reliability Verification.
    affected_objects: [bc.reliability-verification, bc.asset-lifecycle, aggregate.reliability-verification.verification, aggregate.asset-lifecycle.asset]
    evidence: [bc.reliability-verification, invariant.verification.result-not-asset-condition, invariant.asset.state-change-records-history, contract.reliability-verification-to-asset-lifecycle]
    resolved_by: confirmed-domain-evidence-audit
    resolved_at: 2026-08-22
    blocking: false
    status: resolved

  - id: ISSUE-0011
    title: Does vacation planning require a distinct aggregate?
    answer: no separate aggregate is justified at current evidence level
    resolution: Vacation coverage is modeled as a staffing need within the Operational Coverage Plan consistency boundary. No independent vacation-specific lifecycle or schedule-wide invariant currently requires a second aggregate. Reopen only if future evidence establishes such an invariant.
    affected_objects: [bc.workforce-availability, aggregate.workforce-availability.coverage-plan]
    evidence: [bc.workforce-availability, invariant.coverage.need-is-explicit, invariant.coverage.requires-qualified-and-available]
    resolved_by: model-evidence audit
    resolved_at: 2026-08-22
    blocking: false
    status: resolved
