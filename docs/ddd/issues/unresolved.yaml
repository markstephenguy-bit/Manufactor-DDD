  - id: ISSUE-0004
    title: What exact rule admits a failed Quality Check as a Nonconformity?
    answer: Explicit authorized determination that retained evidence establishes nonfulfillment of an identified applicable requirement.
    resolution: Corrective Action now uses policy.corrective-action.determine-nonconformity-admission. Management or a designated quality technician with formal promotion authority may admit a finding only when an applicable requirement is identifiable and retained evidence is sufficient to determine that the requirement was not fulfilled. A Quality Concern or failed Quality Check alone does not automatically create a Nonconformity, and a Quality Check is not a mandatory gate.
    affected_objects: [bc.quality-verification, bc.corrective-action, aggregate.quality-verification.quality-check, aggregate.quality-verification.quality-concern, aggregate.corrective-action.nonconformity, policy.corrective-action.determine-nonconformity-admission]
    evidence: [invariant.quality-check.failure-not-nonconformity, invariant.nonconformity.explicit-acceptance, policy.corrective-action.determine-nonconformity-admission, Phase 14 Quality reconciliation]
    resolved_by: confirmed-domain-evidence-and-ISO-vocabulary-baseline
    resolved_at: 2026-08-22
    blocking: false
    status: resolved

  - id: ISSUE-0005
    title: What exact rule maps Reliability Verification results to Asset state?
    answer: There is no deterministic result-to-state mapping; maintenance-supervisor promotion is the decision gate, and Asset Lifecycle owns any resulting state transition.
    resolution: A millwright-recorded finding or failed Reliability Verification remains a verification fact. The maintenance supervisor decides whether the finding is promoted into formal action or an Asset-state change; the Reliability Manager remains accountable for the reliability process. The actual allowed Asset condition/lifecycle state and transition selected after promotion remain governed by Asset Lifecycle rather than by Reliability Verification.
    affected_objects: [bc.reliability-verification, bc.asset-lifecycle, aggregate.reliability-verification.verification, aggregate.asset-lifecycle.asset]
    evidence: [bc.reliability-verification, invariant.verification.result-not-asset-condition, invariant.asset.state-change-records-history, contract.reliability-verification-to-asset-lifecycle]
    resolved_by: confirmed-domain-evidence-audit
    resolved_at: 2026-08-22
    blocking: false
    status: resolved

  - id: ISSUE-0006
    title: What evidence and lifecycle rules establish or withdraw Operational Qualification?
    answer: Qualification is established from job shadowing and observed practical capability, granted by an authorized supervisor or designated trainer/SME, and remains valid until explicitly withdrawn or superseded.
    resolution: The trainee shadows the current competent worker and is observed sufficiently for the authorized reviewer to determine that the trainee is capable of doing the job. Course/LMS completion may support the decision but does not itself establish Operational Qualification. Qualification does not expire merely because time passes. Withdrawal or supersession is explicit and preserves prior qualification evidence/history.
    affected_objects: [bc.training-competency, aggregate.training-qualification.qualification, invariant.qualification.requires-evidence, invariant.qualification.shadowing-demonstrates-capability, invariant.qualification.persists-until-withdrawn, invariant.qualification.withdrawal-preserves-history]
    evidence: ["domain-expert: Mark, direct, 2026-08-23 — qualification persists until explicitly withdrawn", "domain-expert: Mark, direct, 2026-08-23 — person shadows current worker to see if capable of doing the job", bc.training-competency]
    resolved_by: domain-expert-and-model-reconciliation
    resolved_at: 2026-08-23
    blocking: false
    status: resolved

  - id: ISSUE-0007
    title: Which LTV processes require completion, approval, or sign-off transitions and under what rules?
    answer: A used paper LTV is picked up by the Safety Office, scanned into the system, matched to its originating electronic record, and that retained record transitions to Recorded; it never disappears and only changes status/history.
    resolution: Printing/issuance remains an early lifecycle state. The concrete completion/recording workflow is Safety Office receipt of the used paper form, scanning, reconciliation to the originating electronic LTV record, and a Recorded status transition backed by retained scan-and-match evidence. The same record identity remains permanently referenceable; later changes are status/history transitions rather than deletion. Generic approval/sign-off was removed as the defining completion mechanism where not supported by this workflow.
    affected_objects: [bc.safety-signoff, aggregate.ltv-form-management.printed-instance, invariant.ltv-instance.recorded-requires-scan-match, invariant.ltv-instance.retained-status-history, command.ltv-form-management.record-returned-form, event.ltv-form-management.form-recorded, use-case.ltv-form-management.record-returned-form]
    evidence: ["domain-expert: Mark, direct, 2026-08-23 — Safety Office picks up the used LTV, scans it, matches it to the electronic initial record, and changes the record status to Recorded; it never dies and only changes status"]
    resolved_by: domain-expert-and-model-reconciliation
    resolved_at: 2026-08-23
    blocking: false
    status: resolved

  - id: ISSUE-0008
    title: What identifiers and rules correlate Kiln Runs to ProTrack moisture records?
    answer: There is no run-level correlation identifier; ProTrack records moisture by lumber dimension, so only statistical analysis by thickness x width x length is supported.
    resolution: The prior model incorrectly implied that individual ProTrack moisture records could be correlated to a specific Kiln Run/Charge. Mark confirmed that ProTrack does not carry kiln-run identity and records moisture by lumber dimension. Kiln Operations now consumes ProTrack records/statistics at that supported grain and may compare dimension-level moisture behavior with retained kiln history statistically, but must not fabricate individual run-to-measurement lineage.
    affected_objects: [bc.kiln-operations, contract.protrack-moisture-to-kiln-operations, query.kiln-operations.dimension-moisture-statistics, use-case.kiln-operations.run-history]
    evidence: [bc.kiln-operations, contract.protrack-moisture-to-kiln-operations, "domain-expert: Mark, direct, 2026-08-23 — no kiln-run identifier; statistics on thickness x width x length"]
    resolved_by: domain-expert
    resolved_at: 2026-08-23
    blocking: false
    status: resolved

  - id: ISSUE-0009
    title: What is the controlled Asset condition and lifecycle-state vocabulary?
    answer: Asset Condition is Operating, Degraded, or Down; Asset Lifecycle State is In Service, Out of Service, or Retired.
    resolution: Mark accepted the proposed standard-informed terminology. The model now separates functional condition from lifecycle position so Down is not the same as Out of Service and Retired is not a condition. The previously missing ChangeAssetLifecycleState command/event/use case was added, and all state changes preserve retained history. In Service is modeled as the active lifecycle counterpart so Operating remains a functional condition term.
    affected_objects: [bc.asset-lifecycle, aggregate.asset-lifecycle.asset, value-object.asset-lifecycle.asset-condition, value-object.asset-lifecycle.lifecycle-state, command.asset-lifecycle.change-lifecycle-state, event.asset-lifecycle.lifecycle-state-changed, use-case.asset-lifecycle.change-lifecycle-state]
    evidence: [invariant.asset.stable-identity, invariant.asset.state-change-records-history, "domain-expert: Mark, direct, 2026-08-23 — proposed vocabulary is good and standard-informed terminology should be preferred"]
    resolved_by: domain-expert-and-model-reconciliation
    resolved_at: 2026-08-23
    blocking: false
    status: resolved

  - id: ISSUE-0010
    title: What are the child corrective-work and CAPA closure rules?
    answer: Corrective work is represented as tasks under the parent Nonconformity/CAPA, and closure requires both completion of required tasks and retained post-correction verification that the correction actually worked.
    resolution: Corrective tasks are owned by the parent Nonconformity/CAPA rather than modeled as independent child Corrective Action lifecycles. Task completion alone is insufficient for parent closure. After required tasks are completed, effectiveness must be verified and retained as closure evidence. The Nonconformity remains active if the correction has not been verified effective. Routed execution may remain externally owned while CAPA retains task/reference/effectiveness evidence.
    affected_objects: [bc.corrective-action, aggregate.corrective-action.nonconformity, invariant.nonconformity.corrective-work-is-tasked, invariant.nonconformity.requires-effectiveness-verification]
    evidence: ["domain-expert: Mark, direct, 2026-08-23 — corrective work is tasks to complete", "domain-expert: Mark, direct, 2026-08-23 — need to verify afterward that the correction actually worked", invariant.nonconformity.do-not-own-routed-work]
    resolved_by: domain-expert-and-model-reconciliation
    resolved_at: 2026-08-23
    blocking: false
    status: resolved

