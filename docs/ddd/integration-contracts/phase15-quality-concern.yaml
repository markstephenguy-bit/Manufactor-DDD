integration_contracts:
  - id: contract.quality-concern-to-corrective-action
    name: Quality Concern Evidence to Corrective Action
    provider_context: bc.quality-verification
    consumer_context: bc.corrective-action
    purpose: Provide retained Quality Concern evidence when authorized quality review determines that sufficient basis exists for explicit Nonconformity admission without requiring a prior Quality Check.
    interaction_style: request-response
    published_model: [Quality Concern identity, subject/product context, retained concern evidence, authorized triage rationale]
    operations: [Read concern evidence needed for explicit Nonconformity admission]
    events: []
    compatibility_policy: Corrective Action must apply its own explicit Nonconformity acceptance semantics; receiving a concern never creates a Nonconformity automatically.
    translation_required: true
    failure_semantics: If sufficient basis or an explicit acceptance decision is absent, the concern remains a Quality Verification record and no Nonconformity is created.
    ownership: Quality Verification owns Quality Concern lifecycle/evidence; Corrective Action owns Nonconformity/CAPA lifecycle.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Phase 14 reconciliation, 2026-08-22
          description: A Quality Check is optional; authorized quality review may promote directly to Nonconformity when sufficient basis exists.
      confidence: high
      status: candidate

  - id: contract.corrective-action-to-quality-verification
    name: Nonconformity Reference to Quality Concern Traceability
    provider_context: bc.corrective-action
    consumer_context: bc.quality-verification
    purpose: Provide the accepted Nonconformity identity and minimal lifecycle reference needed to retain Quality Concern-to-Nonconformity traceability without making Quality Verification authoritative for CAPA state.
    interaction_style: request-response
    published_model: [Nonconformity identity, source-finding reference, accepted status, optional closure status when specifically requested]
    operations: [Resolve an accepted Nonconformity reference for a linked Quality Concern]
    events: []
    compatibility_policy: Quality Verification may retain the reference but must not mutate, mirror, or independently infer Nonconformity/CAPA state.
    translation_required: true
    failure_semantics: If the referenced Nonconformity cannot be resolved, keep the concern link unresolved rather than fabricating CAPA state or closing the concern.
    ownership: Corrective Action owns Nonconformity/CAPA state; Quality Verification owns only the concern and its cross-context reference.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Phase 14 reconciliation, 2026-08-22
          description: Quality Concern and Nonconformity remain linked records with independent lifecycles; promotion does not close the concern.
      confidence: high
      status: candidate
