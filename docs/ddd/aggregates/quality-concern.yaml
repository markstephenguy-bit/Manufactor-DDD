id: aggregate.quality-verification.quality-concern
name: Quality Concern
bounded_context: bc.quality-verification
purpose: Preserve one suspected product-quality concern, its authorized triage history, disposition, and links to later formal quality records without equating intake with a Quality Check or Nonconformity.
aggregate_root: Quality Concern
members:
  - Quality Concern
  - retained triage/disposition history
  - references to linked Quality Check or Nonconformity where applicable
invariants:
  - Concern intake must not automatically create a Quality Check or Nonconformity.
  - Only management or a designated quality technician may perform formal concern triage/promotion.
  - Promotion to a Nonconformity must not silently close the source Quality Concern.
  - Links to Corrective Action records must remain cross-context references; Quality Verification does not own Nonconformity lifecycle state.
commands:
  - Record Quality Concern
  - Disposition Quality Concern
  - Link Quality Check to Concern
  - Link Nonconformity to Concern
  - Close Quality Concern

domain_events:
  - QualityConcernRecorded
  - QualityConcernDispositioned
  - QualityCheckLinkedToConcern
  - NonconformityLinkedToConcern
  - QualityConcernClosed
transaction_boundary: One concern's retained intake, authorized triage/disposition, and formal-record references must remain coherent through the Quality Concern root.
external_references:
  - Nonconformity
  - employee/person reference
repository: repository.quality-verification.quality-concern
creation_rules:
  - A concern represents a specific suspected quality issue that is sufficiently identified to retain and review.
  - Non-salaried employee concerns enter formal triage through the QC channel; the implementation form of that channel remains unspecified.
deleting_rules_note: null
deletion_rules:
  - Retained concerns and their disposition history are not destructively deleted under current evidence.
  - Exact closure behavior after escalation remains unresolved and is tracked explicitly.
status: candidate
provenance:
  sources:
    - type: domain-expert
      reference: Phase 14 domain-expert reconciliation, 2026-08-22
      description: Quality Concern was confirmed as a retained intake/triage record distinct from Quality Check and Nonconformity; management/designated quality technicians control formal triage and promotion.
    - type: inference
      reference: docs/ddd/discovery/phase14-use-case-query-candidates.yaml
      description: Independent identity, lifecycle, retained disposition history, and state-changing commands justify a candidate aggregate boundary.
  confidence: high
  status: candidate
