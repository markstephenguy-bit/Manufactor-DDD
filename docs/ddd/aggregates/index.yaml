aggregates:
  - id: aggregate.operations-record.operational-record
    name: Operational Record
    bounded_context: bc.operations-record
    purpose: Preserve one operational record and its correction/history semantics as a consistent unit.
    aggregate_root: Operational Record
    members: [Operational Record, Operational Incident or other recorded occurrence details]
    invariants:
      - Corrections must preserve the history of what was originally recorded rather than silently replacing it.
      - References to external subjects must not become locally authoritative lifecycle state.
    commands: [Record Operational Fact, Correct Operational Record]
    domain_events: [OperationalRecordRecorded, OperationalRecordCorrected]
    transaction_boundary: Creating or correcting a single operational record and its retained history must be consistent.
    external_references: [Asset, Person, Nonconformity, Safety finding]
    repository: unresolved
    creation_rules:
      - A record must represent a specific operational occurrence/report and preserve provenance.
    deletion_rules:
      - Destructive deletion is not supported by current domain evidence; retention/correction is preferred.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.operations-record/context.yaml
          description: Operations Record explicitly owns retained record and correction/history semantics.
      confidence: high
      status: candidate

  - id: aggregate.kiln-operations.kiln-run
    name: Kiln Run
    bounded_context: bc.kiln-operations
    purpose: Keep the operational identity and retained history of one kiln run/charge internally consistent.
    aggregate_root: Kiln Run/Charge
    members: [Kiln Run/Charge, Kiln Operating Record references]
    invariants:
      - A run must remain distinguishable from every other run so later outcomes can be correlated correctly.
      - Operating history associated with a run must not be silently rewritten as ephemeral spreadsheet state.
      - Source ProTrack measurements remain external facts and are not mutated through the run.
    commands: [Schedule Kiln Run, Start Kiln Run, Record Kiln Operation, Complete Kiln Run]
    domain_events: [KilnRunScheduled, KilnRunStarted, KilnOperationRecorded, KilnRunCompleted]
    transaction_boundary: State transitions and operating facts that define one run must be consistent for that run; downstream moisture correlation may occur separately.
    external_references: [Kiln Asset, ProTrack Moisture Measurement]
    repository: unresolved
    creation_rules:
      - A run requires a distinguishable business identity and association to the relevant kiln/schedule context.
    deletion_rules:
      - Completed run history must be retained for outcome correlation and analysis.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Kiln scheduling/operations must replace Excel while retaining history and supporting downstream moisture correlation.
      confidence: high
      status: candidate

  - id: aggregate.project-tracking.project
    name: Project
    bounded_context: bc.project-tracking
    purpose: Maintain the planned-work lifecycle, milestones/actions, and status of one operational project consistently.
    aggregate_root: Project
    members: [Project, Milestone, Project Action]
    invariants:
      - Project completion/status must reflect the state of project-owned work rather than CAPA closure or unrelated external state.
      - A project remains distinct from a Nonconformity-driven CAPA lifecycle.
    commands: [Create Project, Plan Project Work, Update Project Status, Complete Project, Cancel Project]
    domain_events: [ProjectCreated, ProjectActivated, ProjectCompleted, ProjectCancelled]
    transaction_boundary: Changes that establish the coherent status of one project and its owned plan must be consistent through the Project root.
    external_references: [Asset, Corrective Action reference]
    repository: unresolved
    creation_rules:
      - A project represents discrete planned improvement/capital work and is not created merely because a CAPA exists.
    deletion_rules:
      - Historical project identity/status should be retained once work has begun; exact archival rules unresolved.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.project-tracking/context.yaml
          description: Project Tracking owns a planned-work lifecycle distinct from CAPA.
      confidence: medium
      status: candidate

  - id: aggregate.quality-verification.quality-check
    name: Quality Check
    bounded_context: bc.quality-verification
    purpose: Keep the measurement, applicable target, evaluation basis, and result of one quality verification internally consistent.
    aggregate_root: Quality Check
    members: [Quality Check, Quality Measurement, Quality Verification Result, snapshot/reference of Applicable Quality Target]
    invariants:
      - The result must be evaluated against the target applicable to the recorded mill/machine/process context.
      - The retained check must preserve both the measurement and the evaluation basis used at that time.
      - Failed result does not automatically create a Nonconformity inside this aggregate.
    commands: [Initiate Quality Check, Record Measurement, Evaluate Quality Check]
    domain_events: [QualityCheckInitiated, QualityMeasurementRecorded, QualityCheckEvaluated]
    transaction_boundary: Measurement, evaluation basis, and resulting outcome for one check must remain coherent; Corrective Action transition occurs outside the aggregate.
    external_references: [Mill, Machine, Process Path, Applicable external standard]
    repository: unresolved
    creation_rules:
      - A check must identify the relevant product/process context sufficiently to resolve an applicable target.
    deletion_rules:
      - Evaluated checks are retained as verification evidence; correction should preserve history.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-09 through 2026-08-10
          description: The gap is an unrecorded contextual quality measurement with difficult target discovery.
      confidence: high
      status: candidate

  - id: aggregate.corrective-action.nonconformity
    name: Nonconformity
    bounded_context: bc.corrective-action
    purpose: Coordinate one Nonconformity through correction, root-cause, corrective actions, routing, and closure without taking ownership of routed external work.
    aggregate_root: Nonconformity
    members: [Nonconformity, Correction, Corrective Action coordination records, Routing Rule application, closure evidence]
    invariants:
      - Only findings accepted under an explicit rule enter this lifecycle as Nonconformities.
      - Closure must reflect the CAPA lifecycle while preserving the distinction between coordinated actions and externally owned execution work.
      - Routed work status cannot be invented locally when another context/system owns it.
    commands: [Accept Nonconformity, Record Correction, Record Root Cause, Add Corrective Action, Route Corrective Work, Evaluate Closure, Close Nonconformity]
    domain_events: [NonconformityAccepted, CorrectionRecorded, CorrectiveActionAdded, CorrectiveWorkRouted, NonconformityClosed]
    transaction_boundary: State changes that determine the coherent CAPA lifecycle of one Nonconformity must go through its root; external work executes separately.
    external_references: [Quality Verification Result, Project, Maintenance Work, Safety finding]
    repository: unresolved
    creation_rules:
      - Requires a finding plus a domain rule/decision that accepts it as a Nonconformity.
    deletion_rules:
      - Closed or actioned Nonconformities should remain historical records; destructive deletion unsupported.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.corrective-action/context.yaml
          description: Corrective Action owns the Nonconformity remediation and closure lifecycle.
      confidence: high
      status: candidate

  - id: aggregate.asset-lifecycle.asset
    name: Asset
    bounded_context: bc.asset-lifecycle
    purpose: Keep one physical asset's ManuFactor-owned identity, condition/lifecycle state, and retained history consistent.
    aggregate_root: Asset
    members: [Asset, Asset Condition, Asset Lifecycle State, Asset History entries, Operational Setting History]
    invariants:
      - Asset identity remains stable across lifecycle and condition changes.
      - MP2 WR/WO status must not silently define ManuFactor asset state.
      - Verification results change asset state only through explicit asset-domain transition rules.
      - State changes must be represented in retained asset history.
    commands: [Register Asset, Change Asset Condition, Change Asset Lifecycle State, Record Operational Setting]
    domain_events: [AssetRegistered, AssetConditionChanged, AssetLifecycleStateChanged, AssetOperationalSettingRecorded]
    transaction_boundary: A state/condition change and its corresponding retained history entry must be consistent for one asset.
    external_references: [MP2 Work Request, MP2 Work Order, Reliability Verification Result]
    repository: unresolved
    creation_rules:
      - Asset must have stable ManuFactor identity and enough physical/business identity to correlate external machine references.
    deletion_rules:
      - Retirement should preserve historical identity; physical deletion of established assets is not supported by current evidence.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: MP2 does not provide meaningful asset management beyond WR/WO posting to machine assets.
      confidence: high
      status: candidate

  - id: aggregate.reliability-verification.verification
    name: Reliability Verification
    bounded_context: bc.reliability-verification
    purpose: Keep one verification checkpoint, its criteria/category checks, evidence, and final result consistent.
    aggregate_root: Reliability Verification
    members: [Reliability Verification, Verification Checkpoint, AFAL Category Check, Verification Result]
    invariants:
      - Result must derive from the criteria/category checks applicable to that verification checkpoint.
      - Verification result remains distinct from Asset Condition.
      - A verification cannot rewrite MP2 maintenance work or Asset Lifecycle state directly.
    commands: [Schedule Verification, Start Verification, Record Category Check, Complete Verification]
    domain_events: [VerificationScheduled, VerificationStarted, VerificationCheckRecorded, VerificationCompleted]
    transaction_boundary: Completing a verification requires its required criteria/check evidence and result to be internally coherent.
    external_references: [Asset, MP2 Work Request, MP2 Work Order]
    repository: unresolved
    creation_rules:
      - Must identify the Asset, checkpoint/trigger, and applicable verification criteria.
    deletion_rules:
      - Completed verification evidence should be retained; exact cancellation/void semantics unresolved.
    status: candidate
    provenance:
      sources:
        - type: existing-model
          reference: ManuFactor-arch AFAL evidence
          description: AFAL/checkpoint records have discrete verification criteria and results.
      confidence: high
      status: candidate

  - id: aggregate.ltv-form-management.form-template
    name: LTV Form Template
    bounded_context: bc.safety-signoff
    purpose: Maintain a versioned LTV form definition while preserving the historical template versions required for printed-instance traceability.
    aggregate_root: LTV Form Template
    members: [LTV Form Template, template version metadata]
    invariants:
      - Each published/usable template version must remain distinguishable from prior versions.
      - Historical versions referenced by printed instances cannot be silently overwritten.
    commands: [Create LTV Form Template, Revise LTV Form Template, Publish LTV Form Template, Retire LTV Form Template]
    domain_events: [LTVFormTemplateCreated, LTVFormTemplateVersionPublished, LTVFormTemplateRetired]
    transaction_boundary: Publishing or revising one template must produce a coherent distinguishable version without mutating historical versions used by issued forms.
    external_references: [Safety requirement]
    repository: unresolved
    creation_rules:
      - A template must have stable identity distinct from its individual versions.
    deletion_rules:
      - A template/version referenced by an issued/printed instance must remain available for historical traceability.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: The real Safety gap is managing and printing LTV forms.
      confidence: high
      status: candidate

  - id: aggregate.ltv-form-management.printed-instance
    name: LTV Printed Instance
    bounded_context: bc.safety-signoff
    purpose: Keep one issued/printed LTV form's template provenance and applicable lifecycle state consistent.
    aggregate_root: LTV Printed Instance
    members: [LTV Printed Instance, LTV Form Status, completion/approval/sign-off evidence when applicable]
    invariants:
      - Every instance must remain traceable to the exact template version that produced it.
      - Printing/issuing does not imply completion, approval, or sign-off unless the applicable process requires it.
      - Lifecycle changes must apply to the individual instance, not alter the source template.
    commands: [Generate LTV Form Instance, Mark Printed or Issued, Record Completion, Record Approval or Sign-Off, Retain LTV Form Instance]
    domain_events: [LTVFormInstanceGenerated, LTVFormInstanceIssued, LTVFormInstanceCompleted, LTVFormInstanceApproved]
    transaction_boundary: Template-version provenance and lifecycle state of one LTV instance must remain coherent.
    external_references: [Person, Safety requirement, LTV Form Template identity/version]
    repository: unresolved
    creation_rules:
      - Must be generated from a specific managed LTV Form Template version.
    deletion_rules:
      - Issued/completed instances should be retained according to business record requirements; exact retention period unresolved.
    status: candidate
    provenance:
      sources:
        - type: canonical-context
          reference: docs/ddd/contexts/bc.safety-signoff/context.yaml
          description: LTV Form Management owns printed-instance traceability and lifecycle.
      confidence: high
      status: candidate

  - id: aggregate.training-qualification.qualification
    name: Operational Qualification
    bounded_context: bc.training-competency
    purpose: Keep the evidence-backed qualification relationship between one person and one operational job/role consistent.
    aggregate_root: Operational Qualification
    members: [Operational Qualification, qualification evidence references]
    invariants:
      - Qualification must be supported by acceptable evidence under the applicable operational rule.
      - Learning completion alone does not imply qualification unless explicitly allowed by the rule.
      - Availability is not part of qualification state.
    commands: [Establish Operational Qualification, Add Qualification Evidence, Withdraw Operational Qualification, Review Operational Qualification]
    domain_events: [OperationalQualificationEstablished, QualificationEvidenceAdded, OperationalQualificationWithdrawn]
    transaction_boundary: The decision that one person is operationally qualified for one job and the evidence supporting that decision must remain coherent.
    external_references: [Person, Job/Position, Learning Completion]
    repository: unresolved
    creation_rules:
      - Requires a person, job/role, and sufficient evidence under the applicable qualification rule.
    deletion_rules:
      - Qualification history should be retained when withdrawn or superseded; exact expiration semantics unresolved.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Cross-operator training depth is required to know who can step into another operational job.
      confidence: high
      status: candidate

  - id: aggregate.workforce-availability.coverage-plan
    name: Operational Coverage Plan
    bounded_context: bc.workforce-availability
    purpose: Maintain a staffing need and the selected/possible coverage for a defined operational time/job requirement consistently.
    aggregate_root: Operational Coverage Plan
    members: [Operational Coverage Plan, Staffing Gap, Replacement Option, Vacation Coverage Plan details]
    invariants:
      - A selected replacement must be both operationally available for the required time and sufficiently qualified for the required job.
      - Coverage decisions must not rewrite authoritative HR/timekeeping absence records or qualification records.
      - The staffing need/time/job being covered must remain explicit.
    commands: [Create Staffing Gap, Add Replacement Option, Select Replacement, Schedule Vacation Coverage, Revise Coverage Plan]
    domain_events: [StaffingGapIdentified, ReplacementOptionAdded, ReplacementSelected, CoveragePlanRevised]
    transaction_boundary: Selecting or revising coverage for one staffing need must validate availability and qualification references consistently at decision time.
    external_references: [Person, Operational Qualification, HR/Timekeeping Absence Fact, Crew, Shift]
    repository: unresolved
    creation_rules:
      - Requires a defined operational staffing need in time/job/crew terms.
    deletion_rules:
      - Historical coverage decisions should remain traceable after the staffing period; exact retention rules unresolved.
    status: candidate
    provenance:
      sources:
        - type: domain-expert
          reference: Mark direct, 2026-08-10
          description: Vacation scheduling and sick-call replacement require knowing both who is available and who can perform the job.
      confidence: high
      status: candidate

aggregate_challenge_notes:
  rejected_or_not_supported_as_separate_aggregates:
    - concept: Moisture Outcome
      reason: It is a derived interpretation tied to Kiln Run and external ProTrack measurements; no independent invariant or command lifecycle currently justifies its own aggregate.
    - concept: Applicable Quality Target
      reason: It may become reference data, policy-owned configuration, or another model later, but current evidence does not establish an independent transactional consistency boundary.
    - concept: Asset Condition
      reason: It is state of the Asset and should change through the Asset root under current evidence.
    - concept: Verification Result
      reason: It is produced by and belongs to a Reliability Verification.
    - concept: Replacement Option
      reason: It exists within a staffing/coverage decision and has no supported independent lifecycle.
    - concept: LTV Form Status
      reason: It is state of a Printed Instance, not an independent consistency boundary.
  unresolved_candidates:
    - subject: Kiln Schedule
      reason: Current evidence supports retained schedule history, but it is not yet clear whether schedule planning requires its own aggregate separate from Kiln Run or is primarily a planning view/coordination model around runs.
    - subject: Cross-Training Matrix
      reason: The matrix appears to be a projection across individual Operational Qualification relationships rather than a consistency boundary; retain as a query/read model unless later business rules require matrix-level atomic changes.
