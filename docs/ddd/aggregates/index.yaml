aggregates:
  - id: aggregate.operations-record.operational-record
    name: Operational Record
    bounded_context: bc.operations-record
    purpose: Preserve one operational record and its correction/history semantics as a consistent unit.
    aggregate_root: Operational Record
    members: [Operational Record, occurrence details, correction/history entries]
    invariants: [Corrections preserve prior history; external subject references do not become locally authoritative lifecycle state.]
    commands: [Record Operational Fact, Correct Operational Record]
    domain_events: [OperationalRecordRecorded, OperationalRecordCorrected]
    transaction_boundary: Creating or correcting one operational record and its retained history must be consistent.
    external_references: [Asset, Person, Nonconformity, Safety finding]
    repository: repository.operations-record.operational-record
    creation_rules: [A record represents a specific operational occurrence/report and preserves provenance.]
    deletion_rules: [Destructive deletion is unsupported by current evidence; retention/correction is preferred.]
    status: candidate
    provenance: {sources: [{type: canonical-context, reference: docs/ddd/contexts/bc.operations-record/context.yaml, description: Operations Record owns retained record and correction/history semantics.}], confidence: high, status: candidate}

  - id: aggregate.kiln-operations.kiln-schedule
    name: Kiln Schedule
    bounded_context: bc.kiln-operations
    purpose: Preserve a coherent revision-aware kiln planning state separate from execution history.
    aggregate_root: Kiln Schedule
    members: [schedule revision/planning details]
    invariants: [Prior schedule state remains historically traceable; each revision remains coherent for its planning scope/period; Kiln Run execution remains outside this aggregate.]
    commands: [Create Kiln Schedule, Revise Kiln Schedule]
    domain_events: [KilnScheduleCreated, KilnScheduleRevised]
    transaction_boundary: One schedule revision and its planning relationships are committed consistently.
    external_references: [Kiln Run/Charge, Asset, human Sales/business direction, upstream green-lumber availability]
    repository: repository.kiln-operations.kiln-schedule
    creation_rules: [A schedule establishes the planning period/work scope it represents.]
    deletion_rules: [Historical schedule revisions must not be silently deleted or overwritten.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Mark direct, 2026-08-10, description: Kiln scheduling must replace Excel while keeping retained history.}], confidence: high, status: candidate}

  - id: aggregate.kiln-operations.kiln-run
    name: Kiln Run
    bounded_context: bc.kiln-operations
    purpose: Keep the operational identity and retained history of one kiln run/charge internally consistent.
    aggregate_root: Kiln Run/Charge
    members: [Kiln Run/Charge, Kiln Operating Record references]
    invariants: [A run remains distinguishable from every other run; operating history is retained; ProTrack measurements remain external facts.]
    commands: [Start Kiln Run, Record Kiln Operation, Complete Kiln Run]
    domain_events: [KilnRunStarted, KilnOperationRecorded, KilnRunCompleted]
    transaction_boundary: State transitions and operating facts defining one run must be consistent; downstream moisture correlation may occur separately.
    external_references: [Kiln Schedule, Kiln Asset, ProTrack Moisture Measurement]
    repository: repository.kiln-operations.kiln-run
    creation_rules: [A run requires a distinguishable business identity and relevant kiln/schedule context.]
    deletion_rules: [Completed run history is retained for outcome correlation and analysis.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Mark direct, 2026-08-10, description: Kiln operations history must be retained and correlated with downstream moisture evidence.}], confidence: high, status: candidate}

  - id: aggregate.project-tracking.project
    name: Project
    bounded_context: bc.project-tracking
    purpose: Maintain the lifecycle, plan, and status of one real Project consistently.
    aggregate_root: Project
    members: [Project, Milestone, Project Action]
    invariants: [Project completion/status reflects Project-owned work; a Project remains distinct from ordinary tasks, investigations, MP2 work orders, and CAPA lifecycle.]
    commands: [Create Project, Complete Project]
    domain_events: [ProjectCreated, ProjectCompleted]
    transaction_boundary: Changes establishing coherent Project status and its owned plan go through the Project root.
    external_references: [Asset, Corrective Action reference]
    repository: repository.project-tracking.project
    creation_rules: [A Project represents a distinguishable project lifecycle rather than merely another work item.]
    deletion_rules: [Historical identity/status should be retained once work has begun; exact archival rules remain unresolved.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Phase 14 project reconciliation, 2026-08-22, description: A project is a project using conventional project-management semantics.}], confidence: high, status: candidate}

  - id: aggregate.quality-verification.quality-concern
    name: Quality Concern
    bounded_context: bc.quality-verification
    purpose: Preserve one suspected product-quality concern, its authorized triage history, disposition, and links to later formal quality records without equating intake with a Quality Check or Nonconformity.
    aggregate_root: Quality Concern
    members: [Quality Concern, retained status/triage/disposition history, references to linked Quality Check or Nonconformity]
    invariants: [Concern intake does not automatically create formal quality records; formal triage is restricted to confirmed roles; Nonconformity linkage does not destroy or replace the concern; CAPA lifecycle remains externally owned; status/history remains referenceable.]
    commands: [Record Quality Concern, Disposition Quality Concern, Link Quality Check to Concern, Link Nonconformity to Concern]
    domain_events: [QualityConcernRecorded, QualityConcernDispositioned, QualityCheckLinkedToConcern, NonconformityLinkedToConcern]
    transaction_boundary: One concern's intake, status, authorized triage/disposition, and formal-record references remain coherent through the Quality Concern root.
    external_references: [Quality Check, Nonconformity, employee/person reference]
    repository: repository.quality-verification.quality-concern
    creation_rules: [A concern is a sufficiently identifiable suspected quality issue; non-salaried intake reaches formal triage through the QC channel without specifying implementation.]
    deletion_rules: [Retained concerns and status/disposition history are not destructively deleted; active handling ends through retained status change.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Phase 14 reconciliation and Mark direct 2026-08-23, description: Quality Concern is a retained intake/triage record whose identity/history survives status changes and Nonconformity escalation.}], confidence: high, status: candidate}

  - id: aggregate.quality-verification.quality-check
    name: Quality Check
    bounded_context: bc.quality-verification
    purpose: Keep the measurement, applicable target, evaluation basis, and result of one quality verification internally consistent.
    aggregate_root: Quality Check
    members: [Quality Check, Quality Measurement, Quality Verification Result, applicable-target snapshot/reference]
    invariants: [Result uses the target applicable to recorded mill/machine/process context; retained check preserves measurement and evaluation basis; failed result does not automatically create a Nonconformity.]
    commands: [Initiate Quality Check, Record Quality Measurement, Evaluate Quality Check]
    domain_events: [QualityCheckInitiated, QualityMeasurementRecorded, QualityCheckEvaluated]
    transaction_boundary: Measurement, evaluation basis, and result for one check remain coherent; Corrective Action admission occurs outside this aggregate.
    external_references: [Mill, Machine, Process Path, Applicable Quality Target Parameter, applicable external standard]
    repository: repository.quality-verification.quality-check
    creation_rules: [A check identifies enough product/process context to resolve an applicable target.]
    deletion_rules: [Evaluated checks are retained as verification evidence; correction preserves history.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Mark direct, 2026-08-09 through 2026-08-22, description: The gap is contextual quality verification with retained evidence and target visibility.}], confidence: high, status: candidate}

  - id: aggregate.quality-verification.applicable-quality-target
    name: Applicable Quality Target Parameter
    bounded_context: bc.quality-verification
    purpose: Maintain one contextual quality-target parameter and its version/history so Quality Checks can resolve the target applicable to mill, machine, process, and evaluation time.
    aggregate_root: Applicable Quality Target Parameter
    members: [Applicable Quality Target Parameter, retained target revisions/history]
    invariants: [Applicability is explicit enough to resolve context; historical versions used by Quality Checks remain traceable; only salaried management may create/change parameters under current evidence.]
    commands: [Create Quality Target Parameter, Change Quality Target Parameter]
    domain_events: [QualityTargetParameterCreated, QualityTargetParameterChanged]
    transaction_boundary: Creating/changing one contextual target parameter and its retained version history remains consistent through this root.
    external_references: [Mill, Machine, Process Path, applicable external quality standard]
    repository: repository.quality-verification.applicable-quality-target
    creation_rules: [A target requires a defined criterion/value and enough contextual applicability; creation authority is salaried management.]
    deletion_rules: [A target version referenced by a retained Quality Check remains historically resolvable; retirement/supersession rules remain future work.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: PHASE14-QUALITY-PARAMETERS / PHASE14-QUALITY-PARAMETER-AUTHORITY, description: ManuFactor maintains contextual targets and salaried management may create/change them.}], confidence: high, status: candidate}

  - id: aggregate.corrective-action.nonconformity
    name: Nonconformity
    bounded_context: bc.corrective-action
    purpose: Coordinate one Nonconformity through correction, investigation, corrective-task routing, effectiveness verification, and closure without taking ownership of externally routed work.
    aggregate_root: Nonconformity
    members: [Nonconformity, Correction, Corrective Task records, routing information, effectiveness-verification evidence, closure evidence]
    invariants: [Only explicitly accepted findings enter this lifecycle; corrective work is represented as tasks under the parent; routed work status is not invented locally; required corrective tasks must be complete; post-correction effectiveness must be verified before closure.]
    commands: [Accept Nonconformity, Route Corrective Work, Complete Corrective Task, Verify Corrective Effectiveness, Close Nonconformity]
    domain_events: [NonconformityAccepted, CorrectiveWorkRouted, CorrectiveTaskCompleted, CorrectiveEffectivenessVerified, NonconformityClosed]
    transaction_boundary: State changes determining one Nonconformity's coherent CAPA lifecycle, including task completion and effectiveness verification, go through its root; external execution work remains separately owned.
    external_references: [Quality Concern, Quality Verification Result, Project, Maintenance Work, Safety finding]
    repository: repository.corrective-action.nonconformity
    creation_rules: [Requires a finding plus an explicit supported decision admitting it as a Nonconformity.]
    deletion_rules: [Closed/actioned Nonconformities remain historical records; destructive deletion is unsupported.]
    status: candidate
    provenance: {sources: [{type: canonical-context, reference: docs/ddd/contexts/bc.corrective-action/context.yaml, description: Corrective Action owns the Nonconformity remediation/closure lifecycle.}, {type: domain-expert, reference: Mark direct, 2026-08-23, description: Corrective work is tasks under the CAPA and closure requires verifying afterward that the correction worked.}], confidence: high, status: candidate}

  - id: aggregate.asset-lifecycle.asset
    name: Asset
    bounded_context: bc.asset-lifecycle
    purpose: Keep one physical asset's ManuFactor-owned identity, condition/lifecycle state, and retained history consistent.
    aggregate_root: Asset
    members: [Asset, Asset Condition, Asset Lifecycle State, Asset History entries, Operational Setting History]
    invariants: [Asset identity remains stable; MP2 WR/WO status does not silently define Asset state; verification results require explicit Asset-domain transition rules; state changes retain history.]
    commands: [Register Asset, Change Asset Condition]
    domain_events: [AssetRegistered, AssetConditionChanged]
    transaction_boundary: A condition/state change and its retained history entry remain consistent for one Asset.
    external_references: [MP2 hierarchy node, MP2 Work Request, MP2 Work Order, Reliability Verification Result]
    repository: repository.asset-lifecycle.asset
    creation_rules: [Asset has stable ManuFactor identity and enough physical/business identity to correlate external references.]
    deletion_rules: [Retirement preserves historical identity; physical deletion of established Assets is unsupported.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Phase 14 asset reconciliation, 2026-08-22, description: Reuse MP2 hierarchy/WR-WO facts while ManuFactor owns richer Asset semantics and history.}], confidence: high, status: candidate}

  - id: aggregate.reliability-verification.verification
    name: Reliability Verification
    bounded_context: bc.reliability-verification
    purpose: Keep one verification checkpoint, criteria/category checks, evidence, and final result consistent.
    aggregate_root: Reliability Verification
    members: [Reliability Verification, Verification Checkpoint, AFAL Category Check, Verification Result]
    invariants: [Result derives from applicable retained evidence; Verification Result remains distinct from Asset Condition; verification does not rewrite MP2 work or Asset state directly.]
    commands: [Complete Verification]
    domain_events: [VerificationCompleted]
    transaction_boundary: Completing a verification requires internally coherent applicable evidence and result.
    external_references: [Asset, MP2 Work Request, MP2 Work Order]
    repository: repository.reliability-verification.verification
    creation_rules: [Must identify the Asset, checkpoint/trigger, and applicable verification criteria.]
    deletion_rules: [Completed verification evidence is retained; exact cancellation/void semantics remain unresolved.]
    status: candidate
    provenance: {sources: [{type: existing-model, reference: ManuFactor-arch AFAL evidence, description: AFAL/checkpoint records have discrete verification criteria and results.}], confidence: high, status: candidate}

  - id: aggregate.ltv-form-management.form-template
    name: LTV Form Template
    bounded_context: bc.safety-signoff
    purpose: Maintain a versioned LTV form definition while preserving historical template versions required for instance traceability.
    aggregate_root: LTV Form Template
    members: [LTV Form Template, template version metadata]
    invariants: [Each published version remains distinguishable; historical versions referenced by instances are not silently overwritten.]
    commands: [Publish LTV Form Template]
    domain_events: [LTVFormTemplateVersionPublished]
    transaction_boundary: Publishing/revising one template produces a coherent distinguishable version without mutating historical versions.
    external_references: [Safety requirement]
    repository: repository.ltv-form-management.form-template
    creation_rules: [A template has stable identity distinct from individual versions.]
    deletion_rules: [A referenced template/version remains historically available.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Mark direct, 2026-08-10, description: The concrete Safety gap includes managing and printing LTV forms.}], confidence: high, status: candidate}

  - id: aggregate.ltv-form-management.printed-instance
    name: LTV Printed Instance
    bounded_context: bc.safety-signoff
    purpose: Keep one generated/issued LTV form's template provenance, applicability, and supported lifecycle state consistent.
    aggregate_root: LTV Printed Instance
    members: [LTV Printed Instance, LTV Form Status, supported issuance history, later completion/sign-off evidence when rules are known]
    invariants: [Every instance remains traceable to exact template version; printing/issuing does not imply completion/approval/sign-off; lifecycle changes apply to the instance, not source template.]
    commands: [Generate LTV Form Instance, Mark Printed or Issued]
    domain_events: [LTVFormInstanceGenerated, LTVFormInstanceIssued]
    transaction_boundary: Template-version provenance and supported lifecycle state of one LTV instance remain coherent.
    external_references: [Person, Safety requirement, LTV Form Template identity/version]
    repository: repository.ltv-form-management.printed-instance
    creation_rules: [Instance is generated from a specific managed LTV Form Template version.]
    deletion_rules: [Issued instances remain retained; exact retention period and later completion/sign-off rules remain unresolved.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Phase 14 LTV reconciliation, 2026-08-22, description: Exact form/version, applicability, completion/sign-off evidence, and workflow maturation are normal record semantics, while exact later transition rules remain unresolved.}], confidence: high, status: candidate}

  - id: aggregate.training-qualification.qualification
    name: Operational Qualification
    bounded_context: bc.training-competency
    purpose: Keep the evidence-backed qualification relationship between one person and one operational job/role consistent.
    aggregate_root: Operational Qualification
    members: [Operational Qualification, qualification evidence references]
    invariants: [Qualification is supported by acceptable evidence; learning completion alone does not automatically imply qualification; availability is not qualification.]
    commands: [Establish Operational Qualification]
    domain_events: [OperationalQualificationEstablished]
    transaction_boundary: The qualification decision and its supporting evidence remain coherent for one person-job relationship.
    external_references: [Person, Job/Position, Learning Completion]
    repository: repository.training-qualification.qualification
    creation_rules: [Requires person, job/role, acceptable evidence, and grant by supervisor or designated trainer/SME.]
    deletion_rules: [Qualification history is retained when later withdrawn/superseded.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Phase 14 training reconciliation, 2026-08-22, description: Qualification is explicit retained evidence and may be granted by supervisor or designated trainer/SME.}], confidence: high, status: candidate}

  - id: aggregate.workforce-availability.coverage-plan
    name: Operational Coverage Plan
    bounded_context: bc.workforce-availability
    purpose: Keep one operational staffing need and its evaluated/selected replacement coverage consistent.
    aggregate_root: Operational Coverage Plan
    members: [Operational Coverage Plan, Staffing Gap, Replacement Option, selected replacement, retained decision evidence]
    invariants: [A plan is anchored to an explicit staffing need; selected replacement is qualified and available; supervisor judgment is retained; external source facts are not rewritten.]
    commands: [Create Operational Coverage Plan, Add Replacement Option, Select Replacement]
    domain_events: [OperationalCoveragePlanCreated, ReplacementOptionAdded, ReplacementSelected]
    transaction_boundary: One staffing need, its candidate evaluation, and final selected coverage remain coherent through the root.
    external_references: [Person, Job/Position, Operational Qualification, availability/timekeeping facts]
    repository: repository.workforce-availability.coverage-plan
    creation_rules: [Requires a defined staffing gap/job/time need.]
    deletion_rules: [Retained coverage decisions remain historical business records.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: Mark direct, 2026-08-10 through 2026-08-22, description: Replacement selection must combine qualification, availability, and retained supervisor judgment.}], confidence: high, status: candidate}

  - id: aggregate.safety-signoff.safety-signoff
    name: Safety Sign-Off
    bounded_context: bc.safety-signoff
    purpose: Retain a discrete Safety Sign-Off lifecycle separately from LTV form-template/instance management where the business process requires an actual sign-off record.
    aggregate_root: Safety Sign-Off
    members: [Safety Sign-Off, sign-off evidence/history]
    invariants: [Sign-Off requires the applicable safety evidence/process; LTV printing alone does not establish sign-off.]
    commands: [Record Safety Sign-Off]
    domain_events: [SafetySignOffRecorded]
    transaction_boundary: One Safety Sign-Off and its required evidence remain coherent.
    external_references: [Person, Safety requirement, LTV form instance where applicable]
    repository: repository.safety-signoff.safety-signoff
    creation_rules: [Requires a distinguishable safety sign-off occurrence and applicable evidence.]
    deletion_rules: [Completed sign-off remains historical.]
    status: candidate
    provenance: {sources: [{type: domain-expert, reference: ISSUE-0002 and Phase 14 Safety reconciliation, description: Safety Sign-Off is a separate Safety responsibility from CAPA and Environmental Compliance.}], confidence: medium, status: candidate}

  - id: aggregate.operations-record.project-action
    name: Operational Project Action
    bounded_context: bc.operations-record
    purpose: Preserve a concrete operational action/record related to a Project without importing the Project lifecycle into Operations Record.
    aggregate_root: Operational Project Action
    members: [Operational Project Action, retained occurrence/history details]
    invariants: [Project reference remains external; Operational Record does not determine Project status.]
    commands: [Record Operational Project Action]
    domain_events: [OperationalProjectActionRecorded]
    transaction_boundary: One operational project-related occurrence and its retained evidence remain coherent.
    external_references: [Project]
    repository: repository.operations-record.project-action
    creation_rules: [Represents a concrete operational occurrence related to a Project.]
    deletion_rules: [Retained history is preserved.]
    status: candidate
    provenance: {sources: [{type: model-reconciliation, reference: Phase 14 Operations, description: Project tracking and Operations Record remain distinct despite cross-reference.}], confidence: medium, status: candidate}
