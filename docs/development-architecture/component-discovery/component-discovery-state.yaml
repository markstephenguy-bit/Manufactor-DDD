phase: whole-ddd-reusable-component-discovery
status: broad-ddd-macro-service-shoring-active
updated_at: 2026-08-24
semantic_authority: docs/ddd
process_gate:
  artifact: docs/development-architecture/component-discovery/discovery-completion-gate.md
  rule: do-not-enter-ddd-driven-design-until-no-major-discovery-work-remains
  exit_requires_mark_confirmation: true
  design_oriented_artifacts_created_during_prior-drift: parked-do-not-advance

working_method:
  mode: broad-brush-first
  rule: >
    Work at the whole-system and macro-service level first. The immediate purpose is to shore up
    the shared service families and make the interaction between the canonical DDD and those
    services explicit. Do not drill into row-level, field-level, contract-level, endpoint-level,
    persistence-level, or implementation-level detail unless a broad macro-service boundary cannot
    be resolved without it.
  preferred_unit_of_analysis:
    - macro-service-family
    - bounded-context-to-service-interaction
    - whole-system-capability
    - major-overlap-or-gap
    - semantic-ownership-boundary
  defer_until_later:
    - row-by-row-workbook-cleanup
    - field-source-mapping
    - implementation-seams
    - endpoint-contracts
    - persistence-shapes
    - detailed-workflow-design
    - source-specific-integration-contract-design

architecture_evidence:
  - repository: markstephenguy-bit/Manufactor
    role: current implementation evidence only
  - repository: markstephenguy-bit/ManuFactor-arch
    role: current architecture substrate evidence only
    declared_live_database: ManuFactor-Architecture-Workbook.xlsx
    live_workbook_tabular_inspection: complete

current_objective: >
  Shore up the macro-service landscape in broad strokes and validate how every canonical Bounded
  Context interacts with those services. Resolve only major service-family boundaries, overlaps,
  missing responsibilities, and ownership risks. Do not enter implementation/design shaping.

normalized_macro_services:
  foundation:
    - data-and-state-persistence
    - catalog-reference-and-hierarchy
    - identity-access-and-responsibility
    - retained-history
  interaction_capture:
    - forms-and-structured-capture
    - documents-artifacts-and-evidence
    - notification-and-attention
  integration_coordination:
    - integration-source-acquisition-and-provenance
    - work-routing-and-external-reference-coordination
  read_knowledge:
    - operational-query-and-read-composition
    - analytics-projection-and-data-lake
  platform_execution:
    - scheduling-and-background-execution

supporting_capabilities_not_macro_services:
  - long-running-workflow-runtime
  - rules-evaluation
  - storage
  - documents-compose
  - printing
  - search
  - computation
  - realtime

ambient_platform_concerns:
  - technical-audit
  - observability
  - security
  - devops
  - testing
  - generic-configuration-governance

