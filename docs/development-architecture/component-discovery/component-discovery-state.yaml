resolved_architecture_directions:
  deployment:
    decision: preserve-current-compact-multiprocess-topology
    guardrail: bounded-context-does-not-imply-deployable
    new_deployable_requires:
      - independent-scaling-driver
      - failure-isolation-driver
      - security-boundary-driver
      - incompatible-runtime-driver
      - independently-managed-availability-driver
  persistence:
    decision: preserve-current-postgresql-and-normalized-database-approach
    guardrail: physical-co-location-does-not-transfer-domain-ownership
    ownership_classes:
      - bounded-context-owned
      - shared-technical-owned
      - projection-read-owned
      - external-source-copy-cache
  transactions:
    decision: follow-aggregate-consistency-boundaries
    prohibited_default: cross-context-acid-transaction-because-tables-share-database
  history:
    decision: shared-postgresql-retained-history-mechanics
    rejected_default: event-sourcing-only-because-history-is-common
  identity_and_references:
    decision: reuse-catalog-uuid-reference-thing-link-mechanics-first
    guardrail: technical-resolution-does-not-own-domain-identity-meaning
  evidence:
    decision: reuse-storage-and-document-capabilities
    guardrail: evidence-storage-does-not-decide-business-sufficiency
  integration:
    decision: shared-integration-runtime-plus-source-specific-translators
    current_translators:
      - mp2-to-asset-lifecycle
      - protrack-to-kiln-operations
      - learning-source-to-training-qualification
      - hr-timekeeping-to-workforce-availability
    guardrail: preserve-source-authority-and-never-fabricate-lineage
  projections:
    decision: distinguish-local-operational-cross-context-operational-and-analytical-reads
    cross_context_composition: begin-as-in-process-application-read-pattern
    guardrail: projection-does-not-create-write-authority
  authorization:
    decision: shared-login-profile-permission-enforcement-with-bc-owned-business-requirements
    reconciliation_needed: architecture-substrate-still-describes-identity-permissions-as-ad-driven-while-current-implementation-plan-makes-profile-role-tier-manufactor-owned
  workflow:
    decision: existing-workflow-engine-is-orchestration-infrastructure
    guardrail: domain-lifecycle-validity-remains-bounded-context-owned
  target_topology:
    decision: ten-domain-aligned-implementation-homes-plus-shared-technical-substrate
    modules:
      - implementation: AssetManagement
        bounded_context: bc.asset-lifecycle
      - implementation: Capa
        bounded_context: bc.corrective-action
      - implementation: KilnDrying
        bounded_context: bc.kiln-operations
      - implementation: OperationalReporting
        bounded_context: bc.operations-record
      - implementation: ProjectTracking
        bounded_context: bc.project-tracking
      - implementation: QualityVerification
        bounded_context: bc.quality-verification
        status: add-when-implementation-reaches-context
      - implementation: Afal
        bounded_context: bc.reliability-verification
      - implementation: LtvForms
        bounded_context: bc.safety-signoff
      - implementation: Training
        bounded_context: bc.training-competency
      - implementation: Workforce
        bounded_context: bc.workforce-availability

